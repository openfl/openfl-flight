package: utils

entries:

  - id: utils.BA.new-length-position
    section: "Storage and construction"
    behavior: >
      `new(length = 0)` allocates exactly that logical length, zero-fills new bytes, sets
      `position = 0`, copies `ByteArray.defaultEndian`, and copies
      `ByteArray.defaultObjectEncoding`. Capacity may exceed public length during later growth
      and is not observable through the API.
    source:
      - utils/ByteArray.hx:defaultEndian
      - utils/ByteArray.hx:defaultObjectEncoding
      - utils/ByteArray.hx:length
      - utils/ByteArray.hx:position
      - utils/ByteArray.hx:new
    scenarios:
      - utils/byte-array:construct
      - utils/byte-array:zeroMemory
      - utils/byte-array:endianness
      - utils/byte-array:objectEncodingWrite

  - id: utils.BA.length-position
    section: "Storage and construction"
    behavior: >
      `length` is logical byte count. Increasing it preserves existing bytes and exposes
      zero-filled new bytes; decreasing it truncates and clamps `position` down to the new
      length. Writes at or beyond the end grow length to cover the written range.
    source:
      - utils/ByteArray.hx:length
      - utils/ByteArray.hx:position
      - utils/ByteArray.hx:new
    scenarios:
      - utils/byte-array:zeroMemory
      - utils/byte-array:position

  - id: utils.BA.position-bytesavailable
    section: "Storage and construction"
    behavior: >
      `position` is the next read/write offset and may be assigned directly. `bytesAvailable`
      is `length - position`; ordinary reads advance it and writes advance it to just after
      the data written.
    source:
      - utils/ByteArray.hx:bytesAvailable
      - utils/ByteArray.hx:length
      - utils/ByteArray.hx:position
    scenarios:
      - utils/byte-array:position

  - id: utils.BA.integer-array-access-reads-a-byte-by
    section: "Storage and construction"
    behavior: >
      Integer array access reads a byte by zero-based index and writing masks to the low eight
      bits, automatically growing through `index + 1`. It does not move `position`.
    source:
      - utils/ByteArray.hx:position
    scenarios:
      - utils/byte-array:position
      - utils/byte-array:writeAndRead

  - id: utils.BA.clear
    section: "Storage and construction"
    behavior: >
      `clear()` makes length and position zero. It does not reset endian or object encoding.
    source:
      - utils/ByteArray.hx:endian
      - utils/ByteArray.hx:length
      - utils/ByteArray.hx:position
      - utils/ByteArray.hx:clear
    scenarios:
      - utils/byte-array:clear

  - id: utils.BA.frombytes-frombytesdata
    section: "Storage and construction"
    behavior: >
      `fromBytes`/`fromBytesData` and, on supported JS/Lime targets,
      `fromArrayBuffer`/`fromLimeBytes` wrap or copy the supplied data into a ByteArray with
      position zero. `fromFile` reads synchronously where Lime can; `loadFromBytes` and
      `loadFromFile` return Futures and fail/return null on targets where the underlying
      operation is unavailable.
    source:
      - utils/ByteArray.hx:position
      - utils/ByteArray.hx:fromArrayBuffer
      - utils/ByteArray.hx:fromBytes
      - utils/ByteArray.hx:fromBytesData
      - utils/ByteArray.hx:fromFile
      - utils/ByteArray.hx:fromLimeBytes
      - utils/ByteArray.hx:loadFromBytes
      - utils/ByteArray.hx:loadFromFile
    scenarios:
      - utils/surface:byteFactories

  - id: utils.BA.defaultendian-openfl-big
    section: "Storage and construction"
    behavior: >
      `defaultEndian` is lazily the host/Lime system endianness unless `openfl_big_endian`
      forces big-endian; it is little-endian on non-Lime portable builds. Assigning it affects
      subsequently constructed arrays only. `defaultObjectEncoding` defaults to
      `ObjectEncoding.DEFAULT` (HXSF off Flash), likewise copied at construction.
    source:
      - utils/ByteArray.hx:defaultEndian
      - utils/ByteArray.hx:defaultObjectEncoding
      - utils/ByteArray.hx:endian
      - utils/ByteArray.hx:objectEncoding
      - net/ObjectEncoding.hx:HXSF
      - net/ObjectEncoding.hx:DEFAULT
    scenarios:
      - utils/byte-array:endianness
      - utils/byte-array:objectEncodingWrite

  - id: utils.BA.every-read-starts-at-position-advances-by
    section: "Primitive reads"
    behavior: >
      Every read starts at `position`, advances by its byte width only when successful, and
      throws `EOFError` if insufficient bytes exist.
    source:
      - utils/ByteArray.hx:position
    scenarios:
      - utils/byte-array:position
      - utils/byte-array:readPastEnd

  - id: utils.BA.readboolean-readbyte
    section: "Primitive reads"
    behavior: >
      `readBoolean()` consumes one byte and returns false only for zero. `readByte()`
      sign-extends an 8-bit value to -128..127; `readUnsignedByte()` returns 0..255.
    source:
      - utils/ByteArray.hx:readBoolean
      - utils/ByteArray.hx:readByte
      - utils/ByteArray.hx:readUnsignedByte
    scenarios:
      - utils/byte-array:writeReadBoolean

  - id: utils.BA.readshort-readunsignedshort
    section: "Primitive reads"
    behavior: >
      `readShort()` sign-extends 16 bits; `readUnsignedShort()` returns 0..65535. `readInt()`
      reads a signed 32-bit bit pattern; `readUnsignedInt()` reads the same 32-bit pattern
      through Haxe's target integer representation. `readInt64()` returns `haxe.Int64`. All
      honor `endian`.
    source:
      - utils/ByteArray.hx:endian
      - utils/ByteArray.hx:readInt
      - utils/ByteArray.hx:readInt64
      - utils/ByteArray.hx:readShort
      - utils/ByteArray.hx:readUnsignedInt
      - utils/ByteArray.hx:readUnsignedShort
    scenarios:
      - utils/byte-array:writeReadShort
      - utils/byte-array:writeReadInt

  - id: utils.BA.readfloat-readdouble
    section: "Primitive reads"
    behavior: >
      `readFloat()` and `readDouble()` decode IEEE-754 32-bit and 64-bit values in the
      selected byte order.
    source:
      - utils/ByteArray.hx:readDouble
      - utils/ByteArray.hx:readFloat
    scenarios:
      - utils/byte-array:writeReadFloat
      - utils/byte-array:writeReadDouble

  - id: utils.BA.readbytes-destination-offset-length
    section: "Primitive reads"
    behavior: >
      `readBytes(destination, offset = 0, length = 0)` copies `length` bytes from the current
      position, or all remaining bytes when length is zero. It grows the destination to
      `offset + length`, leaves destination position unchanged, and advances source position.
      Insufficient source data throws `EOFError`.
    source:
      - utils/ByteArray.hx:length
      - utils/ByteArray.hx:position
      - utils/ByteArray.hx:readBytes
    scenarios:
      - utils/byte-array:zeroMemory
      - utils/byte-array:readPastEnd
      - utils/byte-array:writeReadBytes

  - id: utils.BA.readutf-readutfbytes-length
    section: "Primitive reads"
    behavior: >
      `readUTF()` reads an endian-sensitive unsigned 16-bit byte length then that many UTF-8
      bytes. `readUTFBytes(length)` reads exactly the supplied raw byte count.
      Invalid/truncated input follows `haxe.io.Bytes.getString` decoding/EOF behavior.
      Internal `readLargeUTF()` uses a 32-bit length.
    source:
      - utils/ByteArray.hx:endian
      - utils/ByteArray.hx:length
      - utils/ByteArray.hx:readUTF
      - utils/ByteArray.hx:readUTFBytes
      - utils/ByteArray.hx:readLargeUTF
    scenarios:
      - utils/byte-array:writeReadUTF

  - id: utils.BA.readmultibyte-length-charset-charset
    section: "Primitive reads"
    behavior: >
      `readMultiByte(length, charSet)` ignores `charSet` and behaves as
      `readUTFBytes(length)`; portable 9.5.2 has the same limitation.
    source:
      - utils/ByteArray.hx:length
      - utils/ByteArray.hx:readMultiByte
      - utils/ByteArray.hx:readUTFBytes
    scenarios:
      - utils/byte-array:writeReadUTF

  - id: utils.BA.writeboolean
    section: "Primitive writes"
    behavior: >
      `writeBoolean` writes one byte `1` or `0`; `writeByte` writes the low 8 bits;
      `writeShort` writes the low 16; `writeInt`/`writeUnsignedInt` write the 32-bit bit
      pattern; and `writeInt64` writes high/low halves in selected byte order. All grow length
      and advance position.
    source:
      - utils/ByteArray.hx:length
      - utils/ByteArray.hx:position
      - utils/ByteArray.hx:writeBoolean
      - utils/ByteArray.hx:writeByte
      - utils/ByteArray.hx:writeInt
      - utils/ByteArray.hx:writeInt64
      - utils/ByteArray.hx:writeShort
      - utils/ByteArray.hx:writeUnsignedInt
    scenarios:
      - utils/byte-array:writeReadBoolean
      - utils/byte-array:writeReadShort
      - utils/byte-array:writeReadInt

  - id: utils.BA.writefloat-writedouble
    section: "Primitive writes"
    behavior: >
      `writeFloat`/`writeDouble` write IEEE-754 bit patterns in selected endian order.
    source:
      - utils/ByteArray.hx:endian
      - utils/ByteArray.hx:writeDouble
      - utils/ByteArray.hx:writeFloat
    scenarios:
      - utils/byte-array:writeReadFloat
      - utils/byte-array:writeReadDouble

  - id: utils.BA.writebytes-source-offset
    section: "Primitive writes"
    behavior: >
      `writeBytes(source, offset = 0, length = 0)` writes the requested slice at current
      position; zero length means all bytes after offset. Source position is ignored and
      unchanged. Runtime byte-blit bounds behavior applies to an invalid offset/length.
    source:
      - utils/ByteArray.hx:length
      - utils/ByteArray.hx:position
      - utils/ByteArray.hx:writeBytes
    scenarios:
      - utils/byte-array:writeBytesSlice

  - id: utils.BA.writeutf-value-rangeerror
    section: "Primitive writes"
    behavior: >
      `writeUTF(value)` UTF-8 encodes the string, writes a 16-bit byte length, and throws
      `RangeError` above 65535 bytes. `writeUTFBytes(value)` writes no prefix. Internal
      `writeLargeUTF` uses a 32-bit length.
    source:
      - utils/ByteArray.hx:length
      - utils/ByteArray.hx:writeUTF
      - utils/ByteArray.hx:writeUTFBytes
      - utils/ByteArray.hx:writeLargeUTF
    scenarios:
      - utils/byte-array:writeReadUTF

  - id: utils.BA.writemultibyte-value-charset-charset
    section: "Primitive writes"
    behavior: >
      `writeMultiByte(value, charSet)` ignores `charSet` and writes UTF-8, matching portable
      9.5.2.
    source:
      - utils/ByteArray.hx:writeMultiByte
    scenarios:
      - utils/surface:byteStrings

  - id: utils.BA.tostring
    section: "Primitive writes"
    behavior: >
      `toString()` decodes the entire logical byte sequence, independent of current position,
      using the underlying Bytes string conversion. Portable code does not implement the
      documented system-code-page/BOM matrix.
    source:
      - utils/ByteArray.hx:position
      - utils/ByteArray.hx:toString
    scenarios:
      - utils/surface:byteStrings

  - id: utils.BA.objectencoding-hxsf
    section: "Object formats"
    behavior: >
      `objectEncoding` selects the wire format. `HXSF` and `LARGE_HXSF` use Haxe
      `Serializer`/`Unserializer` with 16-bit and 32-bit byte-length prefixes; `JSON` and
      `LARGE_JSON` use JSON with the same prefix choices. Serialization writes at current
      position; deserialization consumes one complete value.
    source:
      - utils/ByteArray.hx:length
      - utils/ByteArray.hx:objectEncoding
      - utils/ByteArray.hx:position
      - net/ObjectEncoding.hx:HXSF
      - net/ObjectEncoding.hx:LARGE_HXSF
      - net/ObjectEncoding.hx:JSON
      - net/ObjectEncoding.hx:LARGE_JSON
    scenarios:
      - utils/byte-array:objectEncodingWrite

  - id: utils.BA.in-openfl-9-5-2-amf0-and
    section: "Object formats"
    behavior: >
      In OpenFL 9.5.2, `AMF0` and `AMF3` use internal AMF readers/writers. The adapter's
      `writeObject` emits nothing and `readObject` returns null for both without advancing
      position. Flight exposes no selectable AMF serializer; see **Object wire formats**.
    source:
      - utils/ByteArray.hx:position
      - utils/ByteArray.hx:readObject
      - utils/ByteArray.hx:writeObject
      - net/ObjectEncoding.hx:AMF0
      - net/ObjectEncoding.hx:AMF3
    notes: 'Blocked on Flight gap "Object wire formats".'
    scenarios: []

  - id: utils.BA.unknown-object-encoding-values-make-writeobject-a
    section: "Object formats"
    behavior: >
      Unknown object encoding values make `writeObject` a no-op and `readObject` return null.
    source:
      - utils/ByteArray.hx:readObject
      - utils/ByteArray.hx:writeObject
    scenarios:
      - utils/surface:byteStrings

  - id: utils.BA.compress-algorithm-uncompress
    section: "Compression and atomics"
    behavior: >
      `compress(algorithm = ZLIB)` replaces the entire logical array with compressed bytes,
      independent of position, and sets position to the new end. `uncompress(algorithm =
      ZLIB)` replaces the entire array with decoded bytes and sets position to zero.
      `deflate()` and `inflate()` select raw RFC 1951 framing; ZLIB selects RFC 1950 framing.
    source:
      - utils/ByteArray.hx:position
      - utils/ByteArray.hx:new
      - utils/ByteArray.hx:compress
      - utils/ByteArray.hx:deflate
      - utils/ByteArray.hx:inflate
      - utils/ByteArray.hx:uncompress
      - utils/CompressionAlgorithm.hx:DEFLATE
      - utils/CompressionAlgorithm.hx:ZLIB
    scenarios:
      - utils/byte-array:zlibCompression

  - id: utils.BA.zlib-and-raw-deflate-encode-through-haxe
    section: "Compression and atomics"
    behavior: >
      ZLIB and raw deflate encode through Haxe and decode through Flight while preserving
      those in-place length/position rules.
    source:
      - utils/ByteArray.hx:length
      - utils/ByteArray.hx:position
      - utils/ByteArray.hx:deflate
      - utils/CompressionAlgorithm.hx:DEFLATE
      - utils/CompressionAlgorithm.hx:ZLIB
    scenarios:
      - utils/byte-array:compressionMethods

  - id: utils.BA.lzma-compression-decompression-is-a-deterministic-no
    section: "Compression and atomics"
    behavior: >
      LZMA compression/decompression is a deterministic no-op in the adapter (`compress`
      preserves data/position; `uncompress` preserves data but resets position to zero).
      OpenFL 9.5.2 delegates real LZMA to Lime. See **Byte compression encoders and LZMA**.
    source:
      - utils/ByteArray.hx:position
      - utils/ByteArray.hx:compress
      - utils/ByteArray.hx:uncompress
      - utils/CompressionAlgorithm.hx:LZMA
    notes: 'Blocked on Flight gap "Byte compression encoders and LZMA".'
    scenarios:
      - utils/byte-array:lzmaCompression

  - id: utils.BA.invalid-compressed-input-is-documented-to-throw
    section: "Compression and atomics"
    behavior: >
      Invalid ZLIB input is documented to throw IOError, but executable OpenFL 9.5.2 on the
      comparison target returns without throwing, preserves the four input bytes, and resets
      position to zero. The adapter matches that observed target behavior; decoder failures on
      hosts that report one are translated separately.
    source:
      - utils/ByteArray.hx:position
      - utils/CompressionAlgorithm.hx:ZLIB
    scenarios:
      - utils/byte-array:malformedCompression

  - id: utils.BA.shareable-atomiccompareandswapintat
    section: "Compression and atomics"
    behavior: >
      `shareable`, `atomicCompareAndSwapIntAt`, and `atomicCompareAndSwapLength` are Flash
      11.4-only declarations. They operate on shared memory atomically on Flash and are
      deliberately absent off Flash; see **Shareable ByteArray atomics**.
    source:
      - utils/ByteArray.hx:new
    notes: 'Blocked on Flight gap "Shareable ByteArray atomics".'
    scenarios: []

  - id: utils.BA.utf-uses-haxe-bytes-because-the-refreshed
    section: "Compression and atomics"
    behavior: >
      UTF uses Haxe Bytes because the refreshed generated Flight facade has no public codec
      binding; observable UTF-8 behavior is present, but see **Public flight-hx UTF-8 byte
      codec binding** for the substrate limitation.
    source:
      - utils/ByteArray.hx:new
    notes: 'Blocked on Flight gap "Public flight-hx UTF-8 byte codec binding".'
    scenarios: []

  - id: utils.BA.compressionalgorithm-deflate
    section: "Compression and atomics"
    behavior: >
      `CompressionAlgorithm` is integer-backed as DEFLATE/LZMA/ZLIB = 0/1/2 on every
      non-`openfljs` portable target, with canonical string conversions. On `openfljs` the
      constants are `"deflate"`, `"lzma"`, and `"zlib"` directly.
    source:
      - utils/ByteArray.hx:deflate
      - utils/CompressionAlgorithm.hx:DEFLATE
      - utils/CompressionAlgorithm.hx:LZMA
      - utils/CompressionAlgorithm.hx:ZLIB
    scenarios:
      - utils/byte-array:lzmaCompression

  - id: utils.IO.idatainput-bytesavailable
    section: "Data interfaces"
    behavior: >
      `IDataInput` requires read-only `bytesAvailable`, mutable `endian` and `objectEncoding`,
      and the complete read family: boolean, signed/unsigned integers, float/double, bytes,
      multibyte, UTF/UTFBytes, and object. Implementors must consume sequential input and
      signal insufficient data; the interface supplies no implementation.
    source:
      - utils/IDataInput.hx:bytesAvailable
      - utils/IDataInput.hx:endian
      - utils/IDataInput.hx:objectEncoding
      - utils/IDataInput.hx:readBoolean
      - utils/IDataInput.hx:readByte
      - utils/IDataInput.hx:readBytes
      - utils/IDataInput.hx:readDouble
      - utils/IDataInput.hx:readFloat
      - utils/IDataInput.hx:readInt
      - utils/IDataInput.hx:readMultiByte
      - utils/IDataInput.hx:readObject
      - utils/IDataInput.hx:readShort
      - utils/IDataInput.hx:readUnsignedByte
      - utils/IDataInput.hx:readUnsignedInt
      - utils/IDataInput.hx:readUnsignedShort
      - utils/IDataInput.hx:readUTF
      - utils/IDataInput.hx:readUTFBytes
      - utils/IDataOutput.hx:endian
      - utils/IDataOutput.hx:objectEncoding
    scenarios:
      - utils/surface:dataInterfaces

  - id: utils.IO.idataoutput-endian
    section: "Data interfaces"
    behavior: >
      `IDataOutput` requires mutable `endian` and `objectEncoding` and the matching write
      family. `writeBytes` reads a source slice; other methods encode a value according to
      byte order/format.
    source:
      - utils/IDataInput.hx:endian
      - utils/IDataInput.hx:objectEncoding
      - utils/IDataOutput.hx:endian
      - utils/IDataOutput.hx:objectEncoding
      - utils/IDataOutput.hx:writeBoolean
      - utils/IDataOutput.hx:writeByte
      - utils/IDataOutput.hx:writeBytes
      - utils/IDataOutput.hx:writeDouble
      - utils/IDataOutput.hx:writeFloat
      - utils/IDataOutput.hx:writeInt
      - utils/IDataOutput.hx:writeMultiByte
      - utils/IDataOutput.hx:writeObject
      - utils/IDataOutput.hx:writeShort
      - utils/IDataOutput.hx:writeUnsignedInt
      - utils/IDataOutput.hx:writeUTF
      - utils/IDataOutput.hx:writeUTFBytes
    scenarios:
      - utils/surface:dataInterfaces

  - id: utils.IO.iexternalizable-writeexternal-output
    section: "Data interfaces"
    behavior: >
      `IExternalizable` requires `writeExternal(output)` and `readExternal(input)`. Object
      serializers call user code to define field order and encoding; read must mirror write.
      The interface itself adds no framing.
    source:
      - utils/IExternalizable.hx:writeExternal
      - utils/IExternalizable.hx:readExternal
    scenarios:
      - utils/surface:dataInterfaces

  - id: utils.TMR.new-delay-repeatcount-currentcount
    section: "Timer"
    behavior: >
      `new(delay, repeatCount = 0)` begins stopped with `currentCount = 0`. Negative or NaN
      delay throws `openfl.errors.Error`; the implementation does not reject positive infinity
      despite documentation saying finite. Zero is accepted; values below 20 ms are only
      discouraged, not clamped.
    source:
      - utils/Timer.hx:currentCount
      - utils/Timer.hx:delay
      - utils/Timer.hx:repeatCount
      - utils/Timer.hx:new
    scenarios:
      - utils/timer:initial

  - id: utils.TMR.start-stop
    section: "Timer"
    behavior: >
      `start()` starts only if not already running; repeated calls while running do nothing
      and do not reset phase/count. `stop()` cancels future ticks, sets `running = false`, and
      preserves `currentCount`. Starting again continues the remaining repetitions.
    source:
      - utils/Timer.hx:currentCount
      - utils/Timer.hx:running
      - utils/Timer.hx:reset
      - utils/Timer.hx:start
      - utils/Timer.hx:stop
    scenarios:
      - utils/timer:singleRepeat

  - id: utils.TMR.reset-currentcount
    section: "Timer"
    behavior: >
      `reset()` stops if necessary and returns `currentCount` to zero.
    source:
      - utils/Timer.hx:currentCount
      - utils/Timer.hx:reset
    scenarios:
      - utils/timer:singleRepeat

  - id: utils.TMR.every-tick-increments-count-before-dispatching-timerevent
    section: "Timer"
    behavior: >
      Every tick increments count before dispatching `TimerEvent.TIMER`. With positive
      `repeatCount`, the final tick first stops the Timer, dispatches `TIMER`, then dispatches
      `TIMER_COMPLETE`. Repeat count zero runs indefinitely.
    source:
      - utils/Timer.hx:repeatCount
    scenarios:
      - utils/timer:infiniteRepeat

  - id: utils.TMR.changing-delay-while-running-stops-and-restarts
    section: "Timer"
    behavior: >
      Changing `delay` while running stops and restarts the underlying host interval while
      preserving count. The setter performs no validation. Changing `repeatCount` to a nonzero
      value less than or equal to current count stops immediately without a completion event;
      other values are stored verbatim.
    source:
      - utils/Timer.hx:delay
      - utils/Timer.hx:repeatCount
      - utils/Timer.hx:running
    scenarios:
      - utils/timer:infiniteRepeat

  - id: utils.TMR.a-timerevent-whose-updateafterevent-flag-was-set
    section: "Timer"
    behavior: >
      A TimerEvent whose `updateAfterEvent()` flag was set requests a stage render after that
      individual dispatch when a current stage exists.
    source:
      - events/TimerEvent.hx:updateAfterEvent
      - utils/Timer.hx:start
    scenarios:
      - utils/timer:singleRepeat

  - id: utils.LIB.these-are-static-openfl-lib-helpers-included
    section: "Lib.setTimeout / setInterval"
    behavior: >
      These are static `openfl.Lib` helpers, included here because they are the package's
      scheduling convention. Each increments a process-local UInt ID, stores a Haxe Timer, and
      invokes `closure` via `Reflect.callMethod` with the supplied `args` array or no
      arguments when null.
    source:
      - Lib.hx:setInterval
      - Lib.hx:setTimeout
    scenarios:
      - utils/surface:libHelpers

  - id: utils.LIB.settimeout-setinterval
    section: "Lib.setTimeout / setInterval"
    behavior: >
      `setTimeout` runs once after the delay and removes its ID before calling the closure.
      `setInterval` runs until cleared. `clearTimeout(id)` and `clearInterval(id)` are
      behaviorally identical: if the ID exists they stop and remove it; unknown/already-fired
      IDs are no-ops.
    source:
      - Lib.hx:clearInterval
      - Lib.hx:clearTimeout
      - Lib.hx:setInterval
      - Lib.hx:setTimeout
    scenarios:
      - utils/surface:libHelpers

  - id: utils.LIB.callback-exceptions-propagate-normally-unless-a-current
    section: "Lib.setTimeout / setInterval"
    behavior: >
      Callback exceptions propagate normally unless a current Stage has enabled uncaught-error
      events, in which case they are routed through the stage error handler.
    source:
      - Lib.hx:current
    scenarios:
      - utils/surface:libHelpers

  - id: utils.DICT.new-weakkeys-tostring
    section: "Dictionary"
    behavior: >
      `new(weakKeys = false)` chooses a backing map from the compile-time key type: strings
      and integers use value maps, object keys use identity maps, enums use enum
      identity/value rules, floats use a sorted exact-equality map, and classes are keyed by
      fully qualified class name. Object lookup therefore does not coerce through `toString`.
    source:
      - utils/Dictionary.hx:new
      - utils/Dictionary.hx:keys
      - utils/Dictionary.hx:toString
    scenarios:
      - utils/dictionary:objectKeys

  - id: utils.DICT.set-get
    section: "Dictionary"
    behavior: >
      `set`/array assignment replaces an existing mapping and returns the assigned value;
      `get`/array access returns its value or null; `exists` distinguishes absent from
      present-null; `remove` (the Haxe equivalent of ActionScript `delete`) returns whether a
      mapping existed.
    source:
      - utils/Dictionary.hx:exists
      - utils/Dictionary.hx:get
      - utils/Dictionary.hx:remove
      - utils/Dictionary.hx:set
    scenarios:
      - utils/dictionary:basicUsage
      - utils/dictionary:exists
      - utils/dictionary:removeKey

  - id: utils.DICT.iterator-each
    section: "Dictionary"
    behavior: >
      `iterator()` yields keys, `each()` yields values, and `keyValueIterator()` yields pairs.
      Order is unspecified (float keys happen to be sorted by the implementation and must not
      be generalized to other key types); iterator mutation guarantees come from the backing
      Haxe map.
    source:
      - utils/Dictionary.hx:keyValueIterator
      - utils/Dictionary.hx:iterator
      - utils/Dictionary.hx:each
      - utils/Dictionary.hx:keys
    scenarios:
      - utils/dictionary:iteration
      - utils/dictionary:deleteDuringIteration

  - id: utils.DICT.non-flash-openfl-9-5-2-ignores
    section: "Dictionary"
    behavior: >
      Non-Flash OpenFL 9.5.2 ignores `weakKeys`; object keys are strongly held and are not
      removed by GC. Only the Flash typedef supplies true weak-key semantics. The adapter
      matches this target distinction.
    source:
      - utils/Dictionary.hx:keys
    scenarios:
      - utils/dictionary:objectKeys

  - id: utils.ASSET.cache-iassetcache
    section: "Assets"
    behavior: >
      `cache` is a replaceable global `IAssetCache`, initially an enabled `AssetCache`. On the
      9.5.2 Lime tools path, synchronous bitmap/font/sound getters consult it only when
      `useCache` and `cache.enabled` are true, reject invalid disposed cached bitmap data
      where detectable, then cache a successfully resolved asset.
    source:
      - utils/Assets.hx:cache
    scenarios:
      - utils/assets:globalCache

  - id: utils.ASSET.the-adapter-also-consults-a-manually-populated
    section: "Assets"
    behavior: >
      The adapter also consults a manually populated bitmap/font/sound cache without Lime,
      while stock 9.5.2 compiles those cache checks only into its Lime tools path and
      otherwise returns its ordinary fallback.
    source:
      - utils/Assets.hx:cache
    notes: "Intentional no-Lime extension: the adapter honors a manually populated cache so the portable asset registry remains useful without Lime."
    scenarios:
      - utils/assets:globalCache

  - id: utils.ASSET.exists-id-type-islocal
    section: "Assets"
    behavior: >
      `exists(id,type = null)`, `isLocal(id,type = null,useCache = true)`, and `list(type =
      null)` query the Lime registry on a Lime build.
    source:
      - utils/Assets.hx:exists
      - utils/Assets.hx:isLocal
      - utils/Assets.hx:list
    scenarios:
      - utils/assets:globalCache
      - utils/assets:registeredLibrary
      - utils/assets:unregisteredLibrary

  - id: utils.ASSET.without-lime-9-5-2-returns-false
    section: "Assets"
    behavior: >
      Without Lime, 9.5.2 returns false from `exists`/`isLocal` and an empty list. The adapter
      instead has a registered-library resolver supporting `library:symbol` IDs (and the
      default library when unqualified).
    source:
      - utils/Assets.hx:exists
      - utils/Assets.hx:isLocal
      - utils/Assets.hx:list
    notes: "Intentional adapter extension beyond the executable no-Lime OpenFL 9.5.2 behavior."
    scenarios:
      - utils/assets:registeredLibrary
      - utils/assets:unregisteredLibrary

  - id: utils.ASSET.getbitmapdata-getbytes
    section: "Assets"
    behavior: >
      `getBitmapData` returns a cached/resolved BitmapData or null; platform-dependent
      instances may share backing image data. `getBytes` returns the binary ByteArray or null.
      `getText` and `getPath` return a string or null.
    source:
      - utils/Assets.hx:getBitmapData
      - utils/Assets.hx:getBytes
      - utils/Assets.hx:getPath
      - utils/Assets.hx:getText
    scenarios:
      - utils/assets:globalCache

  - id: utils.ASSET.getfont-getsound
    section: "Assets"
    behavior: >
      `getFont` returns cached/resolved font, but returns a newly constructed empty Font when
      no font resolves. `getSound` returns cached/resolved Sound or null. `getMusic` attempts
      a streaming-friendly Vorbis path where compiled, otherwise aliases `getSound`.
    source:
      - utils/Assets.hx:getFont
      - utils/Assets.hx:getMusic
      - utils/Assets.hx:getSound
    scenarios:
      - utils/assets:globalCache

  - id: utils.ASSET.flight-has-no-progressively-buffered-music-source
    section: "Assets"
    behavior: >
      Flight has no progressively buffered music source, so `getMusic` uses a decoded Sound.
      See **OpenFL asset registry and streaming music**.
    source:
      - utils/Assets.hx:getMusic
    notes: 'Blocked on Flight gap "OpenFL asset registry and streaming music".'
    scenarios: []

  - id: utils.ASSET.getmovieclip-movie-clip
    section: "Assets"
    behavior: >
      `getMovieClip("library:symbol")` resolves an AssetLibrary, requires a local
      `MOVIE_CLIP`, and returns the clip; missing library/symbol or an async-only symbol logs
      and returns null.
    source:
      - utils/Assets.hx:getMovieClip
    scenarios:
      - utils/surface:assetLookup

  - id: utils.ASSET.loadbitmapdata-loadbytes
    section: "Assets"
    behavior: >
      `loadBitmapData`, `loadBytes`, `loadFont`, `loadLibrary`, `loadMusic`, `loadMovieClip`,
      `loadSound`, and `loadText` return Futures. They complete from cache immediately where
      applicable, otherwise forward backend complete, error, and progress; fallback targets
      return an already completed sync getter (except unsupported library loading, which is an
      error Future).
    source:
      - utils/Assets.hx:cache
      - utils/Assets.hx:loadBitmapData
      - utils/Assets.hx:loadBytes
      - utils/Assets.hx:loadFont
      - utils/Assets.hx:loadLibrary
      - utils/Assets.hx:loadMusic
      - utils/Assets.hx:loadMovieClip
      - utils/Assets.hx:loadSound
      - utils/Assets.hx:loadText
    scenarios:
      - utils/assets:globalCache

  - id: utils.ASSET.on-lime-registerlibrary-name-library-installs-replaces
    section: "Assets"
    behavior: >
      On Lime, `registerLibrary(name,library)` installs/replaces a library;
      `getLibrary`/`hasLibrary` inspect it; `unloadLibrary` unloads and removes it. Library
      change propagation dispatches `Event.CHANGE`. `registerBinding` and `unregisterBinding`
      map generated class names to an AssetLibrary; `initBinding` binds a current/future
      Sprite constructor or logs when absent.
    source:
      - utils/Assets.hx:getLibrary
      - utils/Assets.hx:hasLibrary
      - utils/Assets.hx:initBinding
      - utils/Assets.hx:registerBinding
      - utils/Assets.hx:registerLibrary
      - utils/Assets.hx:unloadLibrary
      - utils/Assets.hx:unregisterBinding
    scenarios:
      - utils/assets:registeredLibrary
      - utils/assets:unregisteredLibrary

  - id: utils.ASSET.without-lime-9-5-2-s-library
    section: "Assets"
    behavior: >
      Without Lime, 9.5.2's library register/get/has/unload paths are no-ops/null/false. The
      adapter deliberately makes those operations functional with an in-process map, expanding
      the executable no-Lime contract.
    source:
      - utils/Assets.hx:getLibrary
      - utils/Assets.hx:hasLibrary
      - utils/Assets.hx:registerLibrary
      - utils/Assets.hx:unloadLibrary
    notes: "Intentional adapter extension beyond the executable no-Lime OpenFL 9.5.2 behavior."
    scenarios:
      - utils/assets:registeredLibrary
      - utils/assets:unregisteredLibrary

  - id: utils.ASSET.static-addeventlistener-removeeventlistener-haseventlistener-and-dispatchevent-delegate
    section: "Assets"
    behavior: >
      Static `addEventListener`, `removeEventListener`, `hasEventListener`, and
      `dispatchEvent` delegate to one private global EventDispatcher. Adding a listener also
      hooks Lime's change signal once.
    source:
      - utils/Assets.hx:addEventListener
      - utils/Assets.hx:dispatchEvent
      - utils/Assets.hx:hasEventListener
      - utils/Assets.hx:removeEventListener
    scenarios:
      - utils/assets:events

  - id: utils.AC.a-new-cache-has-enabled-true-and
    section: "AssetCache / IAssetCache"
    behavior: >
      A new cache has `enabled = true` and separate public maps for bitmap data, fonts, and
      sounds. Toggling enabled does not clear or prevent direct cache method use; `Assets`
      decides whether to consult it.
    source:
      - utils/AssetCache.hx:enabled
      - utils/AssetCache.hx:new
      - utils/AssetCache.hx:clear
      - utils/IAssetCache.hx:enabled
      - utils/IAssetCache.hx:clear
    scenarios:
      - utils/assets:populatedCache
      - utils/assets:clearedCache

  - id: utils.AC.getbitmapdata-getfont
    section: "AssetCache / IAssetCache"
    behavior: >
      `getBitmapData`/`getFont`/`getSound`, `hasBitmapData`/`hasFont`/`hasSound`,
      `setBitmapData`/`setFont`/`setSound`, and `removeBitmapData`/`removeFont`/`removeSound`
      are direct ID map operations; remove returns whether an item existed. `clear()` replaces
      all three maps; `clear(prefix)` removes every key beginning with that exact
      case-sensitive prefix. Cached objects are not cloned or disposed.
    source:
      - utils/AssetCache.hx:clear
      - utils/AssetCache.hx:getBitmapData
      - utils/AssetCache.hx:getFont
      - utils/AssetCache.hx:getSound
      - utils/AssetCache.hx:hasBitmapData
      - utils/AssetCache.hx:hasFont
      - utils/AssetCache.hx:hasSound
      - utils/AssetCache.hx:removeBitmapData
      - utils/AssetCache.hx:removeFont
      - utils/AssetCache.hx:removeSound
      - utils/AssetCache.hx:setBitmapData
      - utils/AssetCache.hx:setFont
      - utils/AssetCache.hx:setSound
      - utils/IAssetCache.hx:clear
      - utils/IAssetCache.hx:getBitmapData
      - utils/IAssetCache.hx:getFont
      - utils/IAssetCache.hx:getSound
      - utils/IAssetCache.hx:hasBitmapData
      - utils/IAssetCache.hx:hasFont
      - utils/IAssetCache.hx:hasSound
      - utils/IAssetCache.hx:removeBitmapData
      - utils/IAssetCache.hx:removeFont
      - utils/IAssetCache.hx:removeSound
      - utils/IAssetCache.hx:setBitmapData
      - utils/IAssetCache.hx:setFont
      - utils/IAssetCache.hx:setSound
    scenarios:
      - utils/assets:populatedCache
      - utils/assets:clearedCache

  - id: utils.AC.iassetcache
    section: "AssetCache / IAssetCache"
    behavior: >
      `IAssetCache` is exactly this property/method contract and does not prescribe eviction,
      ownership, or thread safety.
    source:
      - utils/IAssetCache.hx:enabled
      - utils/IAssetCache.hx:clear
      - utils/IAssetCache.hx:getBitmapData
      - utils/IAssetCache.hx:getFont
      - utils/IAssetCache.hx:getSound
      - utils/IAssetCache.hx:hasBitmapData
      - utils/IAssetCache.hx:hasFont
      - utils/IAssetCache.hx:hasSound
      - utils/IAssetCache.hx:removeBitmapData
      - utils/IAssetCache.hx:removeFont
      - utils/IAssetCache.hx:removeSound
      - utils/IAssetCache.hx:setBitmapData
      - utils/IAssetCache.hx:setFont
      - utils/IAssetCache.hx:setSound
    scenarios:
