package: filters

entries:

  # -- BitmapFilter --

  - id: filters.BF.base-construction
    section: "BitmapFilter"
    behavior: >-
      Although the comments say it cannot be instantiated or extended, the non-Flash class has a
      public zero-argument constructor and is not final. It initializes zero edge extensions and
      shader passes, smooth sampling true, normal shader blend mode, requires a second bitmap,
      and does not preserve the original object.
    source:
      - filters/BitmapFilter.hx:new
    scenarios:
      - filters/properties:baseInternals.constructed

  - id: filters.BF.base-clone
    section: "BitmapFilter"
    behavior: >-
      Base `clone()` returns a fresh base `BitmapFilter`; it has no public properties to copy.
      Its internal bitmap application returns the source unchanged and its shader initializer
      returns null.
    source:
      - filters/BitmapFilter.hx:clone
    scenarios:
      - filters/properties:baseInternals.clone
      - filters/properties:baseInternals.cloneDistinct

  - id: filters.BF.display-object-storage
    section: "BitmapFilter"
    behavior: >-
      A DisplayObject stores a clone of each filter on assignment, treats a null or empty array
      as no filters, returns `[]` when none are stored, and makes `cacheAsBitmap` read true
      whenever filters are present. Its getter shallow-copies the array but not the stored
      filter objects, so a filter fetched from one returned array can be mutated before the
      array is reassigned.
    source:
      - filters/BitmapFilter.hx:clone
    scenarios:
      - filters/properties:displayObject
      - integration/filters-display:assignmentClone
      - integration/filters-display:removal

  - id: filters.BF.null-element
    section: "BitmapFilter"
    behavior: >-
      A null element in a nonempty filter array is dereferenced during cloning and fails rather
      than being retained or silently skipped.
    source:
      - filters/BitmapFilter.hx:clone
    scenarios:
      - filters/properties:baseInternals.nullElementThrows

  - id: filters.BF.internal-render-bounds
    section: "BitmapFilter"
    behavior: >-
      Internal cached-render bounds use each filter's top/right/bottom/left extensions while
      public geometric bounds remain unchanged.
    source:
      - filters/BitmapFilter.hx:__initShader
      - filters/BitmapFilter.hx:__leftExtension
      - filters/BitmapFilter.hx:__topExtension
      - filters/BitmapFilter.hx:__rightExtension
      - filters/BitmapFilter.hx:__bottomExtension
    scenarios:
      - integration/filters-display:containerBounds
      - filters/properties:derivedInternals.filterBounds
      - filters/properties:derivedInternals.publicBounds

  - id: filters.BF.live-node-effects
    section: "BitmapFilter"
    behavior: >-
      Except for the separately mapped `ColorMatrixFilter`, stored filter descriptors are not
      attached to live Flight display nodes, so bevel, blur, convolution, displacement, shadow,
      glow, and shader display effects are not rendered. Blocker: **Per-node render-effect
      attachment**.
    source:
      - filters/BitmapFilter.hx:__initShader
    notes: 'Blocked on Flight gap "Per-node render effects".'
    scenarios: []

  # -- BitmapFilterShader --

  - id: filters.BFS.constructor-pass-through
    section: "BitmapFilterShader"
    behavior: >-
      `BitmapFilterShader` is a public Shader subclass with `new(code:ByteArray=null)` forwarding
      the exact code reference to `Shader`. Its metadata-supplied default program transforms
      `openfl_Position` with `openfl_Matrix`, forwards `openfl_TextureCoord`, and samples
      `openfl_Texture` unchanged in the fragment shader.
    source:
      - filters/BitmapFilterShader.hx:new
    notes: >-
      Unlike the other filter package types, BitmapFilterShader is not guarded by `#if !flash`
      and is compiled on Flash as well as non-Flash targets.
    scenarios: []

  # -- BitmapFilter > Common BitmapData.applyFilter pipeline --

  - id: filters.BF.bitmap-source-selection
    section: "BitmapFilter > Common BitmapData.applyFilter pipeline"
    behavior: >-
      OpenFL returns immediately only when the destination is unreadable, the supplied source is
      null, or the source is unreadable. It then accidentally passes the destination (`this`) as
      the source to the filter, so the non-null `sourceBitmapData` argument is used only by that
      initial guard. The adapter correctly filters the supplied source; this deliberately does
      not preserve the 9.5.2 source-selection bug.
    source:
      - filters/BitmapFilter.hx:__applyFilter
    notes: >-
      The adapter intentionally filters the supplied source instead of preserving the 9.5.2
      source-selection bug.
    scenarios:
      - display/bitmap-data:applyBlurFilter
      - display/bitmap-data:applyColorMatrixFilter
      - display/bitmap-data:applyConvolutionFilter

  - id: filters.BF.bitmap-allocation-preservation
    section: "BitmapFilter > Common BitmapData.applyFilter pipeline"
    behavior: >-
      A filter that needs a second bitmap receives a transparent destination-sized temporary;
      otherwise it writes to the receiver. A preserve-object filter also snapshots the receiver,
      applies its effect, then draws the snapshot over the result. If the filter returns the
      second temporary, that image replaces the receiver image. The adapter mirrors this
      allocation, preservation, and image-replacement pipeline for supported bitmap filters.
    source:
      - filters/BitmapFilter.hx:__applyFilter
    scenarios:
      - display/bitmap-data:applyBlurFilter
      - display/bitmap-data:applyColorMatrixFilter
      - display/bitmap-data:applyConvolutionFilter
      - filters/properties:derivedInternals.bevel
      - filters/properties:bitmapApplications.bevel

  - id: filters.BF.bitmap-null-arguments
    section: "BitmapFilter > Common BitmapData.applyFilter pipeline"
    behavior: >-
      A null filter passes the readability guards and is then dereferenced. Null sourceRect or
      destPoint behavior depends on the selected filter and commonly fails when its private
      implementation dereferences it.
    source:
      - filters/BitmapFilter.hx:__applyFilter
    scenarios:
      - filters/properties:nullArguments

  # -- BevelFilter --

  - id: filters.Bevel.constructor-defaults
    section: "BevelFilter"
    behavior: >-
      Construction defaults to `(distance=4, angle=45, highlightColor=0xFFFFFF,
      highlightAlpha=1, shadowColor=0, shadowAlpha=1, blurX=4, blurY=4, strength=1, quality=1,
      type="inner", knockout=false)`. `clone()` returns a new BevelFilter containing the
      effective stored values.
    source:
      - filters/BevelFilter.hx:new
    scenarios:
      - filters/properties:defaults.bevel
      - filters/properties:values.bevel
      - filters/properties:clones.bevel

  - id: filters.Bevel.property-clamping
    section: "BevelFilter"
    behavior: >-
      Finite `blurX` and `blurY` clamp to `[0,255]`; both alpha properties clamp to `[0,1]`;
      `quality` is integer-clamped to `[1,15]`; and changed `strength` values clamp to `[1,255]`.
      Strength has an equality bypass: its backing value starts at zero, so constructing with
      strength zero leaves zero rather than clamping to one. NaN float inputs pass through the
      comparison clamps. Highlight and shadow colors are unsigned and capped at `0xFFFFFF`;
      distance and degree-valued angle are unrestricted.
    source:
      - filters/BevelFilter.hx:distance
      - filters/BevelFilter.hx:angle
      - filters/BevelFilter.hx:highlightColor
      - filters/BevelFilter.hx:highlightAlpha
      - filters/BevelFilter.hx:shadowColor
      - filters/BevelFilter.hx:shadowAlpha
      - filters/BevelFilter.hx:blurX
      - filters/BevelFilter.hx:blurY
      - filters/BevelFilter.hx:strength
      - filters/BevelFilter.hx:quality
    scenarios:
      - filters/properties:mutations.bevel
      - filters/properties:edges.bevel

  - id: filters.Bevel.type-coercion
    section: "BevelFilter"
    behavior: >-
      `type` retains exact `"inner"` and `"outer"`; changed values outside those two become
      `"full"`. Its backing value starts null, so a null constructor argument compares equal and
      bypasses coercion, remaining null; assigning null after a non-null value becomes `"full"`.
      `knockout` is stored directly.
    source:
      - filters/BevelFilter.hx:type
      - filters/BevelFilter.hx:knockout
    scenarios:
      - filters/properties:mutations.bevel
      - filters/properties:edges.bevel

  - id: filters.Bevel.display-shader
    section: "BevelFilter"
    behavior: >-
      Its shader uses degrees for the directional vector, premultiplies each highlight/shadow
      RGB by its alpha, runs horizontal/vertical blur passes based on rounded `blur*quality/4`,
      then combines using inner/outer/full and knockout state. The adapter captures the public
      parameters in a Flight descriptor, but cannot attach that descriptor to the live node.
      Blocker: **Per-node render-effect attachment**.
    source:
      - filters/BevelFilter.hx:__initShader
    notes: 'Blocked on Flight gap "Per-node render effects".'
    scenarios: []

  - id: filters.Bevel.internal-render-extensions
    section: "BevelFilter"
    behavior: >-
      Internal render extensions are `ceil(blur + directional contribution)` on each side, with
      the directional contribution suppressed for `inner`. Construction and blur/distance/angle
      changes recompute them, but changing `type` does not—a retained stale-bounds quirk. These
      extensions feed the adapter's internal filter bounds.
    source:
      - filters/BevelFilter.hx:__updateSize
    scenarios:
      - filters/properties:derivedInternals.bevel

  - id: filters.Bevel.bitmap-blur-only
    section: "BevelFilter"
    behavior: >-
      On Lime, `BitmapData.applyFilter` executes only `ImageDataUtil.gaussianBlur` for a bevel,
      then preserves/draws the original content; it does not perform a bevel color/combine
      stage. On non-Lime targets the filter method skips the blur and returns its source bitmap.
    source:
      - filters/BevelFilter.hx:__applyFilter
    notes: "The CPU blur branch is compiled only with the `lime` define."
    scenarios:
      - filters/properties:bitmapApplications.bevel

  # -- BlurFilter --

  - id: filters.Blur.clone-deep
    section: "BlurFilter"
    behavior: >-
      The constructor defaults to `(blurX=4, blurY=4,quality=1)`, retains all three values
      verbatim without clamping or integer-range normalization, and `clone()` copies them to an
      independent filter. Every setter also stores its input verbatim.
    source:
      - filters/BlurFilter.hx:new
      - filters/BlurFilter.hx:clone
      - filters/BlurFilter.hx:blurX
      - filters/BlurFilter.hx:blurY
    scenarios:
      - filters/properties:defaults.blur
      - filters/properties:values.blur
      - filters/properties:mutations.blur
      - filters/properties:clones.blur

  - id: filters.Blur.quality-pass-counts
    section: "BlurFilter"
    behavior: >-
      OpenFL calculates horizontal passes as zero for `blurX<=0`, otherwise
      `round(blurX*quality/4)+1`, likewise vertically, and sums them. A quality change
      recalculates pass counts; arbitrary negative quality is permitted. The adapter retains
      these internal pass counts alongside its Flight descriptor.
    source:
      - filters/BlurFilter.hx:quality
    scenarios:
      - filters/properties:values.blur
      - filters/properties:mutations.blur
      - filters/properties:derivedInternals.blur

  - id: filters.Blur.bitmap-blur-algorithm
    section: "BlurFilter"
    behavior: >-
      On Lime, bitmap application delegates the destination image, source image, source
      rectangle, destination point, and the stored blurX/blurY/quality values directly to
      `ImageDataUtil.gaussianBlur`; if it returns the destination image, the destination bitmap
      is returned, otherwise the source bitmap is returned. On non-Lime targets this method
      skips the utility and returns the source bitmap unchanged.
    source:
      - filters/BlurFilter.hx:__applyFilter
    notes: "The CPU blur implementation is compiled only with the `lime` define."
    scenarios:
      - display/bitmap-data:applyBlurFilter
      - filters/properties:bitmapApplications.blur

  - id: filters.Blur.internal-padding
    section: "BlurFilter"
    behavior: >-
      Internal padding per positive axis is `ceil(value*max(quality,1)*3)+2` in Lime builds
      (`ceil(value)+2` otherwise), and zero for nonpositive blur. Source order produces a quirk:
      blur is initially set while quality is still target-default zero; the later quality setter
      calls the blur setters with unchanged values, so constructor padding is based on one pass.
      A quality-only change likewise does not update padding. The adapter retains these values in
      its internal filter-bound expansion.
    source:
      - filters/BlurFilter.hx:__padFor
      - filters/BlurFilter.hx:set_blurX
      - filters/BlurFilter.hx:set_blurY
    notes: >-
      The `value*passes*3` reach is used only with `lime`; other non-Flash targets use `value`.
    scenarios:
      - filters/properties:derivedInternals.blur

  - id: filters.Blur.live-node-descriptor
    section: "BlurFilter"
    behavior: >-
      The adapter builds a Flight blur descriptor from blurX/blurY, but quality is not
      represented and the descriptor is not attached to display nodes. Blocker: **Per-node
      render-effect attachment**.
    source:
      - filters/BlurFilter.hx:__initShader
    notes: 'Blocked on Flight gap "Per-node render effects".'
    scenarios:
      - integration/filters-display:multipleFilters.blur

  # -- ColorMatrixFilter --

  - id: filters.CM.matrix-storage-getter
    section: "ColorMatrixFilter"
    behavior: >-
      Passing null constructs the row-major 4×5 identity. Any non-null Array, of any length, is
      retained by reference with no validation. The getter returns a copy, so editing a fetched
      Array does not mutate the filter; assigning an Array and later editing that original does.
    source:
      - filters/ColorMatrixFilter.hx:new
      - filters/ColorMatrixFilter.hx:matrix
    scenarios:
      - filters/properties:defaults.colorMatrix
      - filters/properties:values.colorMatrix
      - filters/properties:mutations.colorMatrix
      - filters/properties:edges.colorMatrixNullReset

  - id: filters.CM.clone-shared-backing
    section: "ColorMatrixFilter"
    behavior: >-
      `clone()` passes the internal Array to the new instance, so clones share the same backing
      Array even though each public getter returns a copy. Reassigning either filter's `matrix`
      breaks that sharing.
    source:
      - filters/ColorMatrixFilter.hx:clone
    scenarios:
      - filters/properties:clones.colorMatrix
      - filters/properties:clones.colorMatrixMatricesShareReference

  - id: filters.CM.pixel-evaluation
    section: "ColorMatrixFilter"
    behavior: >-
      Pixel evaluation computes output R/G/B/A from rows beginning at indices `0,5,10,15`, adds
      offsets at `4,9,14,19`, clamps each result to `[0,255]`, and truncates with `Std.int`. A
      source pixel with alpha zero is forced to fully transparent black instead of evaluating
      the matrix.
    source:
      - filters/ColorMatrixFilter.hx:__applyFilter
    notes: >-
      CPU pixel evaluation is compiled only with `lime`. On `js && html5`, both images are first
      converted from canvas backing to data backing before byte access.
    scenarios:
      - display/bitmap-data:applyColorMatrixFilter

  - id: filters.CM.bitmap-source-rect-quirks
    section: "ColorMatrixFilter"
    behavior: >-
      The 9.5.2 Lime source iterates rows from `Std.int(sourceRect.y)` to
      `Std.int(sourceRect.height)` and columns from `x` to `width`, using an x/y-swapped
      destination offset expression. The adapter preserves these executable source quirks,
      including for nonzero source rectangles.
    source:
      - filters/ColorMatrixFilter.hx:__applyFilter
    scenarios:
      - display/bitmap-data:applyColorMatrixFilter
      - filters/properties:bitmapApplications.colorMatrixNonzeroRect

  - id: filters.CM.display-color-adjustment
    section: "ColorMatrixFilter"
    behavior: >-
      A valid 20-element matrix maps to a Flight ColorMatrixAdjustment and is attached as a
      DisplayObject color adjustment; null resets to identity.
    source:
      - filters/ColorMatrixFilter.hx:__initShader
      - filters/ColorMatrixFilter.hx:init
    scenarios:
      - integration/filters-display:multipleFilters.colorMatrix

  - id: filters.CM.invalid-length-display
    section: "ColorMatrixFilter"
    behavior: >-
      Invalid lengths remain valid public state. OpenFL's shader still reads its expected
      indices from that Array, whereas the adapter deliberately creates no Flight adjustment, so
      display behavior for malformed matrices differs.
    source:
      - filters/ColorMatrixFilter.hx:matrix
      - filters/ColorMatrixFilter.hx:__initShader
    notes: >-
      Malformed matrices retain their public state but intentionally produce no Flight color
      adjustment.
    scenarios:
      - filters/properties:descriptorSynchronization.colorMatrixInvalidLengthCreatesNoAdjustment

  - id: filters.CM.bounds-unchanged
    section: "ColorMatrixFilter"
    behavior: >-
      Color matrices have zero internal bound extension and do not change public bounds.
    source:
      - filters/BitmapFilter.hx:__leftExtension
      - filters/BitmapFilter.hx:__topExtension
      - filters/BitmapFilter.hx:__rightExtension
      - filters/BitmapFilter.hx:__bottomExtension
    scenarios:
      - integration/filters-display:containerBounds

  # -- ConvolutionFilter --

  - id: filters.Conv.constructor-fields
    section: "ConvolutionFilter"
    behavior: >-
      Constructor defaults are `matrixX=0`, `matrixY=0`, `matrix=null`, `divisor=1`, `bias=0`,
      `preserveAlpha=true`, `clamp=true`, `color=0`, and `alpha=0`. It writes the constructor
      matrix directly, so null and arbitrary lengths are accepted there; all scalar fields are
      freely writable and unvalidated.
    source:
      - filters/ConvolutionFilter.hx:new
      - filters/ConvolutionFilter.hx:alpha
      - filters/ConvolutionFilter.hx:bias
      - filters/ConvolutionFilter.hx:clamp
      - filters/ConvolutionFilter.hx:color
      - filters/ConvolutionFilter.hx:divisor
      - filters/ConvolutionFilter.hx:matrix
      - filters/ConvolutionFilter.hx:matrixX
      - filters/ConvolutionFilter.hx:matrixY
      - filters/ConvolutionFilter.hx:preserveAlpha
    scenarios:
      - filters/properties:defaults.convolution
      - filters/properties:values.convolution
      - filters/properties:mutations.convolution

  - id: filters.Conv.matrix-setter-validation
    section: "ConvolutionFilter"
    behavior: >-
      Assigning `matrix=null` substitutes `[0,0,0,0,1,0,0,0,0]`. Any non-null assigned Array
      whose length is not exactly nine throws the string `"Only a 3x3 matrix is supported"`.
      Getter and setter retain/return the actual backing Array, allowing element mutation
      without reassignment.
    source:
      - filters/ConvolutionFilter.hx:matrix
    scenarios:
      - filters/properties:edges.convolutionZeroKernel
      - filters/properties:edges.convolutionSetterError
      - filters/properties:mutations.convolution

  - id: filters.Conv.clone-shared-matrix
    section: "ConvolutionFilter"
    behavior: >-
      `clone()` copies scalar values but passes the same matrix reference, so element edits are
      shared between the original and clone.
    source:
      - filters/ConvolutionFilter.hx:clone
    scenarios:
      - filters/properties:clones.convolutionCloneAfterSourceMatrixMutation
      - filters/properties:clones.convolutionMatricesShareReference

  - id: filters.Conv.display-fixed-kernel
    section: "ConvolutionFilter"
    behavior: >-
      OpenFL's display shader is always a fixed 3×3 sample kernel regardless of
      `matrixX`/`matrixY`. It sums nine samples, divides only when `divisor>0`, adds bias,
      optionally replaces result alpha with the center pixel, and clamps output channels. The
      public `clamp`, `color`, and `alpha` fields are not consumed by that shader.
    source:
      - filters/ConvolutionFilter.hx:__initShader
    scenarios:
      - filters/properties:descriptorSynchronization.convolution

  - id: filters.Conv.descriptor-synchronization
    section: "ConvolutionFilter"
    behavior: >-
      The Flight descriptor is fixed to 3×3 and uses the first nine matrix entries. Only
      construction and whole-matrix assignment resynchronize it; later writes to public scalar
      fields or in-place Array elements leave the descriptor stale.
    source:
      - filters/ConvolutionFilter.hx:__initShader
    scenarios:
      - filters/properties:descriptorSynchronization.convolution

  - id: filters.Conv.bitmap-upstream-noop
    section: "ConvolutionFilter"
    behavior: >-
      Convolution does not override the base bitmap-filter operation, so
      `BitmapData.applyFilter` leaves the receiver content unchanged.
    source:
      - filters/BitmapFilter.hx:__applyFilter
    scenarios:
      - filters/properties:values.convolution
      - filters/properties:mutations.convolution
      - filters/properties:bitmapApplications.convolutionNoop

  - id: filters.Conv.bounds-unchanged
    section: "ConvolutionFilter"
    behavior: >-
      Convolution has zero internal edge extension in 9.5.2 and public bounds are unchanged.
    source:
      - filters/BitmapFilter.hx:__leftExtension
      - filters/BitmapFilter.hx:__topExtension
      - filters/BitmapFilter.hx:__rightExtension
      - filters/BitmapFilter.hx:__bottomExtension
    scenarios:
      - display/bitmap-data:applyConvolutionFilter

  - id: filters.Conv.live-node-descriptor
    section: "ConvolutionFilter"
    behavior: >-
      No convolution descriptor reaches a live display node. Blocker: **Per-node render-effect
      attachment**.
    source:
      - filters/ConvolutionFilter.hx:__initShader
    notes: 'Blocked on Flight gap "Per-node render effects".'
    scenarios:
      - integration/filters-display:containerBounds

  # -- DisplacementMapFilter --

  - id: filters.DM.constructor-defaults
    section: "DisplacementMapFilter"
    behavior: >-
      Defaults are `mapBitmap=null`, a newly allocated `(0,0)` `mapPoint`, `componentX=0`,
      `componentY=0`, `scaleX=0`, `scaleY=0`, `mode=WRAP`, `color=0`, and `alpha=0`. All nine
      properties retain values without validation or clamping. `mapBitmap` and `mapPoint`
      getters expose the retained references directly.
    source:
      - filters/DisplacementMapFilter.hx:new
    scenarios:
      - filters/properties:defaults.displacement
      - filters/properties:values.displacement
      - filters/properties:mutations.displacement

  - id: filters.DM.clone-reference-rules
    section: "DisplacementMapFilter"
    behavior: >-
      `clone()` shares `mapBitmap`, clones `mapPoint`, and copies all other values. Because the
      mapPoint setter accepts null, cloning after assigning null dereferences null and fails.
    source:
      - filters/DisplacementMapFilter.hx:clone
    scenarios:
      - filters/properties:clones.displacement
      - filters/properties:clones.displacementSharesBitmap
      - filters/properties:clones.displacementSharesPoint

  - id: filters.DM.component-selection
    section: "DisplacementMapFilter"
    behavior: >-
      RED/GREEN/BLUE component values select channel columns 0/1/2; every other value selects
      alpha. Displacement scales are normalized by `mapBitmap.width` and height, with mapPoint
      likewise converted to texture-coordinate offsets. Null mapBitmap fails when filtering
      rather than being treated as a no-op.
    source:
      - filters/DisplacementMapFilter.hx:componentX
      - filters/DisplacementMapFilter.hx:componentY
    scenarios:
      - filters/properties:values.displacement
      - filters/properties:mutations.displacement
      - filters/properties:edges.displacementNullPoint

  - id: filters.DM.retained-edge-mode-fields
    section: "DisplacementMapFilter"
    behavior: >-
      In executable 9.5.2, `mode`, `color`, and `alpha` are retained and dirty rendering but
      never affect either the Lime displacement call or display shader. The actual edge behavior
      is therefore not selected by `WRAP`, `CLAMP`, `IGNORE`, or `COLOR` as comments claim.
    source:
      - filters/DisplacementMapFilter.hx:mode
      - filters/DisplacementMapFilter.hx:color
      - filters/DisplacementMapFilter.hx:alpha
    scenarios:
      - filters/properties:values.displacement
      - filters/properties:mutations.displacement

  - id: filters.DM.bitmap-source-destination
    section: "DisplacementMapFilter"
    behavior: >-
      On Lime the displacement utility receives both the whole destination image and whole
      source image plus the configured map image. It ignores sourceRect and destPoint, but does
      not ignore sourceBitmapData. The enclosing 9.5.2 BitmapData pipeline nevertheless passes
      the receiver as that source argument because of its common source-selection bug.
    source:
      - filters/DisplacementMapFilter.hx:__applyFilter
      - filters/DisplacementMapFilter.hx:mapBitmap
      - filters/DisplacementMapFilter.hx:mapPoint
    notes: >-
      The displacement utility call exists only with `lime`; on `js && html5`, destination,
      source, and map images are converted to data backing first. Non-Lime returns the
      destination bitmap without evaluating the map.
    scenarios:
      - filters/properties:bitmapApplications.displacementIgnoresArguments

  - id: filters.DM.bounds-unchanged
    section: "DisplacementMapFilter"
    behavior: >-
      The filter has zero internal edge extensions and one shader pass; public bounds are
      unchanged.
    source:
      - filters/BitmapFilter.hx:__leftExtension
      - filters/BitmapFilter.hx:__topExtension
      - filters/BitmapFilter.hx:__rightExtension
      - filters/BitmapFilter.hx:__bottomExtension
    scenarios:
      - integration/filters-display:containerBounds

  - id: filters.DM.bitmap-display-gaps
    section: "DisplacementMapFilter"
    behavior: >-
      Live display displacement still needs a bitmap-map render-effect adapter and per-node
      attachment. BitmapData application is handled separately. Blockers: **Bitmap-map
      displacement as a render effect** and **Per-node render-effect attachment**.
    source:
      - filters/DisplacementMapFilter.hx:__applyFilter
      - filters/DisplacementMapFilter.hx:__initShader
      - filters/DisplacementMapFilter.hx:scaleX
      - filters/DisplacementMapFilter.hx:scaleY
    notes: >-
      The same behavior also depends on the Per-node render effects entry.
      Blocked on Flight gap "Bitmap displacement effect".
    scenarios: []

  # -- DropShadowFilter --

  - id: filters.DS.constructor-defaults
    section: "DropShadowFilter"
    behavior: >-
      Construction defaults to `(distance=4, angle=45, color=0, alpha=1, blurX=4, blurY=4,
      strength=1, quality=1, inner=false, knockout=false, hideObject=false)`. Every property is
      stored verbatim: source comments advertise ranges, but setters do not clamp or normalize.
      `clone()` copies all effective primitive values.
    source:
      - filters/DropShadowFilter.hx:new
    scenarios:
      - filters/properties:defaults.dropShadow
      - filters/properties:values.dropShadow
      - filters/properties:mutations.dropShadow
      - filters/properties:clones.shadow

  - id: filters.DS.derived-direction-passes
    section: "DropShadowFilter"
    behavior: >-
      Direction uses degrees and truncates each component:
      `offsetX=Std.int(distance*cos(angle*π/180))` and similarly for y. Blur pass counts use
      zero when an axis is nonpositive, otherwise `round(blur*quality/4)+1`; total passes add
      two for inner or one for outer. The adapter retains these derived, truncation-sensitive
      values alongside the Flight descriptor.
    source:
      - filters/DropShadowFilter.hx:distance
      - filters/DropShadowFilter.hx:angle
      - filters/DropShadowFilter.hx:quality
    scenarios:
      - filters/properties:values.dropShadow
      - filters/properties:mutations.dropShadow
      - filters/properties:edges.dropShadow
      - filters/properties:derivedInternals.dropShadow.constructed

  - id: filters.DS.display-rendering
    section: "DropShadowFilter"
    behavior: >-
      Display rendering optionally inverts alpha for inner shadows, blurs alpha
      horizontally/vertically, applies color/alpha and final-pass strength, then combines with
      original content according to `inner`, `knockout`, and `hideObject`. The adapter captures
      parameters but cannot attach the effect to a live node. Blocker: **Per-node render-effect
      attachment**.
    source:
      - filters/DropShadowFilter.hx:__initShader
    notes: 'Blocked on Flight gap "Per-node render effects".'
    scenarios: []

  - id: filters.DS.setter-recalculation-order
    section: "DropShadowFilter"
    behavior: >-
      Angle, distance, blurX, and blurY changes recalculate offsets, extensions, and pass
      counts. Quality and inner setters only store/dirty: they do **not** recalculate pass
      counts, a retained executable stale-state quirk. Knockout/hideObject/color/alpha/strength
      likewise leave the derived values unchanged while refreshing the Flight descriptor.
    source:
      - filters/DropShadowFilter.hx:distance
      - filters/DropShadowFilter.hx:angle
      - filters/DropShadowFilter.hx:blurX
      - filters/DropShadowFilter.hx:blurY
      - filters/DropShadowFilter.hx:quality
    scenarios:
      - filters/properties:mutations.dropShadow
      - filters/properties:derivedInternals.dropShadow

  - id: filters.DS.internal-extensions
    section: "DropShadowFilter"
    behavior: >-
      Internal extensions are `ceil(blur + max(±truncatedOffset,0))` per side. They can be
      negative when blur is sufficiently negative and feed the adapter's internal cache bounds.
    source:
      - filters/DropShadowFilter.hx:__updateSize
    scenarios:
      - integration/filters-display:containerBounds
      - filters/properties:derivedInternals.dropShadow

  - id: filters.DS.bitmap-application
    section: "DropShadowFilter"
    behavior: >-
      On Lime, bitmap application blurs at destPoint plus the directional offset,
      color-transforms the entire returned image to shadow RGB/alpha, and does not add separate
      inner, knockout, or hideObject processing; its preserve-object step then draws the
      original. On non-Lime the filter method returns the source bitmap unchanged.
    source:
      - filters/DropShadowFilter.hx:__applyFilter
      - filters/DropShadowFilter.hx:color
      - filters/DropShadowFilter.hx:alpha
      - filters/DropShadowFilter.hx:strength
      - filters/DropShadowFilter.hx:inner
      - filters/DropShadowFilter.hx:knockout
      - filters/DropShadowFilter.hx:hideObject
    notes: "The CPU blur/color-transform branch is compiled only with the `lime` define."
    scenarios:
      - filters/properties:bitmapApplications.dropShadow

  # -- GlowFilter --

  - id: filters.Glow.constructor-defaults
    section: "GlowFilter"
    behavior: >-
      Construction defaults to `(color=0xFF0000, alpha=1, blurX=6, blurY=6, strength=2,
      quality=1, inner=false, knockout=false)`. Every property remains completely unrestricted
      despite documented ranges. `clone()` copies the primitive values to a new filter.
    source:
      - filters/GlowFilter.hx:new
    scenarios:
      - filters/properties:defaults.glow
      - filters/properties:values.glow
      - filters/properties:mutations.glow
      - filters/properties:clones.glow

  - id: filters.Glow.display-rendering
    section: "GlowFilter"
    behavior: >-
      Display rendering optionally inverts alpha for inner glow, performs per-axis alpha blur
      passes, applies color/alpha and final-pass strength, then combines with original content
      according to inner/knockout state. The adapter captures parameters but cannot attach the
      effect to a live node. Blocker: **Per-node render-effect attachment**.
    source:
      - filters/GlowFilter.hx:__initShader
    notes: 'Blocked on Flight gap "Per-node render effects".'
    scenarios: []

  - id: filters.Glow.internal-extensions-passes
    section: "GlowFilter"
    behavior: >-
      Positive-axis internal extension is `ceil(blur*1.5)` symmetrically; nonpositive blur
      yields zero. Pass counts use zero for nonpositive blur, otherwise
      `round(blur*quality/4)+1`, plus two combination passes for inner or one otherwise. The
      adapter retains these derived values and uses the extensions for internal filter bounds.
    source:
      - filters/GlowFilter.hx:__updateSize
      - filters/GlowFilter.hx:__calculateNumShaderPasses
      - filters/GlowFilter.hx:quality
    scenarios:
      - integration/filters-display:containerBounds
      - filters/properties:derivedInternals.glow

  - id: filters.Glow.setter-recalculation-order
    section: "GlowFilter"
    behavior: >-
      Blur setters recompute size and passes. Inner, knockout, and quality changes recalculate
      passes before storing the new value, retaining the source update-order effects; color,
      alpha, and strength leave derived values unchanged while refreshing the descriptor.
    source:
      - filters/GlowFilter.hx:blurX
      - filters/GlowFilter.hx:blurY
      - filters/GlowFilter.hx:quality
    scenarios:
      - filters/properties:mutations.glow
      - filters/properties:derivedInternals.glow

  - id: filters.Glow.bitmap-and-bounds-missing
    section: "GlowFilter"
    behavior: >-
      GlowFilter expands internal bounds. On Lime its bitmap path blurs and color-transforms the
      result, without separate inner/knockout bitmap processing, before preserving the original;
      on non-Lime the filter method returns the source bitmap unchanged.
    source:
      - filters/GlowFilter.hx:__applyFilter
      - filters/GlowFilter.hx:color
      - filters/GlowFilter.hx:alpha
      - filters/GlowFilter.hx:strength
      - filters/GlowFilter.hx:inner
      - filters/GlowFilter.hx:knockout
    notes: "The CPU blur/color-transform branch is compiled only with the `lime` define."
    scenarios:
      - filters/properties:derivedInternals.filterBounds
      - filters/properties:bitmapApplications.glow

  # -- GradientBevelFilter and GradientGlowFilter --

  - id: filters.Gradient.classes-absent
    section: "GradientBevelFilter and GradientGlowFilter"
    behavior: >-
      Neither class exists in the OpenFL 9.5.2 non-Flash source tree, despite both names
      appearing in `BitmapFilter` documentation. There is consequently no 9.5.2 constructor,
      property, clone, bitmap, or display-render contract to reproduce on this target, and the
      adapter correctly has no implementation. Flash-target builds defer to the platform Flash
      classes rather than OpenFL source behavior.
    source:
      - filters/BitmapFilter.hx:new
    notes: >-
      The absence applies to non-Flash builds; Flash obtains both classes from the platform API.
    scenarios:
      - filters/properties:gradientClassesAbsent

  # -- ShaderFilter --

  - id: filters.Shader.constructor-fields
    section: "ShaderFilter"
    behavior: >-
      `new ShaderFilter(shader)` retains the supplied Shader reference, including null.
      `blendMode` is a directly writable field initialized to `BlendMode.NORMAL`; shader is also
      directly writable. Neither assignment automatically marks the filter dirty.
    source:
      - filters/ShaderFilter.hx:new
      - filters/ShaderFilter.hx:shader
      - filters/ShaderFilter.hx:blendMode
    scenarios:
      - display/shader-types:filter.defaults

  - id: filters.Shader.edge-extensions
    section: "ShaderFilter"
    behavior: >-
      `topExtension`, `rightExtension`, `bottomExtension`, and `leftExtension` default to zero
      and store arbitrary signed integers without validation. Their setters likewise do not mark
      rendering dirty.
    source:
      - filters/ShaderFilter.hx:leftExtension
      - filters/ShaderFilter.hx:topExtension
      - filters/ShaderFilter.hx:rightExtension
      - filters/ShaderFilter.hx:bottomExtension
    scenarios:
      - display/shader-types:filter.mutated
      - filters/properties:derivedInternals.shader

  - id: filters.Shader.invalidate
    section: "ShaderFilter"
    behavior: >-
      `invalidate()` has no return value and only marks render state dirty; callers must invoke
      it after modifying shader parameters or other fields when they require a refresh.
    source:
      - filters/ShaderFilter.hx:invalidate
    scenarios:
      - filters/properties:descriptorSynchronization.shader.invalidateRefreshes

  - id: filters.Shader.clone-reference-rules
    section: "ShaderFilter"
    behavior: >-
      `clone()` shares the Shader reference and copies the four extensions and current blend
      mode into a new ShaderFilter.
    source:
      - filters/ShaderFilter.hx:clone
    scenarios:
      - display/shader-types:filter.clone

  - id: filters.Shader.shader-pass-bounds
    section: "ShaderFilter"
    behavior: >-
      OpenFL uses exactly one shader pass, returns the retained Shader for that pass, and
      applies `blendMode` as the shader pass's blend mode. Its internal filtered render bounds
      expand by the four supplied extensions; public bounds do not.
    source:
      - filters/ShaderFilter.hx:__initShader
    scenarios:
      - filters/properties:derivedInternals.shader

  - id: filters.Shader.descriptor-synchronization
    section: "ShaderFilter"
    behavior: >-
      The adapter preserves the value/clone/invalidation surface and creates a Flight shader
      descriptor. A direct `shader` change is not synchronized into that descriptor until
      `invalidate()` (or filter reassignment invokes synchronization); `blendMode` has no
      Flight-descriptor representation. Its edge-extension fields feed internal cache bounds.
    source:
      - filters/ShaderFilter.hx:__initShader
      - filters/ShaderFilter.hx:invalidate
    scenarios:
      - filters/properties:descriptorSynchronization.shader

  - id: filters.Shader.bitmap-noop
    section: "ShaderFilter"
    behavior: >-
      `BitmapData.applyFilter` reaches the base no-op because ShaderFilter has no bitmap
      override in 9.5.2; the adapter also returns without mutation, matching the final pixels.
    source:
      - filters/BitmapFilter.hx:__applyFilter
    scenarios:
      - filters/properties:bitmapApplications.shaderNoop

  - id: filters.Shader.live-node-rendering
    section: "ShaderFilter"
    behavior: >-
      ShaderFilter has no live node-render path. Blocker: **Per-node render-effect attachment**.
    source:
      - filters/ShaderFilter.hx:__initShader
    notes: 'Blocked on Flight gap "Per-node render effects".'
    scenarios: []

  # -- Supporting constants --

  - id: filters.Const.quality-values
    section: "Supporting constants"
    behavior: >-
      `BitmapFilterQuality.LOW`, `MEDIUM`, and `HIGH` are exactly `1`, `2`, and `3`. The abstract
      also converts freely from and to Int and UInt, so arbitrary numeric values are representable.
    source:
      - filters/BitmapFilterQuality.hx:LOW
      - filters/BitmapFilterQuality.hx:MEDIUM
      - filters/BitmapFilterQuality.hx:HIGH
    scenarios:
      - filters/properties:values.blur
      - filters/properties:values.bevel

  - id: filters.Const.type-values-conversion
    section: "Supporting constants"
    behavior: >-
      When `openfljs` is not defined, `BitmapFilterType.FULL`, `INNER`, and `OUTER` are integer
      abstract values `0`, `1`, and `2`, with exact private string conversions `"full"`,
      `"inner"`, and `"outer"`; an unknown string converts to null. With `openfljs`, those three
      strings are the abstract values directly. This branch follows the define, not the generic
      JavaScript target.
    source:
      - filters/BitmapFilterType.hx:FULL
      - filters/BitmapFilterType.hx:INNER
      - filters/BitmapFilterType.hx:OUTER
      - filters/BitmapFilterType.hx:fromString
      - filters/BitmapFilterType.hx:toString
    notes: >-
      The integer-versus-string representation branch is selected by the `openfljs` define on
      non-Flash builds.
    scenarios:
      - filters/properties:defaults.bevel
      - filters/properties:values.bevel
      - filters/properties:mutations.bevel
      - filters/properties:edges.bevel

  - id: filters.Const.displacement-mode-values
    section: "Supporting constants"
    behavior: >-
      `DisplacementMapFilterMode.WRAP`, `CLAMP`, `IGNORE`, and `COLOR` are the literal strings
      `"wrap"`, `"clamp"`, `"ignore"`, and `"color"`. The abstract converts freely from and to
      String, so arbitrary strings are representable.
    source:
      - filters/DisplacementMapFilterMode.hx:CLAMP
      - filters/DisplacementMapFilterMode.hx:COLOR
      - filters/DisplacementMapFilterMode.hx:IGNORE
      - filters/DisplacementMapFilterMode.hx:WRAP
    scenarios:
      - filters/properties:defaults.displacement
      - filters/properties:values.displacement
      - filters/properties:mutations.displacement

  - id: filters.Target.macro-shader-initialization
    section: "Package target selection"
    behavior: >-
      Under the `macro` define, filter shader constructors skip their uniform default writes.
      Blur, ColorMatrix, Convolution, and DisplacementMap shader initializers still return their
      shared Shader objects without normal uniform/pass setup; Bevel returns its final bevel
      shader without selecting blur passes; Glow and DropShadow return null from shader
      initialization. Normal runtime builds execute the non-macro branches.
    source:
      - filters/BevelFilter.hx:__init__
      - filters/BlurFilter.hx:__init__
      - filters/ColorMatrixFilter.hx:__init__
      - filters/ConvolutionFilter.hx:__init__
      - filters/DropShadowFilter.hx:__init__
      - filters/GlowFilter.hx:__init__
    notes: >-
      Applies only to code executing in the Haxe macro compilation context and concerns internal
      rendering state rather than public filter property storage.
    scenarios: []

  # -- Package target selection --

  - id: filters.Target.flash-native-aliases
    section: "Package target selection"
    behavior: >-
      On the Flash target, BitmapFilter, its public concrete filter subclasses, and the public
      filter constant/mode abstracts in this source tree are typedefs to their corresponding
      `flash.filters` types. Their executable entries above describe non-Flash OpenFL behavior.
      BitmapFilterShader is the exception: its OpenFL class is compiled on every target.
    source:
      - filters/BitmapFilter.hx:new
    notes: "Applies only when the `flash` compilation target is selected."
    scenarios: []
