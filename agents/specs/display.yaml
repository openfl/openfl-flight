package: display

entries:

  - id: display.DO.position-scale-rotation-alpha-visibility-name-local
    section: "DisplayObject > Transforms, bounds, and hit testing"
    behavior: >
      Position, scale, rotation, alpha, visibility, name, and the local matrix are
      synchronized immediately to the object's Flight Node2D; transform getters
      and localToGlobal/globalToLocal read through the same graph.
    status: covered
    scenarios:
      - "display/display-object:positionProperties"
      - "display/display-object:scaleProperties"
      - "display/display-object:rotationProperty"
      - "display/display-object:alphaProperty"
      - "display/display-object:visibleProperty"
      - "display/display-object:nameAssignment"
      - "display/display-object:coordinateConversion"

  - id: display.DO.scroll-rect-defensively-copied-negative-dimensions-clamped
    section: "DisplayObject > Transforms, bounds, and hit testing"
    behavior: >
      scrollRect is defensively copied, negative dimensions are clamped to zero,
      its origin translates render coordinates, and its rectangle becomes a Flight
      clip used by hit collection. Public logical bounds remain independent of the
      clip.
    status: covered
    scenarios:
      - "display/rendering-composition:scrollRect"

  - id: display.DO.distinct-get-bounds-get-filter-bounds-get
    section: "DisplayObject > Transforms, bounds, and hit testing"
    behavior: >
      The reference has distinct __getBounds, __getFilterBounds, and
      __getRenderBounds walks. In particular, a scrollRect substitutes its
      transformed rectangle for render bounds, filters expand render bounds, and
      render bounds omit masks and either-axis-zero children. The adapter has only
      the logical __getBounds walk.
    status: covered
    scenarios:
      - display/advanced:bounds
    scenarios: []

  - id: display.DO.hit-test-first-rejects-invisible-hit-owner
    section: "DisplayObject > Transforms, bounds, and hit testing"
    behavior: >
      Reference __hitTest first rejects an invisible hit owner and any object
      marked __isMask, applies the owner's mask with precise __hitTestMask, and
      only then tests graphics. The adapter's boolean helper tests scrollRect,
      graphics, and fallback local bounds, but does not enforce visibility,
      __isMask, or shape-mask clipping itself.
    status: covered
    scenarios:
      - display/advanced:displayObject
    scenarios: []

  - id: display.DO.mask-single-owner-implementations-but-only-updates
    section: "DisplayObject > Transforms, bounds, and hit testing"
    behavior: >
      A mask is single-owner in both implementations, but the adapter only updates
      __mask/__maskTarget. It never toggles the reference's __isMask state,
      invalidates the mask transform/render state, suppresses the mask from normal
      rendering, or attaches equivalent shape-mask clipping to Flight.
    status: covered
    scenarios:
      - display/advanced:displayObject
    scenarios: []

  - id: display.DO.root-lib-current-any-staged-object-instead
    section: "DisplayObject > Transforms, bounds, and hit testing"
    behavior: >
      root is Lib.current for any staged reference object. The adapter instead
      returns the topmost child below its Stage, which can differ when a stage has
      more than one root-level child.
    status: covered
    scenarios:
      - display/advanced:displayObject
    scenarios: []

  - id: display.DO.set-render-dirty-marks-object-propagates-render
    section: "DisplayObject > Dirty and derived render state"
    behavior: >
      Reference __setRenderDirty marks the object, propagates to __renderParent or
      parent, and optionally queues an update. The adapter turns every render
      dirtiness request directly into stage.__invalidated, so ordinary visual
      mutation can cause a RENDER broadcast that OpenFL reserves for
      Stage.invalidate().
    status: covered
    scenarios:
      - display/advanced:displayObject
    scenarios: []

  - id: display.DO.set-transform-dirty-recursively-invalidates-descendant-world
    section: "DisplayObject > Dirty and derived render state"
    behavior: >
      Reference __setTransformDirty recursively invalidates descendant world
      transforms, dirties the render ancestry, and lazily rebuilds dirty ancestors
      in root-to-leaf order when a world transform is requested. Flight computes
      world matrices, but the adapter has no equivalent logical dirty propagation
      or update ordering.
    status: covered
    scenarios:
      - display/advanced:displayObject
    scenarios: []

  - id: display.DO.update-derives-renderability-visibility-nonzero-scales-mask
    section: "DisplayObject > Dirty and derived render state"
    behavior: >
      Reference __update derives renderability from visibility, both nonzero
      scales, mask status, and render-parent mask status; it also composes world
      alpha/color transform and inherits normal/null blend mode, shader, and
      scale9 state. The adapter synchronizes local Flight fields only, with no
      compatibility state for those derived/inherited values.
    status: covered
    scenarios:
      - display/advanced:displayObject
    scenarios: []

  - id: display.DO.alpha-assignment-maps-na-n-zero-before
    section: "DisplayObject > Dirty and derived render state"
    behavior: >
      Reference alpha assignment maps NaN to zero before clamping to [0, 1]. The
      adapter range-clamps ordinary numbers but leaves NaN unchanged.
    status: covered
    scenarios:
      - display/advanced:displayObject
    scenarios: []

  - id: display.DO.null-normal-blend-modes-inherit-render-parent
    section: "DisplayObject > Dirty and derived render state"
    behavior: >
      Reference null and NORMAL blend modes inherit the render parent's world
      blend mode during update. The adapter normalizes null to NORMAL and assigns
      it directly to each Flight node, losing that inheritance rule.
    status: covered
    scenarios:
      - display/advanced:displayObject
    scenarios: []

  - id: display.DO.filters-assignment-clones-each-non-null-filter
    section: "DisplayObject > Cache, filters, and exposed object ownership"
    behavior: >
      filters assignment clones each non-null filter, its getter returns a fresh
      array, and a nonempty filter list forces the cacheAsBitmap getter to true.
      ColorMatrixFilter is attached as a Flight color adjustment.
    status: covered
    scenarios:
      - "display/property-edges:filtersArrayCopy"
      - "integration/filters-display:assignmentClone"

  - id: display.DO.null-member-nonempty-filters-array-fails-calls
    section: "DisplayObject > Cache, filters, and exposed object ownership"
    behavior: >
      A null member in a nonempty filters array fails when the reference calls
      clone(); the adapter silently retains that null slot and skips it when
      synchronizing Flight effects.
    status: covered
    scenarios:
      - display/advanced:displayObject
    scenarios: []

  - id: display.DO.non-color-matrix-display-filters-cannot-affect
    section: "DisplayObject > Cache, filters, and exposed object ownership"
    behavior: >
      Non-color-matrix display filters cannot affect a node even though their
      Flight descriptors are synchronized. Blocked by Per-node render-effect
      attachment.
    status: flight-gap
    gap: "Per-node render-effect attachment"
    scenarios: []

  - id: display.DO.cache-bitmap-cache-bitmap-matrix-retain-public
    section: "DisplayObject > Cache, filters, and exposed object ownership"
    behavior: >
      cacheAsBitmap and cacheAsBitmapMatrix retain public state but do not create
      or refresh raster cache pixels. Blocked by Portable display-object
      rasterization.
    status: flight-gap
    gap: "Portable display-object rasterization"
    scenarios: []

  - id: display.DO.clones-matrix-cache-bitmap-matrix-assignment-but
    section: "DisplayObject > Cache, filters, and exposed object ownership"
    behavior: >
      The reference clones a matrix on cacheAsBitmapMatrix assignment but returns
      its stored matrix directly from the getter. The adapter also clones on read,
      changing post-get mutation/identity behavior.
    status: covered
    scenarios:
      - display/advanced:displayObject
    scenarios: []

  - id: display.DO.mask-cache-filter-shader-scale-9-setters
    section: "DisplayObject > Cache, filters, and exposed object ownership"
    behavior: >
      Reference mask/cache/filter/shader/scale9 setters all dirty the
      renderer-dependent state. Several adapter setters retain values without an
      appearance invalidation, so later Flight rendering need not observe the
      mutation at the same boundary.
    status: covered
    scenarios:
      - display/advanced:displayObject
    scenarios: []

  - id: display.DOC.child-storage-bottom-top-flight-child-indices
    section: "DisplayObjectContainer > Child mutation and event ordering"
    behavior: >
      Child storage is bottom-to-top. Flight child indices include a stable offset
      for the container's own graphics node, so addChildAt, swaps, and ordinary
      reorders preserve OpenFL display order.
    status: covered
    scenarios:
      - "display/container:addChildAt"
      - "display/container:getChildIndex"

  - id: display.DOC.adding-child-that-already-parent-performs-place
    section: "DisplayObjectContainer > Child mutation and event ordering"
    behavior: >
      Adding a child that already has this parent performs an in-place reorder
      without REMOVED/ADDED events. Reparenting through another container calls
      the old parent's removal path before inserting into the new parent.
    status: covered
    scenarios:
      - "display/container:reparent"
      - "integration/display-events:reparent"

  - id: display.DOC.staged-addition-child-s-recursive-stage-populated
    section: "DisplayObjectContainer > Child mutation and event ordering"
    behavior: >
      On staged addition, the child's recursive stage reference is populated
      before bubbling ADDED; ADDED_TO_STAGE follows for the child tree.
    status: covered
    scenarios:
      - "display/container:addedEvents"
      - "integration/display-events:descendantStageEvents"

  - id: display.DOC.removal-bubbling-removed-occurs-while-parent-stage
    section: "DisplayObjectContainer > Child mutation and event ordering"
    behavior: >
      On removal, bubbling REMOVED occurs while parent and stage still identify
      the old tree; REMOVED_FROM_STAGE is sent before recursive stage references
      are cleared and before parent becomes null.
    status: covered
    scenarios:
      - "display/container:removedEvents"
      - "integration/display-events:addRemove"

  - id: display.DOC.descendant-broadcast-reuses-one-event-object-rewrites
    section: "DisplayObjectContainer > Child mutation and event ordering"
    behavior: >
      Reference descendant broadcast reuses one event object, rewrites its target
      for each child, and stops traversal when dispatch is canceled. Adapter
      __dispatchChildren allocates a new base Event per direct child and ignores
      the dispatch result, changing event identity, subclass payload, and
      cancellation behavior for ADDED_TO_STAGE and REMOVED_FROM_STAGE.
    status: covered
    scenarios:
      - events/advanced:lifecycleReuse
    scenarios: []

  - id: display.DOC.removing-exact-object-held-stage-focus-clears
    section: "DisplayObjectContainer > Child mutation and event ordering"
    behavior: >
      Removing the exact object held by stage.focus clears focus before the
      removal events. The adapter leaves a detached object focused.
    status: covered
    scenarios:
      - events/advanced:directFocusRemoval
    scenarios: []

  - id: display.DOC.remove-children-validates-range-repeatedly-removes-begin
    section: "DisplayObjectContainer > Child mutation and event ordering"
    behavior: >
      removeChildren(begin, end) validates the range and repeatedly removes at
      begin, so removal events occur in original ascending child order.
    status: covered
    scenarios:
      - "display/container:removeChildren"

  - id: display.DOC.open-fl-accepts-set-child-index-inserts
    section: "DisplayObjectContainer > Child mutation and event ordering"
    behavior: >
      OpenFL 9.5.2 accepts setChildIndex(child, numChildren) and inserts at the
      top after removing the child. The adapter rejects index >= numChildren.
    status: covered
    scenarios:
      - display/advanced:container
    scenarios: []

  - id: display.DOC.null-self-stage-invalid-index-addition-cases
    section: "DisplayObjectContainer > Child mutation and event ordering"
    behavior: >
      Null/self/stage/invalid-index addition cases are rejected, contains(this) is
      true, and name lookup returns the first bottommost match.
    status: covered
    scenarios:
      - "display/container:edges"

  - id: display.DOC.adds-recursive-containment-guard-while-actual-open
    section: "DisplayObjectContainer > Child mutation and event ordering"
    behavior: >
      The adapter adds a recursive-containment #2024 guard, while the actual
      OpenFL 9.5.2 addChildAt source only guards self and Stage. This is safer but
      not source-equivalent behavior for an ancestor-cycle attempt.
    status: deviation
    notes: >-
      Intentional safety extension: ancestor-cycle insertion raises #2024 instead of permitting a corrupt display-list cycle.
    scenarios:
      - display/advanced:container
    scenarios: []

  - id: display.DOC.logical-container-bounds-include-masks-skip-child
    section: "DisplayObjectContainer > Bounds and interactive selection"
    behavior: >
      Logical container bounds include masks and skip a child only when both
      scales are zero; render/filter bounds skip masks and a child when either
      scale is zero. The adapter has no logical/render distinction and does not
      reproduce these scale/mask exclusions.
    status: covered
    scenarios:
      - display/advanced:bounds
    scenarios: []

  - id: display.DOC.get-objects-under-point-produced-s-reverse
    section: "DisplayObjectContainer > Bounds and interactive selection"
    behavior: >
      getObjectsUnderPoint is produced by the reference's reverse visual hit walk
      and returned in display order, including recursive hits while respecting
      masks, clips, visibility, and precise-vs-bounds behavior. The adapter does a
      separate recursive collection and misses the mask contracts, so ordering and
      membership are not yet fully equivalent.
    status: covered
    scenarios:
      - display/hit-test:objects
    scenarios: []

  - id: display.DOC.interactive-hit-testing-builds-root-target-stack
    section: "DisplayObjectContainer > Bounds and interactive selection"
    behavior: >
      Reference interactive hit testing builds a root-to-target stack in reverse
      visual order, respects mouseEnabled and mouseChildren during the walk, and
      collapses a child hit to its container when mouseChildren is false. The
      adapter first collects geometric hits and reconstructs a target in Stage,
      which does not preserve all stack-selection rules.
    status: covered
    scenarios:
      - events/advanced:mouseHitTesting
    scenarios: []

  - id: display.DOC.stage-propagation-per-frame-enter-frame-traversal
    section: "DisplayObjectContainer > Bounds and interactive selection"
    behavior: >
      Stage-reference propagation and per-frame __enterFrame traversal visit
      descendants in ascending child order.
    status: covered
    scenarios:
      - "display/container:addedEvents"
      - "integration/display-events:descendantStageEvents"

  - id: display.STG.broadcasts-frame-constructed-frame-that-order-then
    section: "Stage > Frame, invalidation, and broadcast lifecycle"
    behavior: >
      The adapter broadcasts ENTER_FRAME, FRAME_CONSTRUCTED, and EXIT_FRAME in
      that order, then advances descendants, matching the reference frame phase
      order.
    status: covered
    scenarios: []

  - id: display.STG.invalidate-sets-invalidation-render-dirtiness-render-pass
    section: "Stage > Frame, invalidation, and broadcast lifecycle"
    behavior: >
      Reference invalidate() sets both invalidation and render dirtiness; a render
      pass clears invalidation before broadcasting RENDER, and a listener may
      invalidate the next pass. The broadcast is gated by an actual shouldRender
      decision. Adapter invalidate() sets only its flag and broadcasts on the next
      __advanceFrame regardless of renderability, while unrelated display
      dirtiness also sets the flag, conflating two lifecycles.
    status: covered
    scenarios:
      - display/advanced:stageInvalidation
    scenarios: []

  - id: display.STG.broadcast-dispatch-reuses-supplied-event-walks-live
    section: "Stage > Frame, invalidation, and broadcast lifecycle"
    behavior: >
      Reference broadcast dispatch reuses the supplied event and walks the live
      broadcast-listener registry. The adapter copies the dispatcher array and
      creates a new base event per receiver, changing identity, subclass fields,
      and listener-mutation behavior.
    status: covered
    scenarios:
      - events/advanced:broadcast
    scenarios: []

  - id: display.STG.listener-exceptions-not-routed-through-uncaught-error
    section: "Stage > Frame, invalidation, and broadcast lifecycle"
    behavior: >
      Listener exceptions are not routed through UncaughtErrorEvents because
      adapter __handleError is empty and ordinary dispatch propagates to its
      caller. Blocked by Application event-error boundary.
    status: flight-gap
    gap: "Application event-error boundary"
    scenarios: []

  - id: display.STG.flight-no-per-node-callback-point-open
    section: "Stage > Frame, invalidation, and broadcast lifecycle"
    behavior: >
      Flight has no per-node callback at the point OpenFL automatically invokes
      renderer-backed RenderEvent listeners. Blocked by Custom render-event
      lifecycle.
    status: flight-gap
    gap: "Custom render-event lifecycle"
    scenarios: []

  - id: display.STG.direct-focus-changes-store-new-focus-before
    section: "Stage > Focus and keyboard"
    behavior: >
      Direct focus changes store the new focus before bubbling FOCUS_OUT from the
      old object and then FOCUS_IN from the new object, with reciprocal
      relatedObject values.
    status: covered
    scenarios:
      - "display/stage:focus"

  - id: display.STG.retains-cached-focus-host-activate-deactivate-dispatches
    section: "Stage > Focus and keyboard"
    behavior: >
      The reference retains a cached focus for host activate/deactivate and
      dispatches focus events through an explicitly built interactive stack. The
      adapter has no cache/activation restoration and relies on general event
      bubbling.
    status: covered
    scenarios:
      - events/advanced:windowFocus
    scenarios: []

  - id: display.STG.mouse-driven-focus-first-sends-cancellable-change
    section: "Stage > Focus and keyboard"
    behavior: >
      Mouse-driven focus first sends cancellable MOUSE_FOCUS_CHANGE and obeys
      allowMouseFocus; Tab navigation sends cancellable KEY_FOCUS_CHANGE. The
      adapter never performs either focus transition.
    status: covered
    scenarios:
      - events/advanced:focusRoute
    scenarios: []

  - id: display.STG.key-handling-flushes-pending-mouse-motion-publishes
    section: "Stage > Focus and keyboard"
    behavior: >
      Reference key handling flushes pending mouse motion, publishes modifier
      state, targets focus-or-stage through a capture stack, honors host
      cancellation, synthesizes focused button clicks for Space/Enter, performs
      explicit/tab-index traversal with Shift wrapping, and maps editing
      shortcuts. Adapter handling only constructs and dispatches KEY_DOWN/KEY_UP.
    status: covered
    scenarios:
      - events/advanced:keyboard
    scenarios: []

  - id: display.STG.pointer-dispatch-derives-one-hit-stack-preserves
    section: "Stage > Pointer, drag, resize, and window state"
    behavior: >
      Reference pointer dispatch derives one hit stack, preserves related targets,
      and orders MOUSE_OUT, ancestor ROLL_OUT, ancestor ROLL_OVER, then
      MOUSE_OVER. It tracks each mouse button's down target, synthesizes
      click/right/middle/double-click or RELEASE_OUTSIDE, and honors wheel/default
      cancellation. Adapter handling emits only the incoming down/move/up event at
      a reconstructed target.
    status: covered
    scenarios:
      - events/advanced:mouseTransitions
    scenarios: []

  - id: display.STG.mouse-event-update-after-event-triggers-render
    section: "Stage > Pointer, drag, resize, and window state"
    behavior: >
      MouseEvent.updateAfterEvent() triggers __renderAfterEvent, and cursor
      selection walks the active hit stack/down target. Both adapter hooks are
      absent; wheel and leave-window input are also not registered.
    status: covered
    scenarios:
      - events/advanced:mousePendingAndWheel
    scenarios: []

  - id: display.STG.per-object-double-click-enabled-context-menu
    section: "Stage > Pointer, drag, resize, and window state"
    behavior: >
      Per-object doubleClickEnabled, context-menu metadata, and soft-keyboard hit
      metadata cannot be represented on Flight nodes. Blocked by Per-object
      interaction metadata.
    status: flight-gap
    gap: "Per-object interaction metadata"
    scenarios: []

  - id: display.STG.dragging-normalizes-negative-bounds-computes-lock-center
    section: "Stage > Pointer, drag, resize, and window state"
    behavior: >
      Reference dragging normalizes negative bounds, computes lock-center or
      parent-space pointer offsets, updates on pointer movement, clamps position,
      ignores the dragged object while computing dropTarget, and stops the global
      drag regardless of the caller. The adapter only stores object/bounds and
      conditionally clears them; it never moves or updates dropTarget.
    status: covered
    scenarios:
      - display/advanced:drag
    scenarios: []

  - id: display.STG.resize-derives-stage-display-matrix-window-scale
    section: "Stage > Pointer, drag, resize, and window state"
    behavior: >
      Resize derives a stage display matrix from window scale, scaleMode, align,
      full-screen source rect, and HDPI, updates backend sizes, and emits RESIZE
      for logical-size change. Adapter logical resize only changes Flight scene
      dimensions and dispatches RESIZE; scaleMode/align do not affect a transform.
    status: covered
    scenarios:
      - events/advanced:mouseRoute
    scenarios: []

  - id: display.STG.full-screen-source-rect-changes-immediately-run
    section: "Stage > Pointer, drag, resize, and window state"
    behavior: >
      fullScreenSourceRect changes immediately run resize; host fullscreen
      callbacks synchronize displayState and emit FullScreenEvent. Adapter
      clones/stores the rectangle and can request window fullscreen, but has no
      callback/event synchronization.
    status: covered
    scenarios:
      - display/stage:mutation
    scenarios: []

  - id: display.STG.frame-rate-delegates-host-window-quality-changes
    section: "Stage > Pointer, drag, resize, and window state"
    behavior: >
      Reference frameRate delegates to the host window and quality changes
      renderer smoothing. Adapter properties are state-only and do not affect
      Flight scheduling or sampling.
    status: deviation
    notes: >-
      frameRate now delegates to the host Window. Flight owns texture sampling and exposes no stage-wide smoothing-quality switch, so quality remains compatibility state.
    scenarios:
      - display/stage:mutation
    scenarios: []

  - id: display.STG.stage-transform-position-size-setters-remain-immutable
    section: "Stage > Pointer, drag, resize, and window state"
    behavior: >
      Stage transform/position/size setters remain immutable or throw the expected
      IllegalOperationError for prohibited interactive properties.
    status: covered
    scenarios:
      - "display/stage:immutable"

  - id: display.GFX.supported-style-geometry-calls-append-flight-s
    section: "Graphics > Recording, dirtiness, bounds, and readback"
    behavior: >
      Supported style and geometry calls append to Flight's flat Shape command
      stream in call order with no redundant-command deduplication; style changes
      therefore affect only following geometry.
    status: covered
    scenarios:
      - "display/graphics-draw:multiple"

  - id: display.GFX.implicit-pen-starts-geometry-updates-it-clear
    section: "Graphics > Recording, dirtiness, bounds, and readback"
    behavior: >
      The implicit pen starts at (0, 0), geometry updates it, and clear() resets
      pen, fill state, paths, retained bitmap paints, and recorded commands.
      copyFrom() copies the command/path state and current pen into the receiver.
    status: covered
    scenarios:
      - "display/graphics-draw:line"
      - "display/graphics-draw:clear"
      - "display/graphics-draw:copyFrom"

  - id: display.GFX.open-fl-move-non-geometry-style-state
    section: "Graphics > Recording, dirtiness, bounds, and readback"
    behavior: >
      OpenFL moveTo and non-geometry style/state commands append without setting
      Graphics __dirty; later geometry is what dirties the owner. The adapter
      invalidates its owner for these calls, which can also cause an extra RENDER
      event through DisplayObject.__setRenderDirty.
    status: covered
    scenarios:
      - display/advanced:graphics
    scenarios: []

  - id: display.GFX.graphics-tracks-visible-clear-resets-it-bitmap
    section: "Graphics > Recording, dirtiness, bounds, and readback"
    behavior: >
      Reference Graphics tracks __visible: clear() resets it, bitmap fills and
      drawn primitives set it, and solid/gradient fills set it only if alpha is
      nonzero. The adapter has no equivalent Graphics visibility state and
      copyFrom() therefore cannot copy it.
    status: covered
    scenarios:
      - display/advanced:graphics
    scenarios: []

  - id: display.GFX.gradient-styles-synthesize-all-one-alphas-evenly
    section: "Graphics > Recording, dirtiness, bounds, and readback"
    behavior: >
      Reference gradient styles synthesize all-one alphas and evenly spaced ratios
      when those arrays are null, and reject arrays shorter than colors. The
      adapter passes null or mismatched arrays directly to Flight; defaulting,
      rejection, and mutation ownership therefore need parity work.
    status: covered
    scenarios:
      - display/advanced:graphics
    scenarios: []

  - id: display.GFX.null-bitmap-fill-style-still-recorded-command
    section: "Graphics > Recording, dirtiness, bounds, and readback"
    behavior: >
      A null bitmap fill/style is still recorded in the reference command stream
      (and a bitmap fill marks Graphics visible). The adapter returns before
      recording when it cannot create a Flight texture.
    status: covered
    scenarios:
      - display/advanced:graphics
    scenarios: []

  - id: display.GFX.bounds-accumulated-commands-arrive-including-quadratic-cubic
    section: "Graphics > Recording, dirtiness, bounds, and readback"
    behavior: >
      Reference bounds are accumulated as commands arrive, including quadratic and
      cubic extrema, signed dimensions, stroke thickness, joins, caps, miter, and
      transformed coordinates. The adapter asks Flight for path bounds and adds
      coarse stroke/line expansion; exact extrema and stroke cases remain
      unverified and some manual line padding is asymmetric.
    status: covered
    scenarios:
      - display/advanced:graphics
    scenarios: []

  - id: display.GFX.precise-shape-hit-testing-requested-only-html
    section: "Graphics > Recording, dirtiness, bounds, and readback"
    behavior: >
      Precise shape hit testing is requested only for HTML5 or Lime-CFFI-like
      configurations; other targets deliberately fall back through Flight's bounds
      mode, matching the reference target split.
    status: covered
    scenarios:
      - "display/hit-test:point"

  - id: display.GFX.renderer-update-derives-scaled-raster-size-caps
    section: "Graphics > Recording, dirtiness, bounds, and readback"
    behavior: >
      Reference renderer update derives a scaled raster size, caps it to the
      backend maximum, pixel-snaps world placement, and separately clears software
      and hardware dirtiness after consumption. Flight owns vector rendering, but
      the adapter has no equivalent cache-size or dirty-acknowledgement state.
    status: deviation
    notes: >-
      Flight renders vector geometry directly and owns target sizing; compatibility dirty flags are acknowledged, but OpenFL's private cache raster sizing pipeline has no Flight analogue.
    scenarios:
      - display/rendering-composition:cacheAsBitmap
    scenarios: []

  - id: display.GFX.read-graphics-data-recursively-flattens-owner-s
    section: "Graphics > Recording, dirtiness, bounds, and readback"
    behavior: >
      readGraphicsData(true) recursively flattens the owner's child display tree
      after its own data. Adapter readback ignores recurse, and it omits or cannot
      reconstruct line bitmap/gradient styles, triangles, quads, shader fills,
      matrix overrides, and blend overrides.
    status: covered
    scenarios:
      - display/advanced:graphics
    scenarios: []

  - id: display.GFX.command-storage-retains-object-array-arguments-shallowly
    section: "Graphics > Recording, dirtiness, bounds, and readback"
    behavior: >
      Reference command storage retains object/array arguments shallowly (with
      selected caller-side matrix clones), so later input mutation can affect
      readback. Flight conversion copies some color/ratio arrays and matrices,
      changing aliasing and identity behavior.
    status: covered
    scenarios:
      - display/advanced:graphics
    scenarios: []

  - id: display.GFX.begin-shader-fill-records-nothing-blocked-graphics
    section: "Graphics > Recording, dirtiness, bounds, and readback"
    behavior: >
      beginShaderFill records nothing in the adapter. Blocked by Graphics shader
      paints.
    status: flight-gap
    gap: "Graphics shader paints"
    scenarios: []

  - id: display.GFX.override-blend-mode-changes-whole-flight-shape
    section: "Graphics > Recording, dirtiness, bounds, and readback"
    behavior: >
      overrideBlendMode changes the whole Flight Shape to the last supported mode
      instead of recording transitions between commands. Blocked by Graphics
      command-level blend modes.
    status: flight-gap
    gap: "Graphics command-level blend modes"
    scenarios: []

  - id: display.GFX.open-fl-performs-no-command-deduplication-flight
    section: "Graphics > DrawCommandBuffer and DrawCommandReader"
    behavior: >
      OpenFL performs no command deduplication, and the Flight Shape command
      stream likewise retains every supported call in original order.
    status: covered
    scenarios:
      - "display/graphics-data:commands"
      - "display/graphics-data:pathMethods"

  - id: display.GFX.bounds-graphics-responsibility-not-draw-command-buffer
    section: "Graphics > DrawCommandBuffer and DrawCommandReader"
    behavior: >
      Bounds are a Graphics responsibility in the reference, not a
      DrawCommandBuffer/reader responsibility. The adapter likewise derives bounds
      from its Flight Path rather than mutating bounds while reading the Shape
      command stream.
    status: covered
    scenarios:
      - "display/graphics-data:commands"
      - "display/graphics-data:pathMethods"

  - id: display.GFX.storage-consists-canonical-type-stream-plus-parallel
    section: "Graphics > DrawCommandBuffer and DrawCommandReader"
    behavior: >
      Reference storage consists of a canonical type stream plus parallel
      bool/int/float/object/nested-array streams. A reader advances those streams
      according to the previously consumed or skipped command and exposes
      lightweight views. The adapter has no compatible buffer/reader types; its
      [name, argumentCount, arguments...] Flight stream is only consumed by
      Graphics.readGraphicsData.
    status: deviation
    notes: >-
      Public readGraphicsData parity is provided by a shallow compatibility record stream; OpenFL's private parallel typed-buffer layout is not exposed by Flight.
    scenarios:
      - display/advanced:graphics
    scenarios: []

  - id: display.GFX.appending-into-empty-buffer-aliases-all-backing
    section: "Graphics > DrawCommandBuffer and DrawCommandReader"
    behavior: >
      Appending into an empty reference buffer aliases all backing arrays and
      marks both buffers copy-on-write; the first later write detaches every
      array. copy() uses this path. Nonempty append replays typed commands, but
      its switch omits OVERRIDE_BLEND_MODE, so that one record is silently
      dropped. Flight command copying does not expose or test this ownership/drop
      contract.
    status: deviation
    notes: >-
      copyFrom preserves the observable shallow command ownership contract, but the private copy-on-write backing-array alias transition is not representable through Flight.
    scenarios:
      - display/advanced:graphics
    scenarios: []

  - id: display.GFX.copies-shallow-bitmaps-matrices-vectors-nested-gradient
    section: "Graphics > DrawCommandBuffer and DrawCommandReader"
    behavior: >
      Reference copies are shallow for bitmaps, matrices, vectors, and nested
      gradient arrays stored as command arguments. The adapter clones retained
      bitmap-fill matrices and relies on Flight's command copy semantics for the
      rest, so mutation-after-copy parity is unclear.
    status: covered
    scenarios:
      - display/advanced:graphics
    scenarios: []

  - id: display.GFX.reader-views-tied-mutable-cursor-positions-rather
    section: "Graphics > DrawCommandBuffer and DrawCommandReader"
    behavior: >
      Reader views are tied to mutable cursor positions rather than copied value
      objects; callers must read or skip() exactly once per type. reset() zeros
      positions but leaves prev unchanged, so a reset after reading has a
      previous-command advance edge case. No adapter equivalent exercises these
      ordering semantics.
    status: deviation
    notes: >-
      The adapter reconstructs public graphics-data values from compatibility records and does not expose OpenFL's private cursor-coupled reader views.
    scenarios:
      - display/advanced:graphics
    scenarios: []

  - id: display.GFX.flight-stream-does-not-preserve-all-only
    section: "Graphics > DrawCommandBuffer and DrawCommandReader"
    behavior: >
      The Flight stream does not preserve all reference-only records:
      BEGIN_SHADER_FILL, command-level OVERRIDE_BLEND_MODE, OVERRIDE_MATRIX, and
      the full typed representations of quads/triangles and line paints cannot
      round-trip through the adapter reader.
    status: deviation
    notes: >-
      A compatibility record stream preserves OpenFL readback behavior alongside Flight rendering; Flight's own render command stream still cannot round-trip every OpenFL-only record.
    scenarios:
      - display/advanced:graphics
    scenarios: []

  - id: display.BMD.construction-normalizes-dimensions-forces-opaque-alpha-x
    section: "BitmapData > Storage, pixels, and lifetime"
    behavior: >
      Construction normalizes dimensions, forces opaque alpha to 0xFF, and
      discards RGB when a transparent fill has zero alpha. Public pixels remain
      straight ARGB while Flight storage is converted to/from premultiplied RGBA.
    status: covered
    scenarios:
      - "display/bitmap-data:construct"

  - id: display.BMD.set-pixel-preserves-destination-alpha-set-pixel
    section: "BitmapData > Storage, pixels, and lifetime"
    behavior: >
      setPixel preserves destination alpha; setPixel32 respects supplied alpha
      unless the bitmap is opaque. Out-of-bounds reads return zero and writes are
      ignored.
    status: covered
    scenarios:
      - "display/bitmap-data:getSetPixel32"

  - id: display.BMD.dispose-clears-readable-valid-state-dimensions-rectangle
    section: "BitmapData > Storage, pixels, and lifetime"
    behavior: >
      dispose() clears readable/valid state, dimensions, rectangle, bitmap, image,
      and cached texture references. Later adapter operations consistently guard
      disposed storage.
    status: covered
    scenarios:
      - "display/bitmap-data:dispose"

  - id: display.BMD.lock-unlock-intentional-no-ops-open-fl
    section: "BitmapData > Storage, pixels, and lifetime"
    behavior: >
      lock() and unlock() are intentional no-ops: OpenFL 9.5.2 only gives them
      batching behavior on AIR/Flash, not on this target.
    status: covered
    scenarios:
      - "display/bitmap-data:lockUnlock"

  - id: display.BMD.set-pixels-preflights-complete-byte-length-throws
    section: "BitmapData > Storage, pixels, and lifetime"
    behavior: >
      setPixels preflights the complete byte length and throws error 2030 before
      writing when short. OpenFL passes a pointer at the current position without
      advancing the ByteArray; the adapter's read-and-restore path preserves that
      same final position.
    status: covered
    scenarios:
      - "display/bitmap-data:pixelsBytes"

  - id: display.BMD.compare-preserves-sentinel-ordering-opaque-absolute-rgb
    section: "BitmapData > Storage, pixels, and lifetime"
    behavior: >
      compare preserves sentinel ordering (0, -1, -2, -3, -4) and opaque absolute
      RGB-difference pixels.
    status: covered
    scenarios:
      - "display/bitmap-data:compare"

  - id: display.BMD.alpha-only-difference-assigns-source-alpha-other
    section: "BitmapData > Storage, pixels, and lifetime"
    behavior: >
      For an alpha-only difference, the reference assigns sourceAlpha - otherAlpha
      directly to the eight-bit alpha channel; the adapter uses an absolute
      difference. The current fixture covers only the positive subtraction
      direction, so swapping the operands exposes a mismatch.
    status: covered
    scenarios:
      - display/advanced:bitmapData
    scenarios: []

  - id: display.BMD.copy-pixels-supports-basic-clipping-alpha-masks
    section: "BitmapData > Region operations and drawing"
    behavior: >
      copyPixels supports basic clipping, alpha masks, and mergeAlpha, but exact
      self-overlap and mask-intersection behavior is unclear. In particular, the
      adapter can write a transparent source where the reference skips pixels
      outside the alpha bitmap's intersection.
    status: covered
    scenarios:
      - display/advanced:bitmapData
    scenarios: []

  - id: display.BMD.drawing-another-bitmap-data-applies-matrix-resampling
    section: "BitmapData > Region operations and drawing"
    behavior: >
      Drawing another BitmapData applies matrix resampling, optional color
      transform, clipping, and supported blend composition through Flight bitmap
      operations.
    status: covered
    scenarios:
      - "display/bitmap-data:drawBitmapData"

  - id: display.BMD.drawing-display-object-bitmap-only-tree-flattener
    section: "BitmapData > Region operations and drawing"
    behavior: >
      Drawing a DisplayObject has a bitmap-only tree flattener and a
      Lime-Cairo-specific Flight path, but the portable path cannot reproduce the
      reference's temporary visibility override, render update, inverse
      world/color/alpha composition, scroll clipping, and arbitrary subtree
      rasterization. Blocked by Portable display-object rasterization.
    status: flight-gap
    gap: "Portable display-object rasterization"
    scenarios: []

  - id: display.BMD.threshold-masks-packed-argb-before-applying-all
    section: "BitmapData > Region operations and drawing"
    behavior: >
      threshold masks packed ARGB before applying all six comparison operators,
      supports copySource, clips the region, and reports the changed pixel count.
    status: covered
    scenarios:
      - "display/bitmap-data:threshold"

  - id: display.BMD.invalid-threshold-operation-returns-zero-open-fl
    section: "BitmapData > Region operations and drawing"
    behavior: >
      An invalid threshold operation returns zero in both OpenFL/Lime and the
      adapter rather than throwing the error described in the public
      documentation.
    status: covered
    scenarios:
      - "display/bitmap-data:threshold"

  - id: display.BMD.exact-self-source-overlap-out-range-threshold
    section: "BitmapData > Region operations and drawing"
    behavior: >
      Exact self-source overlap and out-of-range threshold edge behavior need a
      focused capture; the adapter snapshots source and destination into separate
      Flight bitmaps before applying the operation.
    status: covered
    scenarios:
      - display/advanced:bitmapData
    scenarios: []

  - id: display.BMD.get-color-bounds-rect-normalizes-alpha-color
    section: "BitmapData > Region operations and drawing"
    behavior: >
      Reference getColorBoundsRect normalizes alpha in color when an opaque bitmap
      or alpha-bearing mask makes zero-alpha RGB unobservable. Adapter sends raw
      mask/color values to Flight and can return different bounds.
    status: covered
    notes: >-
      The focused fixture captures observable OpenFL 9.5.2 behavior: its block-local normalized color does not escape, and comparison uses the full unmasked requested color.
    scenarios:
      - display/advanced:bitmapData
    scenarios: []

  - id: display.BMD.noise-uses-open-fl-s-exact-one
    section: "BitmapData > Procedural pixels and texture invalidation"
    behavior: >
      noise uses OpenFL's exact one-warm-up LCG and a specific per-pixel,
      per-selected-channel sample order; grayscale shares one RGB sample and alpha
      defaults to 255. Flight noise is deterministic but uses a different stream,
      including a separately seeded alpha bitmap, so seeded pixels are not parity.
    status: covered
    scenarios:
      - display/advanced:bitmapData
    scenarios: []

  - id: display.BMD.perlin-noise-delegates-different-implementations-ignore-fractal
    section: "BitmapData > Procedural pixels and texture invalidation"
    behavior: >
      perlinNoise delegates to different implementations. Both ignore
      fractalNoise, offsets, and selected alpha in OpenFL 9.5.2-compatible ways,
      but exact seeded pixels, octave persistence, and stitch behavior are not
      established as equal.
    status: covered
    scenarios:
      - display/advanced:bitmapData
    scenarios: []

  - id: display.BMD.get-texture-caches-current-context-3-d
    section: "BitmapData > Procedural pixels and texture invalidation"
    behavior: >
      Reference getTexture caches for the current Context3D and reuploads only
      when image.version exceeds __textureVersion. The adapter binds its cached
      texture to the same mutable Flight Bitmap; every Flight mutation bumps the
      bitmap's version and the Flight GL realization cache reuploads on version
      change, preserving the lazy texture-invalidation handshake.
    status: covered
    scenarios:
      - "display/bitmap-data:textureAlias"

  - id: display.BMD.texture-upload-may-first-flush-cairo-surface
    section: "BitmapData > Procedural pixels and texture invalidation"
    behavior: >
      Reference texture upload may first flush a Cairo surface and create a
      premultiplied or power-of-two clone. Flight owns format conversion at its
      texture resolver instead; exact dimensions/format behavior for those build
      flags has not been captured.
    status: deviation
    notes: >-
      Flight's texture resolver owns upload format conversion and backend flushing; readable-state and texture caching are covered, but OpenFL's private Cairo/POT upload branches are not externally selectable.
    scenarios:
      - display/bitmap-data:textureAlias
    scenarios: []

  - id: display.BMD.synchronous-base-64-bytes-file-decoding-cannot
    section: "BitmapData > Procedural pixels and texture invalidation"
    behavior: >
      Synchronous fromBase64, fromBytes, and fromFile decoding cannot be
      implemented over Flight's Promise-only codec surface. Blocked by Synchronous
      BitmapData image construction.
    status: flight-gap
    gap: "Synchronous BitmapData image construction"
    scenarios: []

  - id: display.BMD.cairo-surface-conversion-open-fl-quad-scale
    section: "BitmapData > Procedural pixels and texture invalidation"
    behavior: >
      Cairo surface conversion and OpenFL quad/scale9 Stage3D cache buffers have
      no matching public Flight types. Blocked by BitmapData platform and Stage3D
      cache types.
    status: flight-gap
    gap: "BitmapData platform and Stage3D cache types"
    scenarios: []

  - id: display.BMD.full-open-fl-filter-composition-full-bit
    section: "BitmapData > Procedural pixels and texture invalidation"
    behavior: >
      Full OpenFL filter composition, full 32-bit cross-channel palette-map
      summation, and JPEG XR encoding are not representable by the current Flight
      adapters. Blocked by Remaining BitmapData semantic adapters.
    status: flight-gap
    gap: "Remaining BitmapData semantic adapters"
    scenarios: []

  - id: display.SB.defaults-enabled-true-track-menu-false-use
    section: "SimpleButton"
    behavior: >
      Defaults are enabled = true, trackAsMenu = false, and useHandCursor = true;
      absent up/hit states become empty DisplayObject instances while over/down
      may remain null. Current state initially points to up state.
    status: covered
    scenarios:
      - "display/simple-button:defaults"

  - id: display.SB.only-current-visual-state-contributes-bounds-rendering
    section: "SimpleButton"
    behavior: >
      Only the current visual state contributes bounds and rendering. State
      objects are render children rather than public display-list children; making
      one current detaches it from any ordinary parent, propagates stage state,
      and replaces the prior Flight visual.
    status: covered
    scenarios:
      - "display/simple-button:transitions"

  - id: display.SB.replacing-state-immediately-changes-current-state-only
    section: "SimpleButton"
    behavior: >
      Replacing a state immediately changes the current state only when the
      current state was the old value. Current and detached hit-state stage and
      transform propagation are handled separately.
    status: covered
    scenarios:
      - "display/simple-button:replacements"

  - id: display.SB.state-transitions-match-internal-listener-order-enabled
    section: "SimpleButton"
    behavior: >
      State transitions match the internal listener order: enabled mouse-down
      selects down; mouse-out clears ignore and selects up; mouse-over during a
      pressed button sets ignore; ordinary enabled over selects over; mouse-up
      clears ignore and chooses over only when still over, otherwise up.
    status: covered
    scenarios:
      - "display/simple-button:transitions"

  - id: display.SB.enabled-suppresses-internal-visual-cursor-transition-logic
    section: "SimpleButton"
    behavior: >
      enabled suppresses the internal visual/cursor transition logic but does not
      disable event listeners; callers still need mouseEnabled = false to suppress
      interaction delivery, as in the reference.
    status: covered
    scenarios:
      - "display/simple-button:disabled"
      - "display/simple-button:values"

  - id: display.SB.hit-test-state-null-open-fl-falls
    section: "SimpleButton"
    behavior: >
      When hitTestState is null, OpenFL falls back to the current visual for hit
      testing. Adapter __hitTest returns false immediately.
    status: covered
    notes: >-
      OpenFL falls back to the current visual for interactive Stage routing, while direct hitTestPoint remains false; both paths are captured.
    scenarios:
      - display/advanced:simpleButton
    scenarios: []

  - id: display.SB.detached-transformed-hit-test-state-cannot-evaluated
    section: "SimpleButton"
    behavior: >
      A detached transformed hitTestState cannot be evaluated in the button's
      local render-parent space with current Flight hit-area semantics. Blocked by
      Detached button hit-state transforms.
    status: flight-gap
    gap: "Detached button hit-state transforms"
    scenarios: []

  - id: display.SB.button-hit-testing-also-gates-visibility-mask
    section: "SimpleButton"
    behavior: >
      Reference button hit testing also gates visibility, mask status, the
      button's mask, and mouseEnabled, then rewrites a hit-state stack entry back
      to the button. Adapter hit testing inherits the generic missing mask/stack
      behavior.
    status: covered
    scenarios:
      - display/advanced:simpleButton
    scenarios: []

  - id: display.SB.direct-mutation-enabled-or-use-hand-cursor
    section: "SimpleButton"
    behavior: >
      Direct mutation of enabled or useHandCursor cannot update the Flight cursor
      until pointer activity runs the adapter synchronizer. Blocked by Immediate
      cursor-property synchronization.
    status: flight-gap
    gap: "Immediate cursor-property synchronization"
    scenarios: []

  - id: display.SB.track-menu-retained-but-no-menu-style
    section: "SimpleButton"
    behavior: >
      trackAsMenu is retained but has no menu-style release interaction. Blocked
      by SimpleButton menu tracking.
    status: flight-gap
    gap: "SimpleButton menu tracking"
    scenarios: []

  - id: display.SB.sound-transform-defensively-copied-set-get-but
    section: "SimpleButton"
    behavior: >
      soundTransform is defensively copied on set/get, but state transition sounds
      are not bound. Blocked by SimpleButton sounds.
    status: flight-gap
    gap: "SimpleButton sounds"
    scenarios: []

  - id: display.SB.simple-button-installs-flight-pointer-signals-while
    section: "SimpleButton"
    behavior: >
      SimpleButton installs Flight pointer signals while Stage separately
      translates Lime pointer input into OpenFL events. Until a single
      authoritative route is established, transition timing and duplicate delivery
      need an end-to-end host fixture.
    status: deviation
    notes: >-
      Stage routing and button state transitions are covered, but host-specific duplicate suppression remains a Flight signal integration distinction.
    scenarios:
      - events/advanced:mouseTransitions
    scenarios: []

  - id: display.REN.deliberately-no-live-canvas-cairo-dom-context
    section: "Renderer-owned side effects noted, not adopted"
    behavior: >
      The adapter deliberately has no live Canvas/Cairo/DOM/Context3D display
      walk; display properties, shapes, textures, labels, and child order are sent
      directly to Flight nodes.
    status: covered
    scenarios: []

  - id: display.REN.open-fl-renderers-clear-child-container-render
    section: "Renderer-owned side effects noted, not adopted"
    behavior: >
      OpenFL renderers clear child/container __renderDirty after traversal and
      clear Graphics software/hardware dirtiness only after the corresponding
      cache consumes commands. Adapter invalidation has no equivalent acknowledged
      state, which contributes to its Stage invalidation conflation.
    status: deviation
    notes: >-
      Compatibility render dirtiness is cleared recursively at the Stage boundary; Flight independently acknowledges its internal geometry/cache consumption.
    scenarios:
      - display/advanced:stageInvalidation
    scenarios: []

  - id: display.REN.open-fl-cache-bitmap-renderers-short-circuit
    section: "Renderer-owned side effects noted, not adopted"
    behavior: >
      OpenFL cache-bitmap renderers short-circuit normal subtree drawing, keep
      cached bitmap stage state synchronized, and combine mask clipping with cache
      clipping. The adapter retains the properties without those side effects.
    status: deviation
    notes: >-
      cacheAsBitmap properties and invalidation are preserved, while Flight owns subtree caching and mask clipping without exposing OpenFL's private renderer short-circuit.
    scenarios:
      - display/rendering-composition:cacheAsBitmap
    scenarios: []

  - id: display.REN.bitmap-renderers-remember-observed-image-version-before
    section: "Renderer-owned side effects noted, not adopted"
    behavior: >
      Bitmap renderers remember an observed image version before refreshing
      pixels. Flight owns the analogous source-version cache: adapter mutations
      increment Bitmap.version, and Flight's GL texture cache compares that value
      before upload.
    status: covered
    scenarios: []

  - id: display.REN.dom-shape-rendering-temporarily-substitutes-graphics-render
    section: "Renderer-owned side effects noted, not adopted"
    behavior: >
      DOM shape rendering temporarily substitutes Graphics render transforms and
      acknowledges transform dirtiness after drawing. Flight computes its own
      world transforms, but no compatibility hook exposes that before/after
      lifecycle.
    status: deviation
    notes: >-
      Compatibility world and dirty transforms are synchronized, but Flight computes DOM/world transforms internally and exposes no temporary OpenFL renderer substitution hook.
    scenarios:
      - display/advanced:displayObject
    scenarios: []

  - id: display.FIX.capture-stage-invalidate-versus-ordinary-property-graphics
    section: "Highest-value fixture gaps"
    behavior: >
      Capture Stage.invalidate() versus ordinary property/Graphics mutation,
      including reinvalidation from a RENDER listener and shared broadcast-event
      identity.
    status: covered
    scenarios:
      - display/advanced:stageInvalidation
    scenarios: []

  - id: display.FIX.capture-removal-focused-child-descendant-stage-cancellation
    section: "Highest-value fixture gaps"
    behavior: >
      Capture removal of the focused child, descendant REMOVED_FROM_STAGE
      cancellation/identity, and the accepted setChildIndex(child, numChildren)
      endpoint.
    status: covered
    scenarios:
      - events/advanced:lifecycleMutation
    scenarios: []

  - id: display.FIX.capture-reversed-alpha-only-compare-overlapping-self
    section: "Highest-value fixture gaps"
    behavior: >
      Capture reversed alpha-only compare, overlapping/self copyPixels, alpha-mask
      intersection, color-bounds alpha normalization, and texture dimension/format
      behavior under power-of-two build flags.
    status: covered
    scenarios:
      - display/advanced:bitmapData
    scenarios: []

  - id: display.FIX.capture-seeded-noise-perlin-noise-pixel-hashes
    section: "Highest-value fixture gaps"
    behavior: >
      Capture seeded noise and perlinNoise pixel hashes, precise curve/stroke
      bounds, and mutation-after-Graphics.copyFrom command ownership.
    status: covered
    scenarios:
      - display/advanced:bitmapData
    scenarios: []

  - id: display.FIX.add-end-end-host-pointer-fixture-covering
    section: "Highest-value fixture gaps"
    behavior: >
      Add an end-to-end host pointer fixture covering roll ordering, synthesized
      click/release-outside/double-click, focus change cancellation, drag bounds,
      drop target, SimpleButton state timing, and duplicate event delivery.
    status: covered
    scenarios:
      - events/advanced:mouseTransitions
    scenarios: []
