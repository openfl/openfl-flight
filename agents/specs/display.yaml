    section: BitmapData > Target-specific public surface
    behavior: >-
      drawWithQuality, encode and its Rectangle/options validation, disposeImage,
      generateFilterRect, from/load Base64/Bytes/File, fromCanvas, fromImage, fromTexture,
      getSurface, and Context3D index/vertex-buffer access have distinct synchronous, Future, HTML5,
      Lime/Cairo, readable, null, and disposed branches. Existing entries name several Flight
      blockers, but the remaining observable errors, ownership, completion order, and target gates
      are not comprehensively captured.
