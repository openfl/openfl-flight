    scenarios:
      - display/rendering-composition:bitmapDraw
  - id: display.REN.open-fl-renderers-clear-child-container-render
    section: Renderer-owned side effects noted, not adopted
    behavior: >-
      OpenFL renderers clear child/container __renderDirty after traversal and clear Graphics
      software/hardware dirtiness only after the corresponding cache consumes commands. Adapter
      invalidation has no equivalent acknowledged state, which contributes to its Stage invalidation
      conflation.
    source:
      - display/CairoRenderer.hx:cairo
      - display/CanvasRenderer.hx:context
      - display/DOMElement.hx:new
      - display/DOMRenderer.hx:element
      - display/DisplayObjectShader.hx:new
      - display/Graphics.hx:clear
      - display/GraphicsShader.hx:new
      - display/OpenGLRenderer.hx:gl
    scenarios:
      - display/advanced:stageInvalidation
    notes: >-
      Compatibility render dirtiness is cleared recursively at the Stage boundary; Flight
      independently acknowledges its internal geometry/cache consumption.
  - id: display.REN.open-fl-cache-bitmap-renderers-short-circuit
    section: Renderer-owned side effects noted, not adopted
    behavior: >-
      OpenFL cache-bitmap renderers short-circuit normal subtree drawing, keep cached bitmap stage
      state synchronized, and combine mask clipping with cache clipping. The adapter retains the
      properties without those side effects.
    source:
      - display/CairoRenderer.hx:cairo
      - display/CanvasRenderer.hx:context
      - display/DOMElement.hx:new
      - display/DOMRenderer.hx:element
      - display/DisplayObjectShader.hx:new
      - display/GraphicsShader.hx:new
      - display/OpenGLRenderer.hx:gl
    scenarios:
      - display/rendering-composition:cacheAsBitmap
    notes: >-
      cacheAsBitmap properties and invalidation are preserved, while Flight owns subtree caching and
      mask clipping without exposing OpenFL's private renderer short-circuit.
  - id: display.REN.bitmap-renderers-remember-observed-image-version-before
    section: Renderer-owned side effects noted, not adopted
    behavior: >-
      Bitmap renderers remember an observed image version before refreshing pixels. Flight owns the
      analogous source-version cache: adapter mutations increment Bitmap.version, and Flight's GL
      texture cache compares that value before upload.
    source:
      - display/CairoRenderer.hx:cairo
      - display/CanvasRenderer.hx:context
      - display/DOMElement.hx:new
      - display/DOMRenderer.hx:element
      - display/DisplayObjectShader.hx:new
      - display/GraphicsShader.hx:new
      - display/OpenGLRenderer.hx:gl
    scenarios:
      - display/bitmap-data:textureAlias
  - id: display.REN.dom-shape-rendering-temporarily-substitutes-graphics-render
    section: Renderer-owned side effects noted, not adopted
    behavior: >-
      DOM shape rendering temporarily substitutes Graphics render transforms and acknowledges
      transform dirtiness after drawing. Flight computes its own world transforms, but no
      compatibility hook exposes that before/after lifecycle.
    source:
      - display/CairoRenderer.hx:cairo
      - display/CanvasRenderer.hx:context
      - display/DOMElement.hx:new
      - display/DOMRenderer.hx:element
      - display/DisplayObjectShader.hx:new
      - display/Graphics.hx:readGraphicsData
      - display/GraphicsShader.hx:new
      - display/OpenGLRenderer.hx:gl
    scenarios:
      - display/advanced:displayObject
    notes: >-
      Compatibility world and dirty transforms are synchronized, but Flight computes DOM/world
      transforms internally and exposes no temporary OpenFL renderer substitution hook.
  - id: display.FIX.capture-stage-invalidate-versus-ordinary-property-graphics
    section: Focused fixture coverage
