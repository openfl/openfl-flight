package: display
entries:
  - id: display.DO.position-scale-rotation-alpha-visibility-name-local
    section: DisplayObject > Transforms, bounds, and hit testing
    behavior: >-
      Position, scale, rotation, alpha, visibility, name, and the local matrix are synchronized
      immediately to the object's Flight Node2D; transform getters and localToGlobal/globalToLocal
      read through the same graph.
    source:
      - display/DisplayObject.hx:alpha
      - display/DisplayObject.hx:globalToLocal
      - display/DisplayObject.hx:localToGlobal
      - display/DisplayObject.hx:name
      - display/DisplayObject.hx:rotation
      - display/DisplayObject.hx:transform
      - display/FrameLabel.hx:name
      - display/Scene.hx:name
      - display/Tile.hx:rotation
    scenarios:
      - display/display-object:positionProperties
      - display/display-object:scaleProperties
      - display/display-object:rotationProperty
      - display/display-object:alphaProperty
      - display/display-object:visibleProperty
      - display/display-object:nameAssignment
      - display/display-object:coordinateConversion
  - id: display.DO.scroll-rect-defensively-copied-negative-dimensions-clamped
    section: DisplayObject > Transforms, bounds, and hit testing
    behavior: >-
      scrollRect is defensively copied, negative dimensions are clamped to zero, its origin
      translates render coordinates, and its rectangle becomes a Flight clip used by hit collection.
      Public logical bounds remain independent of the clip.
    source:
      - display/DisplayObject.hx:scrollRect
    scenarios:
      - display/rendering-composition:scrollRect
  - id: display.DO.distinct-get-bounds-get-filter-bounds-get
    section: DisplayObject > Transforms, bounds, and hit testing
    behavior: >-
      The reference has distinct __getBounds, __getFilterBounds, and __getRenderBounds walks. In
      particular, a scrollRect substitutes its transformed rectangle for render bounds, filters
      expand render bounds, and render bounds omit masks and either-axis-zero children. The adapter
      now preserves all three walks and their distinct clipping/filter rules.
    source:
      - display/DisplayObject.hx:filters
      - display/DisplayObject.hx:getBounds
      - display/DisplayObject.hx:getRect
      - display/DisplayObject.hx:scrollRect
      - display/Tile.hx:getBounds
    scenarios:
      - display/advanced:bounds
  - id: display.DO.hit-test-first-rejects-invisible-hit-owner
    section: DisplayObject > Transforms, bounds, and hit testing
    behavior: >-
      Reference __hitTest first rejects an invisible hit owner and any object marked __isMask,
      applies the owner's mask with precise __hitTestMask, and only then tests graphics. The adapter
      enforces the same visibility, mask-owner, shape-mask, scrollRect, graphics, and
      fallback-bounds gates.
    source:
      - display/DisplayObject.hx:mask
      - display/DisplayObject.hx:scrollRect
      - display/Graphics.hx:readGraphicsData
      - display/NativeWindow.hx:owner
      - display/NativeWindowInitOptions.hx:owner
    scenarios:
      - display/advanced:displayObject
  - id: display.DO.mask-single-owner-implementations-but-only-updates
    section: DisplayObject > Transforms, bounds, and hit testing
    behavior: >-
      A mask is single-owner. Transferring it clears the former owner; assignment updates
      __mask/__maskTarget and __isMask, invalidates transform/render state, suppresses the mask from
      ordinary rendering, and installs equivalent Flight clipping state.
    source:
      - display/DisplayObject.hx:mask
      - display/DisplayObject.hx:transform
    scenarios:
      - display/advanced:displayObject
  - id: display.DO.root-lib-current-any-staged-object-instead
    section: DisplayObject > Transforms, bounds, and hit testing
    behavior: >-
      root is Lib.current for any staged object and null while unstaged. It is not merely the
      topmost child below Stage when multiple root-level children exist.
    source:
      - display/DisplayObject.hx:root
      - display/DisplayObject.hx:stage
    scenarios:
      - display/advanced:displayObject
  - id: display.DO.set-render-dirty-marks-object-propagates-render
    section: DisplayObject > Dirty and derived render state
    behavior: >-
      __setRenderDirty marks the object and propagates through __renderParent or parent without
      setting Stage.__invalidated. Ordinary visual mutation dirties rendering but does not schedule
      the RENDER broadcast reserved for Stage.invalidate().
    source:
      - display/DisplayObject.hx:invalidate
      - display/DisplayObject.hx:parent
      - display/DisplayObject.hx:stage
    scenarios:
      - display/advanced:displayObject
  - id: display.DO.set-transform-dirty-recursively-invalidates-descendant-world
    section: DisplayObject > Dirty and derived render state
    behavior: >-
      __setTransformDirty recursively invalidates descendant world transforms, dirties the render
      ancestry, and lazily rebuilds dirty ancestors in root-to-leaf order when a world transform is
      requested. Flight state is synchronized after this compatibility ordering is applied.
    source:
      - display/DisplayObject.hx:root
      - display/DisplayObject.hx:transform
    scenarios:
      - display/advanced:displayObject
  - id: display.DO.update-derives-renderability-visibility-nonzero-scales-mask
    section: DisplayObject > Dirty and derived render state
    behavior: >-
      __update derives renderability from visibility, both nonzero scales, mask status, and
      render-parent mask status. It composes world alpha/color state and inherits normal/null blend
      mode, shader, and scale9 state before synchronizing the derived values to Flight.
    source:
      - display/BlendMode.hx:ALPHA
      - display/BlendMode.hx:NORMAL
      - display/BlendMode.hx:SHADER
      - display/DisplayObject.hx:alpha
      - display/DisplayObject.hx:blendMode
      - display/DisplayObject.hx:mask
      - display/DisplayObject.hx:parent
      - display/DisplayObject.hx:shader
    scenarios:
      - display/advanced:displayObject
  - id: display.DO.alpha-assignment-maps-na-n-zero-before
    section: DisplayObject > Dirty and derived render state
    behavior: >-
      Alpha assignment maps NaN to zero and clamps all other values to [0, 1] before updating render
      state.
    source:
      - display/DisplayObject.hx:alpha
    scenarios:
      - display/advanced:displayObject
  - id: display.DO.null-normal-blend-modes-inherit-render-parent
    section: DisplayObject > Dirty and derived render state
    behavior: >-
      Null and NORMAL blend modes inherit the render parent's world blend mode during update; a
      non-normal value overrides the inherited mode.
    source:
      - display/BlendMode.hx:NORMAL
      - display/DisplayObject.hx:blendMode
      - display/DisplayObject.hx:parent
      - display/NativeWindowDisplayState.hx:NORMAL
      - display/NativeWindowInitOptions.hx:renderMode
      - display/NativeWindowType.hx:NORMAL
    scenarios:
      - display/advanced:displayObject
  - id: display.DO.filters-assignment-clones-each-non-null-filter
    section: DisplayObject > Cache, filters, and exposed object ownership
    behavior: >-
      filters assignment clones each non-null filter, its getter returns a fresh array, and a
      nonempty filter list forces the cacheAsBitmap getter to true. ColorMatrixFilter is attached as
      a Flight color adjustment.
    source:
      - display/DisplayObject.hx:cacheAsBitmap
      - display/DisplayObject.hx:filters
    scenarios:
      - display/property-edges:filtersArrayCopy
      - integration/filters-display:assignmentClone
  - id: display.DO.null-member-nonempty-filters-array-fails-calls
    section: DisplayObject > Cache, filters, and exposed object ownership
    behavior: >-
      A null member in a nonempty filters array fails immediately when assignment attempts to clone
      each element; no partial filter state is installed.
    source:
      - display/DisplayObject.hx:filters
    scenarios:
      - display/advanced:displayObject
  - id: display.DO.non-color-matrix-display-filters-cannot-affect
    section: DisplayObject > Cache, filters, and exposed object ownership
    behavior: >-
      Non-color-matrix display filters cannot affect a node even though their Flight descriptors are
      synchronized.
    source:
      - display/DisplayObject.hx:filters
    scenarios: []
    notes: Blocked on Flight gap "Per-node render-effect attachment".
  - id: display.DO.cache-bitmap-cache-bitmap-matrix-retain-public
    section: DisplayObject > Cache, filters, and exposed object ownership
    behavior: >-
      cacheAsBitmap and cacheAsBitmapMatrix retain public state but do not create or refresh raster
      cache pixels.
    source:
      - display/DisplayObject.hx:cacheAsBitmap
      - display/DisplayObject.hx:cacheAsBitmapMatrix
      - display/DisplayObject.hx:filters
    scenarios: []
    notes: Blocked on Flight gap "Portable display-object rasterization".
  - id: display.DO.clones-matrix-cache-bitmap-matrix-assignment-but
    section: DisplayObject > Cache, filters, and exposed object ownership
    behavior: >-
      cacheAsBitmapMatrix clones a matrix on assignment but returns its stored matrix directly from
      the getter, so mutation through a retrieved reference affects later reads.
    source:
      - display/DisplayObject.hx:cacheAsBitmap
      - display/DisplayObject.hx:cacheAsBitmapMatrix
      - display/DisplayObject.hx:filters
    scenarios:
      - display/advanced:displayObject
  - id: display.DO.mask-cache-filter-shader-scale-9-setters
    section: DisplayObject > Cache, filters, and exposed object ownership
    behavior: >-
      Mask, cache, filter, shader, and scale9 setters dirty the appropriate renderer-dependent state
      so the next Flight synchronization observes each appearance mutation at the OpenFL boundary.
    source:
      - display/DisplayObject.hx:filters
      - display/DisplayObject.hx:mask
      - display/DisplayObject.hx:shader
    scenarios:
      - display/advanced:displayObject
  - id: display.DOC.child-storage-bottom-top-flight-child-indices
    section: DisplayObjectContainer > Child mutation and event ordering
    behavior: >-
      Child storage is bottom-to-top. Flight child indices include a stable offset for the
      container's own graphics node, so addChildAt, swaps, and ordinary reorders preserve OpenFL
      display order.
    source:
      - display/DisplayObject.hx:invalidate
      - display/DisplayObjectContainer.hx:addChild
      - display/DisplayObjectContainer.hx:addChildAt
      - display/Graphics.hx:readGraphicsData
      - display/GraphicsQuadPath.hx:indices
      - display/GraphicsTrianglePath.hx:indices
    scenarios:
      - display/container:addChildAt
      - display/container:getChildIndex
  - id: display.DOC.adding-child-that-already-parent-performs-place
    section: DisplayObjectContainer > Child mutation and event ordering
    behavior: >-
      Adding a child that already has this parent performs an in-place reorder without REMOVED/ADDED
      events. Reparenting through another container calls the old parent's removal path before
      inserting into the new parent.
    source:
      - display/DisplayObject.hx:parent
      - display/DisplayObjectContainer.hx:addChild
      - display/DisplayObjectContainer.hx:areInaccessibleObjectsUnderPoint
      - display/DisplayObjectContainer.hx:getChildAt
      - display/DisplayObjectContainer.hx:getChildByName
      - display/DisplayObjectContainer.hx:getChildIndex
      - display/DisplayObjectContainer.hx:stopAllMovieClips
      - display/DisplayObjectContainer.hx:swapChildren
      - display/DisplayObjectContainer.hx:swapChildrenAt
      - display/DisplayObjectContainer.hx:tabChildren
    scenarios:
      - display/container:reparent
      - integration/display-events:reparent
  - id: display.DOC.staged-addition-child-s-recursive-stage-populated
    section: DisplayObjectContainer > Child mutation and event ordering
    behavior: >-
      On staged addition, the child's recursive stage reference is populated before bubbling ADDED;
      ADDED_TO_STAGE follows for the child tree.
    source:
      - display/DisplayObject.hx:stage
      - display/DisplayObjectContainer.hx:addChild
    scenarios:
      - display/container:addedEvents
      - integration/display-events:descendantStageEvents
  - id: display.DOC.removal-bubbling-removed-occurs-while-parent-stage
    section: DisplayObjectContainer > Child mutation and event ordering
    behavior: >-
      On removal, bubbling REMOVED occurs while parent and stage still identify the old tree;
      REMOVED_FROM_STAGE is sent before recursive stage references are cleared and before parent
      becomes null.
    source:
      - display/DisplayObject.hx:parent
      - display/DisplayObject.hx:stage
      - display/DisplayObjectContainer.hx:addChild
    scenarios:
      - display/container:removedEvents
      - integration/display-events:addRemove
  - id: display.DOC.descendant-broadcast-reuses-one-event-object-rewrites
    section: DisplayObjectContainer > Child mutation and event ordering
    behavior: >-
      Descendant broadcast reuses one event object, rewrites its target for each child, preserves
      subclass payload, and stops traversal when dispatch is canceled. This applies to
      ADDED_TO_STAGE and REMOVED_FROM_STAGE.
    source:
      - display/DisplayObject.hx:stage
      - display/DisplayObjectContainer.hx:addChild
    scenarios:
      - events/advanced:lifecycleReuse
  - id: display.DOC.removing-exact-object-held-stage-focus-clears
    section: DisplayObjectContainer > Child mutation and event ordering
    behavior: >-
      Removing the exact object held by stage.focus clears focus before the removal events. The
      source deliberately does not apply that check to an arbitrary focused descendant of the
      removed object.
    source:
      - display/DisplayObject.hx:stage
      - display/DisplayObjectContainer.hx:addChild
    scenarios:
      - events/advanced:directFocusRemoval
  - id: display.DOC.remove-children-validates-range-repeatedly-removes-begin
    section: DisplayObjectContainer > Child mutation and event ordering
    behavior: >-
      removeChildren(begin, end) validates the range and repeatedly removes at begin, so removal
      events occur in original ascending child order.
    source:
      - display/DisplayObject.hx:invalidate
      - display/DisplayObjectContainer.hx:removeChild
      - display/DisplayObjectContainer.hx:removeChildAt
      - display/DisplayObjectContainer.hx:removeChildren
    scenarios:
      - display/container:removeChildren
  - id: display.DOC.open-fl-accepts-set-child-index-inserts
    section: DisplayObjectContainer > Child mutation and event ordering
    behavior: >-
      setChildIndex(child, numChildren) is accepted and inserts the existing child at the top after
      first removing it from its old position.
    source:
      - display/DisplayObject.hx:invalidate
      - display/DisplayObjectContainer.hx:numChildren
      - display/DisplayObjectContainer.hx:setChildIndex
    scenarios:
      - display/advanced:container
  - id: display.DOC.null-self-stage-invalid-index-addition-cases
    section: DisplayObjectContainer > Child mutation and event ordering
    behavior: >-
      Null/self/stage/invalid-index addition cases are rejected, contains(this) is true, and name
      lookup returns the first bottommost match.
    source:
      - display/DisplayObject.hx:name
      - display/DisplayObject.hx:stage
      - display/DisplayObjectContainer.hx:contains
    scenarios:
      - display/container:edges
  - id: display.DOC.adds-recursive-containment-guard-while-actual-open
    section: DisplayObjectContainer > Child mutation and event ordering
    behavior: >-
      The adapter adds a recursive-containment #2024 guard, while the actual OpenFL 9.5.2 addChildAt
      source only guards self and Stage. This is safer but not source-equivalent behavior for an
      ancestor-cycle attempt.
    source:
      - display/DisplayObject.hx:stage
      - display/DisplayObjectContainer.hx:addChild
      - display/DisplayObjectContainer.hx:addChildAt
    scenarios:
      - display/advanced:container
    notes: >-
      Intentional safety extension: ancestor-cycle insertion raises #2024 instead of permitting a
      corrupt display-list cycle.
  - id: display.DOC.logical-container-bounds-include-masks-skip-child
    section: DisplayObjectContainer > Bounds and interactive selection
    behavior: >-
      Logical container bounds include masks and skip a child only when both scales are zero;
      render/filter bounds skip masks and a child when either scale is zero. The adapter preserves
      these distinct exclusions.
    source:
      - display/DisplayObject.hx:getBounds
      - display/DisplayObjectContainer.hx:getObjectsUnderPoint
    scenarios:
      - display/advanced:bounds
  - id: display.DOC.get-objects-under-point-produced-s-reverse
    section: DisplayObjectContainer > Bounds and interactive selection
    behavior: >-
      getObjectsUnderPoint uses a reverse visual hit walk and returns results in display order,
      including recursive hits while respecting masks, clips, visibility, and precise-versus-bounds
      behavior.
    source:
      - display/DisplayObject.hx:getBounds
      - display/DisplayObjectContainer.hx:getObjectsUnderPoint
    scenarios:
      - display/hit-test:objects
  - id: display.DOC.interactive-hit-testing-builds-root-target-stack
    section: DisplayObjectContainer > Bounds and interactive selection
    behavior: >-
      Interactive hit testing builds a root-to-target stack in reverse visual order, respects
      mouseEnabled and mouseChildren during the walk, and collapses a child hit to its container
      when mouseChildren is false.
    source:
      - display/DisplayObject.hx:root
      - display/DisplayObjectContainer.hx:mouseChildren
    scenarios:
      - events/advanced:mouseHitTesting
  - id: display.DOC.stage-propagation-per-frame-enter-frame-traversal
    section: DisplayObjectContainer > Bounds and interactive selection
    behavior: >-
      Stage-reference propagation and per-frame __enterFrame traversal visit descendants in
      ascending child order.
    source:
      - display/DisplayObject.hx:stage
      - display/DisplayObjectContainer.hx:getObjectsUnderPoint
      - display/Timeline.hx:enterFrame
    scenarios:
      - display/container:addedEvents
      - integration/display-events:descendantStageEvents
  - id: display.STG.broadcasts-frame-constructed-frame-that-order-then
    section: Stage > Frame, invalidation, and broadcast lifecycle
    behavior: >-
      The adapter broadcasts ENTER_FRAME, FRAME_CONSTRUCTED, and EXIT_FRAME in that order, then
      advances descendants, matching the reference frame phase order.
    source:
      - display/Stage.hx:new
    scenarios:
      - events/advanced:frameAndRender
  - id: display.STG.invalidate-sets-invalidation-render-dirtiness-render-pass
    section: Stage > Frame, invalidation, and broadcast lifecycle
    behavior: >-
      invalidate() sets both invalidation and render dirtiness; a render pass clears invalidation
      before broadcasting RENDER, and a listener may invalidate the next pass. The broadcast is
      gated by an actual shouldRender decision, while unrelated display dirtiness does not set the
      invalidation flag.
    source:
      - display/Stage.hx:new
    scenarios:
      - display/advanced:stageInvalidation
  - id: display.STG.broadcast-dispatch-reuses-supplied-event-walks-live
    section: Stage > Frame, invalidation, and broadcast lifecycle
    behavior: >-
      Broadcast dispatch reuses the supplied event and walks the live broadcast-listener registry,
      preserving event identity, subclass fields, and listener-mutation behavior across receivers.
    source:
      - display/Stage.hx:new
    scenarios:
      - events/advanced:broadcast
  - id: display.STG.listener-exceptions-not-routed-through-uncaught-error
    section: Stage > Frame, invalidation, and broadcast lifecycle
    behavior: >-
      Listener exceptions are not routed through UncaughtErrorEvents because adapter __handleError
      is empty and ordinary dispatch propagates to its caller.
    source:
      - display/Application.hx:new
      - display/Stage.hx:application
    scenarios: []
    notes: Blocked on Flight gap "Application event-error boundary".
  - id: display.STG.flight-no-per-node-callback-point-open
    section: Stage > Frame, invalidation, and broadcast lifecycle
    behavior: >-
      Flight has no per-node callback at the point OpenFL automatically invokes renderer-backed
      RenderEvent listeners.
    source:
      - display/Stage.hx:new
    scenarios: []
    notes: Blocked on Flight gap "Custom render-event lifecycle".
  - id: display.STG.direct-focus-changes-store-new-focus-before
    section: Stage > Focus and keyboard
    behavior: >-
      Direct focus changes store the new focus before bubbling FOCUS_OUT from the old object and
      then FOCUS_IN from the new object, with reciprocal relatedObject values.
    source:
      - display/Stage.hx:focus
    scenarios:
      - display/stage:focus
  - id: display.STG.retains-cached-focus-host-activate-deactivate-dispatches
    section: Stage > Focus and keyboard
    behavior: >-
      Stage retains a cached focus for host activate/deactivate, restores it on activation, and
      dispatches focus events through an explicitly built interactive stack.
    source:
      - display/NativeWindow.hx:activate
      - display/Stage.hx:focus
    scenarios:
      - events/advanced:windowFocus
  - id: display.STG.mouse-driven-focus-first-sends-cancellable-change
    section: Stage > Focus and keyboard
    behavior: >-
      Mouse-driven focus first sends cancellable MOUSE_FOCUS_CHANGE and obeys allowMouseFocus; Tab
      navigation sends cancellable KEY_FOCUS_CHANGE before applying the requested focus transition.
    source:
      - display/Stage.hx:focus
    scenarios:
      - events/advanced:focusRoute
  - id: display.STG.key-handling-flushes-pending-mouse-motion-publishes
    section: Stage > Focus and keyboard
    behavior: >-
      Key handling flushes pending mouse motion, publishes modifier state, targets focus-or-stage
      through a capture stack, honors host cancellation, synthesizes focused button clicks for
      Space/Enter, performs explicit/tab-index traversal with Shift wrapping, and maps editing
      shortcuts.
    source:
      - display/Stage.hx:focus
    scenarios:
      - events/advanced:keyboard
  - id: display.STG.pointer-dispatch-derives-one-hit-stack-preserves
    section: Stage > Pointer, drag, resize, and window state
    behavior: >-
      Pointer dispatch derives one hit stack, preserves related targets, and orders MOUSE_OUT,
      ancestor ROLL_OUT, ancestor ROLL_OVER, then MOUSE_OVER. It tracks each mouse button's down
      target, synthesizes click/right/middle/double-click or RELEASE_OUTSIDE, and honors
      wheel/default cancellation.
    source:
      - display/Stage.hx:new
      - display/Stage.hx:window
    scenarios:
      - events/advanced:mouseTransitions
  - id: display.STG.mouse-event-update-after-event-triggers-render
    section: Stage > Pointer, drag, resize, and window state
    behavior: >-
      MouseEvent.updateAfterEvent() and KeyboardEvent.updateAfterEvent() trigger __renderAfterEvent.
      Cursor selection walks the active hit stack/down target, and wheel plus leave-window input use
      the same Stage router.
    source:
      - display/Stage.hx:window
    scenarios:
      - events/advanced:mousePendingAndWheel
  - id: display.STG.per-object-double-click-enabled-context-menu
    section: Stage > Pointer, drag, resize, and window state
    behavior: >-
      Per-object doubleClickEnabled, context-menu metadata, and soft-keyboard hit metadata cannot be
      represented on Flight nodes.
    source:
      - display/Stage.hx:window
    scenarios: []
    notes: Blocked on Flight gap "Per-object interaction metadata".
  - id: display.STG.dragging-normalizes-negative-bounds-computes-lock-center
    section: Stage > Pointer, drag, resize, and window state
    behavior: >-
      Dragging normalizes negative bounds, computes lock-center or parent-space pointer offsets,
      updates on pointer movement, clamps position, ignores the dragged object while computing
      dropTarget, and stops the global drag regardless of the caller.
    source:
      - display/Stage.hx:window
    scenarios:
      - display/advanced:drag
  - id: display.STG.resize-derives-stage-display-matrix-window-scale
    section: Stage > Pointer, drag, resize, and window state
    behavior: >-
      Resize derives a stage display matrix from window scale, scaleMode, align, full-screen source
      rect, and HDPI, updates backend sizes, and emits RESIZE for logical-size change. The same
      matrix is applied at the Flight scene boundary and to Stage coordinate conversion.
    source:
      - display/Stage.hx:align
      - display/Stage.hx:fullScreenSourceRect
      - display/Stage.hx:scaleMode
      - display/Stage.hx:window
      - display/Window.hx:scale
    scenarios:
      - events/advanced:mouseRoute
  - id: display.STG.full-screen-source-rect-changes-immediately-run
    section: Stage > Pointer, drag, resize, and window state
    behavior: >-
      fullScreenSourceRect is defensively copied and changes immediately run resize; host fullscreen
      callbacks synchronize displayState and emit FullScreenEvent.
    source:
      - display/Stage.hx:displayState
      - display/Stage.hx:fullScreenSourceRect
      - display/Stage.hx:window
    scenarios:
      - display/stage:mutation
  - id: display.STG.frame-rate-delegates-host-window-quality-changes
    section: Stage > Pointer, drag, resize, and window state
    behavior: >-
      Reference frameRate delegates to the host window and quality changes renderer smoothing.
      Adapter properties are state-only and do not affect Flight scheduling or sampling.
    source:
      - display/LoaderInfo.hx:frameRate
      - display/Stage.hx:frameRate
      - display/Stage.hx:quality
      - display/Stage.hx:window
      - display/Window.hx:frameRate
    scenarios:
      - display/stage:mutation
    notes: >-
      frameRate now delegates to the host Window. Flight owns texture sampling and exposes no
      stage-wide smoothing-quality switch, so quality remains compatibility state.
  - id: display.STG.stage-transform-position-size-setters-remain-immutable
    section: Stage > Pointer, drag, resize, and window state
    behavior: >-
      Stage transform/position/size setters remain immutable or throw the expected
      IllegalOperationError for prohibited interactive properties.
    source:
      - display/Stage.hx:window
    scenarios:
      - display/stage:immutable
  - id: display.GFX.supported-style-geometry-calls-append-flight-s
    section: Graphics > Recording, dirtiness, bounds, and readback
    behavior: >-
      Supported style and geometry calls append to Flight's flat Shape command stream in call order
      with no redundant-command deduplication; style changes therefore affect only following
      geometry.
    source:
      - display/Graphics.hx:readGraphicsData
    scenarios:
      - display/graphics-draw:multiple
  - id: display.GFX.implicit-pen-starts-geometry-updates-it-clear
    section: Graphics > Recording, dirtiness, bounds, and readback
    behavior: >-
      The implicit pen starts at (0, 0), geometry updates it, and clear() resets pen, fill state,
      paths, retained bitmap paints, and recorded commands. copyFrom() copies the command/path state
      and current pen into the receiver.
    source:
      - display/Graphics.hx:clear
      - display/Graphics.hx:copyFrom
    scenarios:
      - display/graphics-draw:line
      - display/graphics-draw:clear
      - display/graphics-draw:copyFrom
  - id: display.GFX.open-fl-move-non-geometry-style-state
    section: Graphics > Recording, dirtiness, bounds, and readback
    behavior: >-
      moveTo and non-geometry style/state commands append without setting Graphics __dirty; later
      geometry is what dirties the owner. Recording these commands alone does not schedule an extra
      Stage RENDER event.
    source:
      - display/Graphics.hx:moveTo
    scenarios:
      - display/advanced:graphics
  - id: display.GFX.graphics-tracks-visible-clear-resets-it-bitmap
    section: Graphics > Recording, dirtiness, bounds, and readback
    behavior: >-
      Graphics tracks __visible: clear() resets it, bitmap fills and drawn primitives set it, and
      solid/gradient fills set it only if alpha is nonzero. copyFrom() copies the source visibility
      state.
    source:
      - display/Graphics.hx:clear
      - display/Graphics.hx:copyFrom
      - display/NativeWindow.hx:visible
      - display/Stage3D.hx:visible
      - display/Tile.hx:visible
    scenarios:
      - display/advanced:graphics
  - id: display.GFX.gradient-styles-synthesize-all-one-alphas-evenly
    section: Graphics > Recording, dirtiness, bounds, and readback
    behavior: >-
      Gradient styles synthesize all-one alphas and evenly spaced ratios when those arrays are null,
      reject arrays shorter than colors, and preserve the source's argument ownership after
      validation.
    source:
      - display/Graphics.hx:readGraphicsData
      - display/GraphicsGradientFill.hx:alphas
    scenarios:
      - display/advanced:graphics
  - id: display.GFX.null-bitmap-fill-style-still-recorded-command
    section: Graphics > Recording, dirtiness, bounds, and readback
    behavior: >-
      A null bitmap fill/style is still recorded in the command stream and a bitmap fill marks
      Graphics visible, even though no Flight texture can be attached for the null source.
    source:
      - display/Graphics.hx:readGraphicsData
    scenarios:
      - display/advanced:graphics
  - id: display.GFX.bounds-accumulated-commands-arrive-including-quadratic-cubic
    section: Graphics > Recording, dirtiness, bounds, and readback
    behavior: >-
      Bounds are accumulated as commands arrive, including quadratic and cubic extrema, signed
      dimensions, stroke thickness, joins, caps, miter, and transformed coordinates. The
      compatibility walk preserves OpenFL's extrema and stroke expansion before publishing geometry
      to Flight.
    source:
      - display/Graphics.hx:readGraphicsData
      - display/GraphicsPath.hx:commands
    scenarios:
      - display/advanced:graphics
  - id: display.GFX.precise-shape-hit-testing-requested-only-html
    section: Graphics > Recording, dirtiness, bounds, and readback
    behavior: >-
      Precise shape hit testing is requested only for HTML5 or Lime-CFFI-like configurations; other
      targets deliberately fall back through Flight's bounds mode, matching the reference target
      split.
    source:
      - display/Graphics.hx:readGraphicsData
    scenarios:
      - display/hit-test:point
    notes: "Target conditions: #if html5, #if lime."
  - id: display.GFX.renderer-update-derives-scaled-raster-size-caps
    section: Graphics > Recording, dirtiness, bounds, and readback
    behavior: >-
      Reference renderer update derives a scaled raster size, caps it to the backend maximum,
      pixel-snaps world placement, and separately clears software and hardware dirtiness after
      consumption. Flight owns vector rendering, but the adapter has no equivalent cache-size or
      dirty-acknowledgement state.
    source:
      - display/Graphics.hx:readGraphicsData
      - display/GraphicsStroke.hx:caps
    scenarios:
      - display/rendering-composition:cacheAsBitmap
    notes: >-
      Flight renders vector geometry directly and owns target sizing; compatibility dirty flags are
      acknowledged, but OpenFL's private cache raster sizing pipeline has no Flight analogue.
  - id: display.GFX.read-graphics-data-recursively-flattens-owner-s
    section: Graphics > Recording, dirtiness, bounds, and readback
    behavior: >-
      readGraphicsData(true) recursively flattens the owner's child display tree after its own data
      and reconstructs supported fill, stroke, path, triangle, quad, matrix, and blend records in
      command order.
    source:
      - display/Graphics.hx:readGraphicsData
    scenarios:
      - display/advanced:graphics
  - id: display.GFX.command-storage-retains-object-array-arguments-shallowly
    section: Graphics > Recording, dirtiness, bounds, and readback
    behavior: >-
      Command storage retains object/array arguments shallowly, with selected caller-side matrix
      clones, so later input mutation affects readback at the same ownership boundaries as OpenFL
      9.5.2.
    source:
      - display/Graphics.hx:readGraphicsData
    scenarios:
      - display/advanced:graphics
  - id: display.GFX.begin-shader-fill-records-nothing-blocked-graphics
    section: Graphics > Recording, dirtiness, bounds, and readback
    behavior: beginShaderFill records nothing in the adapter.
    source:
      - display/Graphics.hx:beginFill
      - display/Graphics.hx:beginShaderFill
      - display/GraphicsShader.hx:new
    scenarios: []
    notes: Blocked on Flight gap "Graphics shader paints".
  - id: display.GFX.override-blend-mode-changes-whole-flight-shape
    section: Graphics > Recording, dirtiness, bounds, and readback
    behavior: >-
      overrideBlendMode changes the whole Flight Shape to the last supported mode instead of
      recording transitions between commands.
    source:
      - display/BlendMode.hx:ADD
      - display/Graphics.hx:readGraphicsData
      - display/Tile.hx:blendMode
    scenarios: []
    notes: Blocked on Flight gap "Graphics command-level blend modes".
  - id: display.GFX.open-fl-performs-no-command-deduplication-flight
    section: Graphics > DrawCommandBuffer and DrawCommandReader
    behavior: >-
      OpenFL performs no command deduplication, and the Flight Shape command stream likewise retains
      every supported call in original order.
    source:
      - display/Graphics.hx:readGraphicsData
    scenarios:
      - display/graphics-data:commands
      - display/graphics-data:pathMethods
  - id: display.GFX.bounds-graphics-responsibility-not-draw-command-buffer
    section: Graphics > DrawCommandBuffer and DrawCommandReader
    behavior: >-
      Bounds are a Graphics responsibility in the reference, not a DrawCommandBuffer/reader
      responsibility. The adapter likewise derives bounds from its Flight Path rather than mutating
      bounds while reading the Shape command stream.
    source:
      - display/Graphics.hx:readGraphicsData
    scenarios:
      - display/graphics-data:commands
      - display/graphics-data:pathMethods
  - id: display.GFX.storage-consists-canonical-type-stream-plus-parallel
    section: Graphics > DrawCommandBuffer and DrawCommandReader
    behavior: >-
      Reference storage consists of a canonical type stream plus parallel
      bool/int/float/object/nested-array streams. A reader advances those streams according to the
      previously consumed or skipped command and exposes lightweight views. The adapter has no
      compatible buffer/reader types; its [name, argumentCount, arguments...] Flight stream is only
      consumed by Graphics.readGraphicsData.
    source:
      - display/Graphics.hx:readGraphicsData
      - display/GraphicsGradientFill.hx:type
      - display/NativeWindow.hx:type
      - display/NativeWindowInitOptions.hx:type
      - display/NativeWindowType.hx:LIGHTWEIGHT
    scenarios:
      - display/advanced:graphics
    notes: >-
      Public readGraphicsData parity is provided by a shallow compatibility record stream; OpenFL's
      private parallel typed-buffer layout is not exposed by Flight.
  - id: display.GFX.appending-into-empty-buffer-aliases-all-backing
    section: Graphics > DrawCommandBuffer and DrawCommandReader
    behavior: >-
      Appending into an empty reference buffer aliases all backing arrays and marks both buffers
      copy-on-write; the first later write detaches every array. copy() uses this path. Nonempty
      append replays typed commands, but its switch omits OVERRIDE_BLEND_MODE, so that one record is
      silently dropped. Flight command copying does not expose or test this ownership/drop contract.
    source:
      - display/BlendMode.hx:ADD
      - display/Graphics.hx:copyFrom
      - display/Graphics.hx:drawPath
    scenarios:
      - display/advanced:graphics
    notes: >-
      copyFrom preserves the observable shallow command ownership contract, but the private
      copy-on-write backing-array alias transition is not representable through Flight.
  - id: display.GFX.copies-shallow-bitmaps-matrices-vectors-nested-gradient
    section: Graphics > DrawCommandBuffer and DrawCommandReader
    behavior: >-
      Copies are shallow for bitmaps, matrices, vectors, and nested gradient arrays stored as
      command arguments; mutation after copy remains observable through the same retained
      references.
    source:
      - display/Graphics.hx:readGraphicsData
    scenarios:
      - display/advanced:graphics
  - id: display.GFX.reader-views-tied-mutable-cursor-positions-rather
    section: Graphics > DrawCommandBuffer and DrawCommandReader
    behavior: >-
      Reader views are tied to mutable cursor positions rather than copied value objects; callers
      must read or skip() exactly once per type. reset() zeros positions but leaves prev unchanged,
      so a reset after reading has a previous-command advance edge case. No adapter equivalent
      exercises these ordering semantics.
    source:
      - display/Graphics.hx:drawGraphicsData
      - display/Graphics.hx:readGraphicsData
    scenarios:
      - display/advanced:graphics
    notes: >-
      The adapter reconstructs public graphics-data values from compatibility records and does not
      expose OpenFL's private cursor-coupled reader views.
  - id: display.GFX.flight-stream-does-not-preserve-all-only
    section: Graphics > DrawCommandBuffer and DrawCommandReader
    behavior: >-
      The Flight stream does not preserve all reference-only records: BEGIN_SHADER_FILL,
      command-level OVERRIDE_BLEND_MODE, OVERRIDE_MATRIX, and the full typed representations of
      quads/triangles and line paints cannot round-trip through the adapter reader.
    source:
      - display/BlendMode.hx:SHADER
      - display/Graphics.hx:beginShaderFill
      - display/Graphics.hx:drawQuads
      - display/Graphics.hx:drawTriangles
    scenarios:
      - display/advanced:graphics
    notes: >-
      A compatibility record stream preserves OpenFL readback behavior alongside Flight rendering;
      Flight's own render command stream still cannot round-trip every OpenFL-only record.
  - id: display.BMD.construction-normalizes-dimensions-forces-opaque-alpha-x
    section: BitmapData > Storage, pixels, and lifetime
    behavior: >-
      Construction normalizes dimensions, forces opaque alpha to 0xFF, and discards RGB when a
      transparent fill has zero alpha. Public pixels remain straight ARGB while Flight storage is
      converted to/from premultiplied RGBA.
    source:
      - display/BitmapData.hx:new
      - display/BitmapData.hx:transparent
      - display/NativeWindow.hx:x
      - display/NativeWindowInitOptions.hx:transparent
      - display/Stage3D.hx:x
      - display/Tile.hx:x
      - display/Tileset.hx:x
    scenarios:
      - display/bitmap-data:construct
  - id: display.BMD.set-pixel-preserves-destination-alpha-set-pixel
    section: BitmapData > Storage, pixels, and lifetime
    behavior: >-
      setPixel preserves destination alpha; setPixel32 respects supplied alpha unless the bitmap is
      opaque. Out-of-bounds reads return zero and writes are ignored.
    source:
      - display/BitmapData.hx:setPixel
      - display/BitmapData.hx:setPixel32
    scenarios:
      - display/bitmap-data:getSetPixel32
  - id: display.BMD.dispose-clears-readable-valid-state-dimensions-rectangle
    section: BitmapData > Storage, pixels, and lifetime
    behavior: >-
      dispose() clears readable/valid state, dimensions, rectangle, bitmap, image, and cached
      texture references. Later adapter operations consistently guard disposed storage.
    source:
      - display/BitmapData.hx:dispose
      - display/BitmapData.hx:image
      - display/BitmapData.hx:readable
    scenarios:
      - display/bitmap-data:dispose
  - id: display.BMD.lock-unlock-intentional-no-ops-open-fl
    section: BitmapData > Storage, pixels, and lifetime
    behavior: >-
      lock() and unlock() are intentional no-ops: OpenFL 9.5.2 only gives them batching behavior on
      AIR/Flash, not on this target.
    source:
      - display/BitmapData.hx:lock
      - display/BitmapData.hx:unlock
    scenarios:
      - display/bitmap-data:lockUnlock
    notes: "Target conditions: #if flash."
  - id: display.BMD.set-pixels-preflights-complete-byte-length-throws
    section: BitmapData > Storage, pixels, and lifetime
    behavior: >-
      setPixels preflights the complete byte length and throws error 2030 before writing when short.
      OpenFL passes a pointer at the current position without advancing the ByteArray; the adapter's
      read-and-restore path preserves that same final position.
    source:
      - display/BitmapData.hx:setPixels
    scenarios:
      - display/bitmap-data:pixelsBytes
  - id: display.BMD.compare-preserves-sentinel-ordering-opaque-absolute-rgb
    section: BitmapData > Storage, pixels, and lifetime
    behavior: >-
      compare preserves sentinel ordering (0, -1, -2, -3, -4) and opaque absolute RGB-difference
      pixels.
    source:
      - display/BitmapData.hx:compare
    scenarios:
      - display/bitmap-data:compare
  - id: display.BMD.alpha-only-difference-assigns-source-alpha-other
    section: BitmapData > Storage, pixels, and lifetime
    behavior: >-
      For an alpha-only difference, compare assigns sourceAlpha - otherAlpha directly to the
      eight-bit alpha channel, including unsigned wrap behavior when the subtraction is negative.
    source:
      - display/BitmapData.hx:compare
    scenarios:
      - display/advanced:bitmapData
  - id: display.BMD.copy-pixels-supports-basic-clipping-alpha-masks
    section: BitmapData > Region operations and drawing
    behavior: >-
      copyPixels snapshots self-sources before writing, clips source and destination, restricts
      alpha-masked writes to the alpha bitmap intersection, and applies mergeAlpha only to pixels
      inside that intersection.
    source:
      - display/BitmapData.hx:copyPixels
      - display/BitmapData.hx:merge
    scenarios:
      - display/advanced:bitmapData
  - id: display.BMD.drawing-another-bitmap-data-applies-matrix-resampling
    section: BitmapData > Region operations and drawing
    behavior: >-
      Drawing another BitmapData applies matrix resampling, optional color transform, clipping, and
      supported blend composition through Flight bitmap operations.
    source:
      - display/BitmapData.hx:colorTransform
      - display/GraphicsBitmapFill.hx:bitmapData
      - display/GraphicsBitmapFill.hx:matrix
      - display/GraphicsGradientFill.hx:matrix
      - display/GraphicsShaderFill.hx:matrix
      - display/Tileset.hx:bitmapData
    scenarios:
      - display/bitmap-data:drawBitmapData
  - id: display.BMD.drawing-display-object-bitmap-only-tree-flattener
    section: BitmapData > Region operations and drawing
    behavior: >-
      Drawing a DisplayObject has a bitmap-only tree flattener and a Lime-Cairo-specific Flight
      path, but the portable path cannot reproduce the reference's temporary visibility override,
      render update, inverse world/color/alpha composition, scroll clipping, and arbitrary subtree
      rasterization.
    source:
      - display/BitmapData.hx:scroll
      - display/DisplayObject.hx:alpha
    scenarios: []
    notes: "Blocked on Flight gap \"Portable display-object rasterization\". Target conditions: #if lime."
  - id: display.BMD.threshold-masks-packed-argb-before-applying-all
    section: BitmapData > Region operations and drawing
    behavior: >-
      threshold masks packed ARGB before applying all six comparison operators, supports copySource,
      clips the region, and reports the changed pixel count.
    source:
      - display/BitmapData.hx:threshold
    scenarios:
      - display/bitmap-data:threshold
  - id: display.BMD.invalid-threshold-operation-returns-zero-open-fl
    section: BitmapData > Region operations and drawing
    behavior: >-
      An invalid threshold operation returns zero in both OpenFL/Lime and the adapter rather than
      throwing the error described in the public documentation.
    source:
      - display/BitmapData.hx:threshold
    scenarios:
      - display/bitmap-data:threshold
    notes: "Target conditions: #if lime."
  - id: display.BMD.exact-self-source-overlap-out-range-threshold
    section: BitmapData > Region operations and drawing
    behavior: >-
      Exact self-source overlap snapshots the source before writes. Threshold clips out-of-range
      source/destination rectangles before comparison and preserves copySource behavior at the
      clipped edges.
    source:
      - display/BitmapData.hx:threshold
    scenarios:
      - display/advanced:bitmapData
  - id: display.BMD.get-color-bounds-rect-normalizes-alpha-color
    section: BitmapData > Region operations and drawing
    behavior: >-
      getColorBoundsRect forces alpha into mask/color for opaque bitmaps, then preserves the 9.5.2
      quirk that compares a masked pixel against the complete requested color rather than a masked
      color value.
    source:
      - display/BitmapData.hx:getColorBoundsRect
      - display/BitmapData.hx:getPixel
      - display/BitmapData.hx:getPixel32
      - display/BitmapData.hx:height
      - display/BitmapData.hx:rect
      - display/BitmapData.hx:width
      - display/GraphicsSolidFill.hx:alpha
      - display/GraphicsSolidFill.hx:color
      - display/NativeWindow.hx:bounds
      - display/Tile.hx:alpha
      - display/Tile.hx:rect
    scenarios:
      - display/advanced:bitmapData
    notes: >-
      The focused fixture captures observable OpenFL 9.5.2 behavior: its block-local normalized
      color does not escape, and comparison uses the full unmasked requested color.
  - id: display.BMD.noise-uses-open-fl-s-exact-one
    section: BitmapData > Procedural pixels and texture invalidation
    behavior: >-
      noise uses OpenFL's exact one-warm-up LCG and per-pixel, per-selected-channel sample order;
      grayscale shares one RGB sample and alpha defaults to 255.
    source:
      - display/BitmapData.hx:new
      - display/BitmapData.hx:noise
    scenarios:
      - display/advanced:bitmapData
  - id: display.BMD.perlin-noise-delegates-different-implementations-ignore-fractal
    section: BitmapData > Procedural pixels and texture invalidation
    behavior: >-
      perlinNoise uses the 9.5.2 PerlinNoise implementation with the supplied seed, octave count,
      channel mask, grayscale and stitch flags, fixed 0.5 persistence, and fixed 0.15 interpolation.
      fractalNoise and offsets are ignored exactly as in the source, and seeded pixel output is
      deterministic.
    source:
      - display/BitmapData.hx:noise
      - display/BitmapData.hx:perlinNoise
    scenarios:
      - display/advanced:bitmapData
  - id: display.BMD.get-texture-caches-current-context-3-d
    section: BitmapData > Procedural pixels and texture invalidation
    behavior: >-
      Reference getTexture caches for the current Context3D and reuploads only when image.version
      exceeds __textureVersion. The adapter binds its cached texture to the same mutable Flight
      Bitmap; every Flight mutation bumps the bitmap's version and the Flight GL realization cache
      reuploads on version change, preserving the lazy texture-invalidation handshake.
    source:
      - display/BitmapData.hx:image
    scenarios:
      - display/bitmap-data:textureAlias
  - id: display.BMD.texture-upload-may-first-flush-cairo-surface
    section: BitmapData > Procedural pixels and texture invalidation
    behavior: >-
      Reference texture upload may first flush a Cairo surface and create a premultiplied or
      power-of-two clone. Flight owns format conversion at its texture resolver instead; exact
      dimensions/format behavior for those build flags has not been captured.
    source:
      - display/BitmapData.hx:clone
      - display/BitmapData.hx:readable
    scenarios:
      - display/bitmap-data:textureAlias
    notes: >-
      Flight's texture resolver owns upload format conversion and backend flushing; readable-state
      and texture caching are covered, but OpenFL's private Cairo/POT upload branches are not
      externally selectable.
  - id: display.BMD.synchronous-base-64-bytes-file-decoding-cannot
    section: BitmapData > Procedural pixels and texture invalidation
    behavior: >-
      Synchronous fromBase64, fromBytes, and fromFile decoding cannot be implemented over Flight's
      Promise-only codec surface.
    source:
      - display/BitmapData.hx:fromBase64
      - display/BitmapData.hx:fromBytes
      - display/BitmapData.hx:fromFile
      - display/BitmapData.hx:image
      - display/BitmapData.hx:new
    scenarios: []
    notes: Blocked on Flight gap "Synchronous BitmapData image construction".
  - id: display.BMD.cairo-surface-conversion-open-fl-quad-scale
    section: BitmapData > Procedural pixels and texture invalidation
    behavior: >-
      Cairo surface conversion and OpenFL quad/scale9 Stage3D cache buffers have no matching public
      Flight types.
    source:
      - display/BitmapData.hx:new
      - display/Stage3D.hx:context3D
    scenarios: []
    notes: Blocked on Flight gap "BitmapData platform and Stage3D cache types".
  - id: display.BMD.full-open-fl-filter-composition-full-bit
    section: BitmapData > Procedural pixels and texture invalidation
    behavior: >-
      Full OpenFL filter composition, full 32-bit cross-channel palette-map summation, and JPEG XR
      encoding are not representable by the current Flight adapters.
    source:
      - display/BitmapData.hx:paletteMap
    scenarios: []
    notes: Blocked on Flight gap "Remaining BitmapData semantic adapters".
  - id: display.SB.defaults-enabled-true-track-menu-false-use
    section: SimpleButton
    behavior: >-
      Defaults are enabled = true, trackAsMenu = false, and useHandCursor = true; absent up/hit
      states become empty DisplayObject instances while over/down may remain null. Current state
      initially points to up state.
    source:
      - display/DisplayObject.hx:invalidate
      - display/MovieClip.hx:enabled
      - display/SimpleButton.hx:downState
      - display/SimpleButton.hx:enabled
      - display/SimpleButton.hx:new
      - display/SimpleButton.hx:overState
      - display/SimpleButton.hx:trackAsMenu
      - display/SimpleButton.hx:upState
      - display/SimpleButton.hx:useHandCursor
    scenarios:
      - display/simple-button:defaults
  - id: display.SB.only-current-visual-state-contributes-bounds-rendering
    section: SimpleButton
    behavior: >-
      Only the current visual state contributes bounds and rendering. State objects are render
      children rather than public display-list children; making one current detaches it from any
      ordinary parent, propagates stage state, and replaces the prior Flight visual.
    source:
      - display/SimpleButton.hx:new
    scenarios:
      - display/simple-button:transitions
  - id: display.SB.replacing-state-immediately-changes-current-state-only
    section: SimpleButton
    behavior: >-
      Replacing a state immediately changes the current state only when the current state was the
      old value. Current and detached hit-state stage and transform propagation are handled
      separately.
    source:
      - display/SimpleButton.hx:new
    scenarios:
      - display/simple-button:replacements
  - id: display.SB.state-transitions-match-internal-listener-order-enabled
    section: SimpleButton
    behavior: >-
      State transitions match the internal listener order: enabled mouse-down selects down;
      mouse-out clears ignore and selects up; mouse-over during a pressed button sets ignore;
      ordinary enabled over selects over; mouse-up clears ignore and chooses over only when still
      over, otherwise up.
    source:
      - display/SimpleButton.hx:enabled
    scenarios:
      - display/simple-button:transitions
  - id: display.SB.enabled-suppresses-internal-visual-cursor-transition-logic
    section: SimpleButton
    behavior: >-
      enabled suppresses the internal visual/cursor transition logic but does not disable event
      listeners; callers still need mouseEnabled = false to suppress interaction delivery, as in the
      reference.
    source:
      - display/SimpleButton.hx:enabled
    scenarios:
      - display/simple-button:disabled
      - display/simple-button:values
  - id: display.SB.hit-test-state-null-open-fl-falls
    section: SimpleButton
    behavior: >-
      When hitTestState is null, OpenFL falls back to the current visual for hit testing. Adapter
      __hitTest returns false immediately.
    source:
      - display/SimpleButton.hx:hitTestState
    scenarios:
      - display/advanced:simpleButton
    notes: >-
      OpenFL falls back to the current visual for interactive Stage routing, while direct
      hitTestPoint remains false; both paths are captured.
  - id: display.SB.detached-transformed-hit-test-state-cannot-evaluated
    section: SimpleButton
    behavior: >-
      A detached transformed hitTestState cannot be evaluated in the button's local render-parent
      space with current Flight hit-area semantics.
    source:
      - display/SimpleButton.hx:hitTestState
    scenarios: []
    notes: Blocked on Flight gap "Detached button hit-state transforms".
  - id: display.SB.button-hit-testing-also-gates-visibility-mask
    section: SimpleButton
    behavior: >-
      Reference button hit testing also gates visibility, mask status, the button's mask, and
      mouseEnabled, then rewrites a hit-state stack entry back to the button. Adapter hit testing
      inherits the generic missing mask/stack behavior.
    source:
      - display/SimpleButton.hx:enabled
    scenarios:
      - display/advanced:simpleButton
  - id: display.SB.direct-mutation-enabled-or-use-hand-cursor
    section: SimpleButton
    behavior: >-
      Direct mutation of enabled or useHandCursor cannot update the Flight cursor until pointer
      activity runs the adapter synchronizer.
    source:
      - display/SimpleButton.hx:enabled
      - display/SimpleButton.hx:useHandCursor
    scenarios: []
    notes: Blocked on Flight gap "Immediate cursor-property synchronization".
  - id: display.SB.track-menu-retained-but-no-menu-style
    section: SimpleButton
    behavior: trackAsMenu is retained but has no menu-style release interaction.
    source:
      - display/SimpleButton.hx:trackAsMenu
    scenarios: []
    notes: Blocked on Flight gap "SimpleButton menu tracking".
  - id: display.SB.sound-transform-defensively-copied-set-get-but
    section: SimpleButton
    behavior: soundTransform is defensively copied on set/get, but state transition sounds are not bound.
    source:
      - display/SimpleButton.hx:soundTransform
    scenarios: []
    notes: Blocked on Flight gap "SimpleButton sounds".
  - id: display.SB.simple-button-installs-flight-pointer-signals-while
    section: SimpleButton
    behavior: >-
      SimpleButton installs Flight pointer signals while Stage separately translates Lime pointer
      input into OpenFL events. Until a single authoritative route is established, transition timing
      and duplicate delivery need an end-to-end host fixture.
    source:
      - display/SimpleButton.hx:new
    scenarios:
      - events/advanced:mouseTransitions
    notes: >-
      Stage routing and button state transitions are covered, but host-specific duplicate
      suppression remains a Flight signal integration distinction. Target conditions: #if lime.
  - id: display.REN.deliberately-no-live-canvas-cairo-dom-context
    section: Renderer-owned side effects noted, not adopted
    behavior: >-
      The adapter deliberately has no live Canvas/Cairo/DOM/Context3D display walk; display
      properties, shapes, textures, labels, and child order are sent directly to Flight nodes.
    source:
      - display/CairoRenderer.hx:cairo
      - display/CanvasRenderer.hx:context
      - display/DOMElement.hx:new
