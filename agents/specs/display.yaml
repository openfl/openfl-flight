  - id: display.RUNTIME.avm1-preloader-default-preloader-and-fps-surface
    section: Runtime helpers > Public surface inventory
    behavior: >-
      AVM1Movie construction throws ArgumentError #2012 while hidden addCallback is inert and call
      returns null. Preloader attaches an optional display, publishes loader
      progress/completion/unload, honors COMPLETE prevention, and dispatches onComplete once.
      DefaultPreloader exposes sizing/color and init/update/loaded hooks; FPS initializes text/style
      and maintains a rolling one-second currentFPS sample. These public surfaces have no fixtures.
    source:
