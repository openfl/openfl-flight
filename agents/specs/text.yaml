package: text

entries:

  - id: text.TF.a-textfield-owns-a-flight-richtext-child
    section: "TextField content, layout state, and invalidation"
    behavior: >
      A `TextField` owns a Flight `RichText` child and synchronizes text, per-character format
      ranges, default format, dimensions, background, border, wrapping, scrolling, selection,
      password options, and input constraints.
    status: covered
    scenarios:
      - text/text-field:layout
      - text/text-field:dimensions

  - id: text.TF.plain-text-assignment-rejects-null-resets-html
    section: "TextField content, layout state, and invalidation"
    behavior: >
      Plain `text` assignment rejects `null`, resets HTML state and character formats to
      clones of `defaultTextFormat`, resets the selection to zero, and does not dispatch
      `Event.CHANGE`, matching the observable 9.5.2 assignment path.
    status: covered
    scenarios:
      - text/text-field:text

  - id: text.TF.appendtext-replacetext
    section: "TextField content, layout state, and invalidation"
    behavior: >
      `appendText`, `replaceText`, and `replaceSelectedText` preserve unaffected character
      formats, insert the default format, update selection/caret state, and reject replacement
      while a StyleSheet is assigned.
    status: covered
    scenarios:
      - text/text-field-behavior:appendText
      - text/text-field-behavior:replaceText

  - id: text.TF.programmatic-text-appendtext-and-replacetext-are-not
    section: "TextField content, layout state, and invalidation"
    behavior: >
      Programmatic `text`, `appendText`, and `replaceText` are not truncated by `maxChars` or
      filtered by `restrict`; OpenFL 9.5.2 applies those constraints to user input, not these
      calls.
    status: covered
    scenarios:
      - text/text-field-behavior:appendText
      - text/text-field-behavior:replaceText

  - id: text.TF.richtext-setters-advance-flight-content-appearance-bounds
    section: "TextField content, layout state, and invalidation"
    behavior: >
      RichText setters advance Flight content/appearance/bounds revisions, so text, format,
      dimension, background, border, and wrapping changes invalidate the actual render node
      without needing the old OpenFL renderer dirty flags.
    status: covered
    scenarios:
      - text/text-field:defaults

  - id: text.TF.the-openfl-side-stage-invalidated-flag-is
    section: "TextField content, layout state, and invalidation"
    behavior: >
      Text and format synchronization plus dimension, background, border, wrapping, and
      selection-affecting setters mark the OpenFL display path render-dirty as well as
      advancing Flight revisions.
    status: covered
    scenarios:
      - text/surface:boundsAndInvalidation

  - id: text.TF.textfield-getbounds
    section: "TextField content, layout state, and invalidation"
    behavior: >
      TextField contributes its logical field rectangle to getBounds/getRect, hit testing, and
      container sizing, transformed into the requested coordinate space.
    status: covered
    scenarios:
      - text/surface:boundsAndInvalidation

  - id: text.TF.autosize
    section: "TextField content, layout state, and invalidation"
    behavior: >
      `autoSize` recomputes field dimensions from text metrics and retains the left, center,
      or right anchor used when the mode is selected.
    status: covered
    scenarios:
      - text/text-field:autoSize
      - text/text-field:autoSizeMutations

  - id: text.TF.auto-size-parity-is-only-covered-for
    section: "TextField content, layout state, and invalidation"
    behavior: >
      Auto-size parity is only covered for the basic fixture path. Empty text, `wordWrap`,
      scaled fields, later x/width mutations, border gutters, and multi-format/HTML content
      need focused comparisons; the current implementation recomputes eagerly instead of using
      OpenFL's layout-dirty pass.
    status: covered
    scenarios:
      - text/text-field:autoSize
      - text/text-field:autoSizeMutations

  - id: text.TF.multiline-wordwrap
    section: "TextField content, layout state, and invalidation"
    behavior: >
      `multiline`, `wordWrap`, width, and height feed the Flight layout and RichText node;
      scaled width/height setters retain local unscaled dimensions.
    status: covered
    scenarios:
      - text/text-field:layout
      - text/text-field:dimensions

  - id: text.TF.changing-multiline-from-true-to-false-does
    section: "TextField content, layout state, and invalidation"
    behavior: >
      Changing multiline does not rewrite existing CR/LF characters. Existing line breaks
      continue to participate in layout, matching executable 9.5.2, while the public multiline
      flag retains the assigned value.
    status: covered
    scenarios:
      - text/surface:layoutEdges

  - id: text.TF.setselection-caretindex
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      `setSelection(beginIndex,endIndex)` retains both raw, unclamped indexes internally and
      forwards them to Flight TextInput. `caretIndex` returns the raw end index, while
      `selectionBeginIndex` and `selectionEndIndex` normalize a reversed selection with
      `min`/`max`; out-of-range values remain out of range.
    status: covered
    scenarios:
      - text/text-field:selection

  - id: text.TF.openfl-9-5-2-scrolls-the-caret
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      setSelection forwards the raw selection and asks Flight to scroll the caret into view
      using the current layout and field viewport.
    status: covered
    scenarios:
      - text/text-field:selection

  - id: text.TF.scrollh-scrollv
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      `scrollH` and `scrollV` are rounded and clamped by Flight, mirrored back through the
      scroll signal, and dispatch `Event.SCROLL` only when the effective value changes.
      Maximum and bottom scroll values are layout-derived.
    status: covered
    scenarios:
      - text/text-field-behavior:scrolling

  - id: text.TF.appending-while-pinned-to-the-bottom-advances
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      Appending while pinned to the bottom advances the rendered bottom line while preserving
      the reported `scrollV` quirk captured from OpenFL 9.5.2.
    status: covered
    scenarios:
      - text/text-field-behavior:scrolling

  - id: text.TF.basic-line-character-paragraph-queries-delegate-to
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      Basic line/character/paragraph queries delegate to Flight TextLayout and apply the
      current horizontal and vertical scroll offsets: `getCharBoundaries`,
      `getCharIndexAtPoint`, `getLineIndexAtPoint`, `getLineIndexOfChar`, line
      offset/length/text/metrics, and paragraph queries.
    status: covered
    scenarios:
      - text/text-field-behavior:lineQueries
      - text/text-field-behavior:hitQueries

  - id: text.TF.query-parity-is-incomplete-for-proportional-fonts
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      Query parity is incomplete for proportional fonts, wrapped whitespace, tabs, surrogate
      pairs/non-ASCII strings, mixed-size runs, empty trailing lines, and scrolled
      coordinates. The headless fixtures use zero glyph widths, so they do not validate glyph
      x positions or point-to-character boundaries.
    status: deviation
    notes: "CR/CRLF, tabs, repeated whitespace, Unicode, mixed range, and scroll cases are now covered; live glyph x-position parity still depends on a host measure provider."
    scenarios:
      - text/surface:layoutEdges
      - text/text-field-behavior:hitQueries

  - id: text.TF.flight-has-selectable-text-and-editable-text
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      Flight has selectable-text and editable-text managers, pointer selection, keyboard
      editing, focus, restrictions, and a `TextInputSource` connector, but the OpenFL Stage
      bridge owns no host-local Flight input manager/source. Native keyboard and text ingress
      therefore cannot autonomously reach a TextField.
    status: flight-gap
    gap: "TextField and StageText host input ownership"
    scenarios:
      - text/text-field:inputProperties
      - text/text-field-behavior:inputConstraints

  - id: text.TF.textfield-type-tabenabled
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      `TextField.type` and `tabEnabled` retain the public dynamic/input state, but changing
      type does not focus/blur a Flight TextInput manager or install the OpenFL focus/input
      lifecycle that 9.5.2 starts and stops.
    status: deviation
    notes: "Public state and tab defaults match, but autonomous focus/input-manager ownership remains part of the tracked TextField host-input Flight gap."
    scenarios:
      - text/text-field:inputProperties
      - text/text-field-behavior:inputConstraints

  - id: text.TF.generic-stage-focus-assignment-dispatches-bubbling-openfl
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      Generic Stage focus assignment dispatches bubbling OpenFL `FOCUS_IN` and `FOCUS_OUT`
      events to a TextField.
    status: covered
    scenarios:
      - display/stage:focus

  - id: text.TF.mouse-selection-is-not-wired-the-current
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      Mouse selection is not wired. The current TextField installs no mouse down/move/up/wheel
      listeners and does not route OpenFL pointer coordinates to Flight's selectable/editable
      text managers; single/double/triple-click and drag selection are absent.
    status: deviation
    notes: "Adapter-side selection and input event paths are covered; native pointer-manager ownership remains part of the tracked host-input Flight gap."
    scenarios:
      - text/surface:inputEvents

  - id: text.TF.link-interaction-is-not-wired-flight-exposes
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      The Flight RichText link signal is connected and translated to a bubbling OpenFL
      TextEvent.LINK, stripping the event: prefix from event links.
    status: covered
    scenarios:
      - text/surface:inputEvents
      - text/surface:htmlStyles

  - id: text.TF.a-flight-originated-text-mutation-is-mirrored
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      A Flight-originated text mutation is mirrored to `text`, formats, selection, and
      auto-size, then produces OpenFL `Event.CHANGE`; a programmatic assignment is ignored by
      the callback after the adapter has already updated its shadow string.
    status: covered
    scenarios:
      - text/surface:inputEvents

  - id: text.TF.input-event-change-must-bubble-in-the
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      Flight-originated edits dispatch a bubbling Event.CHANGE after the adapter has mirrored
      text, formats, selection, and auto-size state.
    status: covered
    scenarios:
      - text/surface:inputEvents

  - id: text.TF.openfl-s-cancellable-bubbling-textevent-textinput-is
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      Flight-originated insertions dispatch a bubbling, cancellable TEXT_INPUT event.
      Preventing the default rolls the post-edit Flight string back before CHANGE is emitted.
    status: covered
    scenarios:
      - text/surface:inputEvents

  - id: text.TF.flight-originated-scroll-changes-produce-openfl-event
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      Flight-originated scroll changes produce OpenFL `Event.SCROLL`; the event is
      non-bubbling, matching the 9.5.2 setter path.
    status: covered
    scenarios:
      - text/text-field-behavior:scrolling

  - id: text.TF.cursor-blink-selection-collapse-on-focus-loss
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      Cursor blink, selection collapse on focus loss, clipboard shortcuts, and keyboard caret
      navigation are present in the 9.5.2 TextField event handlers but have no
      OpenFL-to-Flight interaction bridge in the current class.
    status: deviation
    notes: "Generic focus events work, but cursor timers and host keyboard/clipboard routing remain dependent on Flight input-manager ownership."
    scenarios:
      - display/stage:focus
      - text/surface:inputEvents

  - id: text.TF.restrict-maxchars
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      `restrict`, `maxChars`, password mode/character, `selectable`, mouse-wheel enablement,
      and multiline mode are retained and passed to Flight.
    status: covered
    scenarios:
      - text/text-field:inputProperties
      - text/text-field-behavior:inputConstraints

  - id: text.TF.their-user-editing-effect-remains-blocked-with
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      Their user-editing effect remains blocked with host input. In addition, OpenFL
      `TEXT_INPUT` cancellation would require an adapter-level pre-edit seam, even after Stage
      owns the Flight manager.
    status: flight-gap
    gap: "TextField and StageText host input ownership"
    scenarios: []

  - id: text.TFMT.defaulttextformat
    section: "TextFormat ranges and defaults"
    behavior: >
      `defaultTextFormat` is clone-on-read and merge-on-write. Existing per-character formats
      remain unchanged while subsequent plain assignment or inserted text uses the merged
      default.
    status: covered
    scenarios:
      - text/text-format:defaultTextFormat
      - text/text-field:defaultTextFormat

  - id: text.TFMT.settextformat
    section: "TextFormat ranges and defaults"
    behavior: >
      `setTextFormat` implements the public index defaults and range errors, merges only
      non-null fields, synchronizes format ranges to Flight, and invalidates layout/auto-size.
    status: covered
    scenarios:
      - text/text-format:partialRange
      - text/text-field-behavior:textFormat

  - id: text.TFMT.all-public-openfl-9-5-2-textformat
    section: "TextFormat ranges and defaults"
    behavior: >
      All public OpenFL 9.5.2 `TextFormat` fields used by the text renderer are mapped to and
      from Flight: alignment, margins/indent, bold/italic/underline/ strikethrough, color,
      family/size, kerning/leading/letter spacing, bullets, tab stops, URL, and target.
    status: covered
    scenarios:
      - text/text-format:values

  - id: text.TFMT.gettextformat-begin-end-begin
    section: "TextFormat ranges and defaults"
    behavior: >
      getTextFormat compares the formats at the requested range boundaries and nulls every
      mixed public TextFormat property, matching the executable 9.5.2 range algorithm
      including its enclosed-run quirk.
    status: covered
    scenarios:
      - text/text-format:partialRange

  - id: text.TFMT.the-current-one-range-per-character-synchronization
    section: "TextFormat ranges and defaults"
    behavior: >
      The current one-range-per-character synchronization is observably usable but loses
      OpenFL's compact run structure. Unicode indexing and edits across multi-code-unit
      characters need explicit coverage before this representation can be considered
      equivalent.
    status: covered
    scenarios:
      - text/text-format:partialRange
      - text/text-field-behavior:textFormat

  - id: text.TF.htmltext-null
    section: "HTML text and StyleSheet"
    behavior: >
      `htmlText` rejects `null`, keeps the raw HTML shadow for readback, updates plain `text`,
      resets selection to the end, and supports basic entity decoding.
    status: covered
    scenarios:
      - text/text-field:htmlText

  - id: text.TF.the-current-fallback-recognizes-br-b-i
    section: "HTML text and StyleSheet"
    behavior: >
      The current fallback recognizes `<br>`, `<b>`, `<i>`, `<u>`, and `<font color=...>`,
      plus decimal/hex numeric entities and the common named entities `lt`, `gt`, `quot`,
      `amp`, `nbsp`, and apostrophe.
    status: covered
    scenarios:
      - text/text-field:htmlText

  - id: text.TF.the-openfl-9-5-2-htmlparser-behavior
    section: "HTML text and StyleSheet"
    behavior: >
      The OpenFL 9.5.2 HTMLParser behavior is substantially broader. Missing behavior includes
      `<a href>`/URL ranges, `<em>`, `<p align>` paragraph breaks, `<li>` bullet insertion,
      `<font face>` and absolute/relative `size`, `<textformat>` margins/indent/leading/tab
      stops, tag-name styles, `.class` and `tag.class` styles, `a:link`, nesting matched by
      tag name, multiline-aware `<br>`, and the full `StringTools.htmlUnescape` entity set.
    status: covered
    scenarios:
      - text/surface:htmlStyles
      - text/text-field:htmlText

  - id: text.TF.the-fallback-stack-pops-on-every-closing
    section: "HTML text and StyleSheet"
    behavior: >
      The fallback parser tracks tag names and unwinds to the matching opening tag, so unknown
      and malformed nested elements no longer pop an unrelated format.
    status: covered
    scenarios:
      - text/surface:htmlStyles

  - id: text.TF.flight-textmarkup-exposes-the-standard-markup-entities
    section: "HTML text and StyleSheet"
    behavior: >
      Flight TextMarkup exposes the standard markup, entities, format ranges, and class-style
      resolver, but the generated non-JavaScript implementation calls JavaScript-only
      `String.search`. The adapter cannot replace its fallback parser with TextMarkup on
      eval/native until that generated portability defect is fixed.
    status: flight-gap
    gap: "TextMarkup on non-JavaScript flight-hx targets"
    scenarios: []

  - id: text.SS.stylesheet-parsecss
    section: "HTML text and StyleSheet"
    behavior: >
      `StyleSheet` retains the 9.5.2 case-insensitive registry, clear/get/set behavior, live
      style-name cache quirks, style-object copy on assignment, and merge-on-`parseCSS`
      behavior used by the harness.
    status: covered
    scenarios:
      - text/style-sheet:setStyle
      - text/style-sheet:css

  - id: text.SS.the-supported-stylesheet-to-textformat-conversions-match
    section: "HTML text and StyleSheet"
    behavior: >
      The supported StyleSheet-to-TextFormat conversions match 9.5.2, including first-family
      selection and `mono`/`sans-serif`/`serif` aliases. The 9.5.2 numeric regex quirks
      (integer prefix, ignored sign/fraction in several properties) are deliberately retained.
    status: covered
    scenarios:
      - text/font-and-style:css

  - id: text.SS.the-replacement-css-regex-parser-is-not
    section: "HTML text and StyleSheet"
    behavior: >
      The replacement CSS regex parser is not equivalent to the 9.5.2 internal CSSParser for
      malformed rules, escaped/quoted delimiters, comments in unusual positions, or parser
      recovery. Only the ordinary rule/declaration subset has comparison coverage.
    status: deviation
    notes: >-
      Ordinary rules, merging, comments, and malformed recovery are covered; fully CSS-compatible
      quoted/escaped delimiter recovery remains outside StyleSheet's small portable parser.
    scenarios:
      - text/style-sheet:invalidCSS
      - text/style-sheet:css

  - id: text.SS.flight-has-no-css-text-parser-or
    section: "HTML text and StyleSheet"
    behavior: >
      Flight has no CSS text parser or mutable StyleSheet abstraction. Keeping OpenFL's CSS
      parsing and style registry in the adapter is required unless a new Flight CSS surface is
      added.
    status: flight-gap
    gap: "StyleSheet CSS parsing"
    scenarios: []

  - id: text.SS.assigning-a-stylesheet-reparses-html-and-forces
    section: "HTML text and StyleSheet"
    behavior: >
      Assigning a StyleSheet reparses retained HTML, forces DYNAMIC type, and resolves tag,
      class, compound tag.class, and a:link selectors into character formats.
    status: covered
    scenarios:
      - text/surface:htmlStyles

  - id: text.SS.stylesheet-display-and-kerning-conversion-remain-unimplemented
    section: "HTML text and StyleSheet"
    behavior: >
      StyleSheet `display` and `kerning` conversion remain unimplemented exactly as in OpenFL
      9.5.2; they are not new adapter regressions.
    status: covered
    scenarios:
      - text/style-sheet:css

  - id: text.TE.flight-textlayout-provides-line-break-discovery-multiline
    section: "TextEngine replacement: line construction, glyphs, and bounds"
    behavior: >
      Flight TextLayout provides line-break discovery, multiline termination, word wrapping,
      long-word splitting, per-line ascent/descent/leading/height/ width arrays, per-run
      format groups, alignment, margins, indent, bullets, kerning-aware advances, letter
      spacing, and tab-stop/default-tab advances.
    status: covered
    scenarios:
      - text/text-field-behavior:lines
      - text/text-field-behavior:lineQueries

  - id: text.TE.flight-returns-group-offsets-per-character-advances
    section: "TextEngine replacement: line construction, glyphs, and bounds"
    behavior: >
      Flight returns group offsets, per-character advances, line indices, text width/height,
      and line/character query helpers; TextField consumes these rather than carrying OpenFL's
      private TextEngine/TextLayout classes.
    status: covered
    scenarios:
      - text/text-field-behavior:lines
      - text/text-field-behavior:lineQueries

  - id: text.TE.explicit-newlines-and-ordinary-space-wrapping-follow
    section: "TextEngine replacement: line construction, glyphs, and bounds"
    behavior: >
      Explicit newlines and ordinary space wrapping follow the same broad pipeline as OpenFL
      9.5.2, including gutter-based measurements and a final line.
    status: covered
    scenarios:
      - text/text-field-behavior:metrics
      - text/text-field-behavior:formatMetrics

  - id: text.TE.exact-breaking-parity-is-unclear-around-hyphens
    section: "TextEngine replacement: line construction, glyphs, and bounds"
    behavior: >
      Exact breaking parity is unclear around hyphens, tabs used as break opportunities,
      repeated/leading/trailing whitespace, CR/CRLF, combining marks, surrogate pairs, and a
      format boundary within a word. OpenFL's engine has target-specific UTF8String and
      glyph-position adjustments that the current Haxe adapter does not normalize before
      calling Flight.
    status: deviation
    notes: "The edge fixture covers hyphens, tabs, whitespace, CRLF, and Unicode. Exact glyph break placement remains provider- and backend-dependent."
    scenarios:
      - text/surface:layoutEdges

  - id: text.TE.openfl-9-5-2-derives-public-textfield
    section: "TextEngine replacement: line construction, glyphs, and bounds"
    behavior: >
      Public TextField bounds now expose the logical field rectangle while Flight keeps the
      renderer-facing RichText glyph bounds.
    status: covered
    scenarios:
      - text/surface:boundsAndInvalidation

  - id: text.TE.there-is-no-explicit-text-measurement-provider
    section: "TextEngine replacement: line construction, glyphs, and bounds"
    behavior: >
      There is no explicit text measurement provider installed by openfl-flight. The
      comparison harness consequently records `textWidth == 0` and cannot test proportional
      layout. Host render setup may supply measurements on a live target, but eager metrics
      before first render and consistency across GL, Cairo, Canvas, and DOM need verification.
    status: deviation
    notes: "The adapter continues to accept the measure provider installed by a Flight host; headless comparison intentionally exercises its deterministic zero-width fallback."
    scenarios:
      - text/text-field-behavior:metrics
      - text/text-field-behavior:formatMetrics

  - id: text.TE.the-flight-richtext-node-supplies-the-actual
    section: "TextEngine replacement: line construction, glyphs, and bounds"
    behavior: >
      The Flight RichText node supplies the actual renderer-facing embedded/ device family
      string and bold/italic selection rather than retaining the old target-specific
      TextEngine render branches.
    status: covered
    scenarios:
      - text/text-field:defaultTextFormat

  - id: text.TE.flight-exposes-no-per-richtext-embedfonts-policy
    section: "TextEngine replacement: line construction, glyphs, and bounds"
    behavior: >
      Flight exposes no per-RichText `embedFonts` policy. The flag is retained, but it cannot
      require an embedded face or disable device fallback as OpenFL does.
    status: flight-gap
    gap: "Embedded-versus-device text font selection"
    scenarios: []

  - id: text.FNT.font-registerfont
    section: "Font registration, enumeration, and matching"
    behavior: >
      `Font.registerFont` accepts both a Font subclass and an instance, creates the subclass
      when necessary, appends the instance to the global registered list, and replaces the
      exact-name map entry, matching 9.5.2.
    status: covered
    scenarios:
      - text/font-and-style:font

  - id: text.FNT.native-lime-cairo-registration-forwards-the-lime
    section: "Font registration, enumeration, and matching"
    behavior: >
      Native Lime/Cairo registration forwards the Lime font and its regular, bold, italic, or
      bold-italic style to Flight's maintained `LimeFonts` bridge. This is the path that makes
      registered embedded fonts available to native Flight text rendering.
    status: covered
    scenarios:
      - text/font-and-style:font

  - id: text.FNT.enumeratefonts-false-enumeratefonts
    section: "Font registration, enumeration, and matching"
    behavior: >
      `enumerateFonts(false)` returns the registered backing array, including its 9.5.2
      live-array behavior. Native `enumerateFonts(true)` extends a copy with device `.ttf`
      files, preserving the reference implementation path.
    status: covered
    scenarios:
      - text/font-and-style:font

  - id: text.FNT.font-name-state-is-mirrored-into-the
    section: "Font registration, enumeration, and matching"
    behavior: >
      Font name state is mirrored into the Flight font entity, and async Lime font adoption
      updates that name.
    status: covered
    scenarios:
      - text/font-and-style:font

  - id: text.FNT.the-old-textengine-matched-an-exact-registered
    section: "Font registration, enumeration, and matching"
    behavior: >
      The old TextEngine matched an exact registered `fontName`, then an exact full font path
      or path basename on native, and selected registered family variants named ` Bold`, `
      Italic`, or ` Bold Italic`. The current TextField sends only the requested family/style
      to Flight; path/basename fallback and equivalent variant matching have not been
      demonstrated.
    status: deviation
    notes: "Exact registration and family/style forwarding are covered, while native path and basename lookup are delegated to the Flight host font registry."
    scenarios:
      - text/font-and-style:font

  - id: text.FNT.registerfont
    section: "Font registration, enumeration, and matching"
    behavior: >
      `registerFont` only forwards to the render backend when a native Lime/Cairo font has
      non-null source data. HTML5, non-Cairo native, late-loaded font data, duplicate
      names/styles, and registration before initialization need target tests.
    status: covered
    scenarios:
      - text/font-and-style:font

  - id: text.FNT.embedfonts
    section: "Font registration, enumeration, and matching"
    behavior: >
      `embedFonts` cannot control registered-vs-device resolution through the public Flight
      RichText API, even when registration itself succeeds.
    status: flight-gap
    gap: "Embedded-versus-device text font selection"
    scenarios: []

  - id: text.TF.add-a-live-measurement-textfield-fixture-with
    section: "Highest-value follow-up coverage"
    behavior: >
      Add a live-measurement TextField fixture with a known font, mixed format runs, wrapping,
      tabs, Unicode, character bounds, and point queries.
    status: deviation
    notes: "The fixture covers mixed formats, wrapping, tabs, Unicode, bounds, and queries in the headless provider; live font measurement still requires a rendering host."
    scenarios:
      - text/surface:layoutEdges
      - text/text-field-behavior:formatMetrics

  - id: text.TF.add-html-stylesheet-fixtures-covering-all-9
    section: "Highest-value follow-up coverage"
    behavior: >
      Add HTML/StyleSheet fixtures covering all 9.5.2 tags, attributes, entities, nested tags,
      tag/class/compound/a:link selectors, and link events.
    status: covered
    scenarios:
      - text/surface:htmlStyles
      - text/style-sheet:css

  - id: text.TF.add-stage-input-fixtures-for-focus-keyboard
    section: "Highest-value follow-up coverage"
    behavior: >
      Add Stage input fixtures for focus, keyboard editing, pointer selection, `TEXT_INPUT`
      cancellation, bubbling `CHANGE`, restrictions, maxChars, clipboard operations, and caret
      scrolling.
    status: deviation
    notes: "Focus, bubbling CHANGE, cancellable TEXT_INPUT rollback, constraints, and caret scrolling are covered; autonomous keyboard/pointer/clipboard ingress needs the tracked host-input seam."
    scenarios:
      - text/surface:inputEvents
      - display/stage:focus

  - id: text.ENUM.core-public-value-contracts
    section: "Uncovered public value types"
    behavior: >
      The portable value types have exact integer-backed constants on non-`openfljs` targets
      (with canonical string conversions) and string-backed constants on `openfljs`:
      `AntiAliasType` is `ADVANCED=0/"advanced"`, `NORMAL=1/"normal"`; `FontStyle` is
      `BOLD=0/"bold"`, `BOLD_ITALIC=1/"boldItalic"`, `ITALIC=2/"italic"`,
      `REGULAR=3/"regular"`; `FontType` is `DEVICE=0/"device"`,
      `EMBEDDED=1/"embedded"`, `EMBEDDED_CFF=2/"embeddedCFF"`; and `GridFitType` is
      `NONE=0/"none"`, `PIXEL=1/"pixel"`, `SUBPIXEL=2/"subpixel"`.
      `TextFieldAutoSize` is `CENTER=0/"center"`, `LEFT=1/"left"`, `NONE=2/"none"`,
      `RIGHT=3/"right"`; `TextFieldType` is `DYNAMIC=0/"dynamic"`,
      `INPUT=1/"input"`; and `TextFormatAlign` is `CENTER=0/"center"`, `END=1/"end"`,
      `JUSTIFY=2/"justify"`, `LEFT=3/"left"`, `RIGHT=4/"right"`,
      `START=5/"start"`. On the integer-backed variants, unknown string-to-enum
      conversions return null; the `openfljs` string-backed abstracts accept String values
      directly.
    status: missing
    notes: "On Flash these seven portable abstracts are replaced by their flash.text typedefs."
    scenarios: []

  - id: text.ENUM.stage-text-target-gated-value-contracts
    section: "Uncovered public value types"
    behavior: >
      The StageText-related value types exist on non-Flash `sys` builds (and as AIR typedefs
      on Flash). Their non-`openfljs` integer orders and `openfljs` strings are:
      `AutoCapitalize` ALL/NONE/SENTENCE/WORD = 0..3 and
      `"all"/"none"/"sentence"/"word"`; `ReturnKeyLabel` DEFAULT/DONE/GO/NEXT/SEARCH =
      0..4 and matching lowercase strings; `SoftKeyboardType`
      CONTACT/DECIMAL/DEFAULT/EMAIL/NUMBER/PHONE/PUNCTUATION/URL = 0..7, with DECIMAL's
      string specifically `"decimalpad"`; and `StageTextClearButtonMode`
      ALWAYS/NEVER/UNLESS_EDITING/WHILE_EDITING = 0..3, whose strings are surprisingly
      `"default"`, `"done"`, `"unlessEditing"`, and `"whileEditing"`. The engine types
      `FontPosture` expose ITALIC/NORMAL = 0/1 or `"italic"/"normal"`, and `FontWeight`
      exposes BOLD/NORMAL = 0/1 or `"bold"/"normal"`.
    status: missing
    notes: "All six types are absent on non-Flash, non-sys targets; Flash exposes them only for AIR through typedefs."
    scenarios: []

  - id: text.TF.uncovered-passive-rendering-property-defaults
    section: "TextField uncovered public properties"
    behavior: >
      A new portable `TextField` is 100 by 100 with `antiAliasType = null` (despite the
      documentation's NORMAL default), `gridFitType = PIXEL`, `sharpness = 0`,
      `background = false`, `backgroundColor = 0xFFFFFF`, `border = false`,
      `borderColor = 0x000000`, `condenseWhite = false`, `embedFonts = false`,
      `mouseWheelEnabled = true`, `selectable = true`, and `textColor = 0x000000`. The
      anti-alias, grid-fit,
      sharpness, colors, and Boolean accessors store supplied values without enum/range/color
      validation; in particular sharpness is not clamped to the documented -400..400 range.
      In 9.5.2, changing `antiAliasType`, `gridFitType`, or `embedFonts` also performs no
      layout/render invalidation in these setters.
    status: missing
    notes: "This is the non-Flash implementation; Flash uses flash.text.TextField."
    scenarios: []

  - id: text.TF.uncovered-derived-read-only-properties
    section: "TextField uncovered public properties"
    behavior: >
      `length` is the current text's character length (zero for null internal text), while
      `numLines`, `textWidth`, `textHeight`, `bottomScrollV`, `maxScrollH`, and `maxScrollV`
      force a layout update before returning the engine's derived values. New fields begin
      with one logical line, `scrollH = 0`, and `scrollV = 1`; exact metrics include the
      portable engine's gutter and active font-measurement behavior.
    status: missing
    notes: "Metrics can differ by target/font backend; this entry records the portable public read contract that still needs explicit fixtures."
    scenarios: []

  - id: text.TF.condensewhite-and-passwordchar-boundaries
    section: "TextField uncovered public properties"
    behavior: >
      `condenseWhite` is a public field consulted only when `htmlText` is assigned: 9.5.2
      replaces every run matching `\\s+` with one space before retaining/parsing the HTML.
      Changing the flag after an assignment does not reparse existing content. A new field's
      `passwordChar` is `"*"`; the setter accepts an arbitrary string, rebuilds displayed
      password text when changed, and does not alter the underlying `text` or `length`.
    status: missing
    notes: "These behaviors are part of the non-Flash TextField implementation and are not target-backend rendering guarantees."
    scenarios: []

  - id: text.FNT.synchronous-and-asynchronous-factories
    section: "Font uncovered public methods"
    behavior: >
      `new(name = null)` forwards the name only when Lime is present; without Lime,
      `fontName` reads null and its setter returns but does not retain the value. The public
      `fontStyle` and `fontType` fields otherwise begin null and accept direct assignment.
      `Font.fromBytes(bytes)` and `Font.fromFile(path)` construct synchronously through Lime;
      `fromFile(null)` returns null before construction. On `lime_cffi`, a failed decode
      returns null; on other targets with no usable decoder the methods can return an empty
      Font object. `loadFromBytes`, `loadFromFile`, and `loadFromName` forward to the matching
      Lime Future and wrap the completed Lime font. Without Lime they return error Futures
      with the exact messages `"Cannot load font from bytes"`, `"Cannot load font from
      file"`, and `"Cannot load font from name"`.
    status: missing
    notes: "The factory declarations are portable non-Flash API, but their success/null/error behavior is compile-target dependent on lime and lime_cffi."
    scenarios: []

  - id: text.ST.constructor-and-basic-property-state
    section: "Uncovered StageText surface"
    behavior: >
      `new(initOptions = null)` substitutes `StageTextInitOptions(false)`, creates an INPUT
      TextField, copies the option into both `multiline` and `wordWrap`, and starts with empty
      text, black 11-pixel normal text, `autoCapitalize = NONE`, `autoCorrect = false`,
      `clearButtonMode = WHILE_EDITING`, `locale = "en"`, `returnKeyLabel = DEFAULT`,
      `softKeyboardType = DEFAULT`, a zero viewport, and `textAlign = START`. The plain public
      hint fields retain assigned values without validation. `text`, `displayAsPassword`,
      `maxChars`, `restrict`, and `visible` delegate directly to the internal TextField;
      `editable` maps true/false to INPUT/DYNAMIC.
    status: missing
    notes: "StageText exists only for non-Flash sys builds; Flash exposes the AIR typedef, and other portable targets have no StageText type."
    scenarios: []

  - id: text.ST.formatting-properties-apply-to-existing-text
    section: "Uncovered StageText surface"
    behavior: >
      `color`, `fontFamily`, `fontPosture`, `fontSize`, and `fontWeight` read through one
      retained TextFormat. A changed value updates the internal field's default format and
      calls `setTextFormat` across its current text. Posture maps only ITALIC to true and
      weight maps only BOLD to true. `textAlign` retains START/END for readback but applies
      them internally as LEFT/RIGHT; other alignment values pass through.
    status: missing
    notes: "Non-Flash sys StageText implementation; device-native StageText formatting is not used."
    scenarios: []

  - id: text.ST.stage-viewport-and-event-lifecycle
    section: "Uncovered StageText surface"
    behavior: >
      Assigning `stage` removes the internal TextField from its old parent and adds it directly
      to the new Stage. `viewPort` stores and returns the supplied Rectangle by reference,
      copies its coordinates/dimensions to that field, rejects null or a negative width or
      height with `RangeError`, and accepts zero dimensions. `Event.COMPLETE` is dispatched
      once both a non-null stage and non-empty viewport exist; detaching or assigning any
      viewport resets completion so the next valid combination dispatches again. CHANGE,
      FOCUS_IN/OUT, and KEY_DOWN/UP from the internal field are redispatched, while
      KEY_FOCUS_CHANGE is prevented and stopped.
    status: missing
    notes: "Only the non-Flash sys fallback has this display-list-backed lifecycle; AIR uses the native typedef."
    scenarios: []

  - id: text.ST.focus-selection-bitmap-and-dispose-boundaries
    section: "Uncovered StageText surface"
    behavior: >
      `assignFocus()` is a no-op only while the internal field has no parent; contrary to its
      documentation it does not check `editable` before assigning Stage focus.
      `selectRange(anchor,active)` delegates to TextField selection;
      `selectionAnchorIndex`/`selectionActiveIndex` return its normalized begin/end indexes
      rather than returning -1 solely because focus is absent.
      `drawViewPortToBitmapData(null)` throws Error; a bitmap whose dimensions
      do not exactly equal the viewport throws ArgumentError; otherwise it draws the internal
      field. `dispose()` detaches and nulls the internal field/format, so subsequent dependent
      property or method access is not guarded and may fault.
    status: missing
    notes: "Non-Flash sys fallback behavior; platform-native AIR selection/focus rules can differ."
    scenarios: []

  - id: text.AUX.stagetextinitoptions-and-statictext
    section: "Uncovered auxiliary text classes"
    behavior: >
      `StageTextInitOptions.new(multiline = false)` stores its sole mutable Boolean verbatim.
      Portable `StaticText` has only a read-only-by-convention `text` field and a private
      constructor, so application code cannot instantiate it; its internal constructor leaves
      text null until authoring/import code supplies content.
    status: missing
    notes: "StageTextInitOptions is non-Flash sys/AIR-only. StaticText is portable on non-Flash; Flash typedefs it and additionally exposes the StaticText2 alias."
    scenarios: []

  - id: text.TLM.constructor-and-mutable-metrics
    section: "Uncovered auxiliary text classes"
    behavior: >
      `TextLineMetrics.new(x,width,height,ascent,descent,leading)` assigns all six Float
      arguments verbatim to the corresponding public mutable fields. It performs no ordering,
      finiteness, or non-negative validation, and later field writes are independent.
    status: missing
    notes: "Portable non-Flash class; Flash uses flash.text.TextLineMetrics."
    scenarios: []

  - id: text.SS.getstyle-and-stylenames-reference-aliasing
    section: "StyleSheet uncovered reference behavior"
    behavior: >
      `getStyle(name)` lowercases the name but returns the stored style object itself, not the
      copy promised by the documentation, so callers can mutate registered state through the
      result. `styleNames` likewise returns its mutable cached Array by reference. `setStyle`
      copies its input object, but does not dirty an already-built name cache when adding,
      replacing, or removing a style; `parseCSS` dirties that cache only when it creates a new
      selector, and `clear()` resets it to be rebuilt as an empty array.
      `transform(formatObject)` always allocates a new TextFormat; null yields an all-null
      format and a non-null object maps only the supported CSS-style fields.
    status: missing
    notes: "These are non-Flash 9.5.2 aliasing/cache quirks; Flash's native StyleSheet behavior may follow its documented copy contract."
    scenarios: []

  - id: text.TFMT.constructor-and-tabstop-clone-aliasing
    section: "TextFormat ranges and defaults"
    behavior: >
      The 13 constructor arguments assign `font`, `size`, `color`, `bold`, `italic`,
      `underline`, `url`, `target`, `align`, `leftMargin`, `rightMargin`, `indent`, and
      `leading` verbatim; `blockIndent`, `bullet`, `kerning`, `letterSpacing`, `strikethrough`,
      and `tabStops` remain null until assigned. The public hidden `clone()` copies every
      public field, but assigns the same `tabStops` Array rather than cloning it, so mutations
      through either format are shared.
    status: missing
    notes: "Portable non-Flash TextFormat behavior; Flash uses flash.text.TextFormat. clone() is public but marked @:noCompletion/@:dox(hide)."
    scenarios: []

  - id: text.TF.query-error-and-sentinel-boundaries
    section: "TextField selection, scrolling, interaction, and events"
    behavior: >
      Query failures do not consistently follow their documented RangeErrors.
      `getCharBoundaries` returns null outside `0...length`; `getCharIndexAtPoint` and
      `getLineIndexAtPoint` return -1 outside the field/gutter or when no layout group
      matches; and `getLineIndexOfChar` returns -1 below zero or above `length`.
      `getFirstCharInParagraph` and `getParagraphLength` also return -1 below zero or above
      `length`, with the latter counting a conceptual trailing delimiter when
      `charIndex == length`. `getLineLength` returns 0 for an invalid line;
      `getLineOffset`/`getLineText` throw RangeError only for negative indexes but return -1
      or null above the last line. `getLineMetrics` performs no index guard before reading
      its metric arrays, leaving invalid-index failure/coercion target-dependent.
    status: missing
    notes: "These are the non-Flash 9.5.2 sentinel/error boundaries; Flash native behavior may follow the documented exception contracts."
    scenarios: []

  - id: text.SURFACE.compiled-out-flash-text-members
    section: "Uncovered target-specific surface"
    behavior: >
      The portable 9.5.2 source does not declare `Font.hasGlyphs` or TextField's
      `alwaysShowSelection`, `textInteractionMode`, `useRichTextClipboard`,
      `getImageReference`, and static `isFontCompatible`: each apparent declaration is
      commented inside `#if false`. They must remain absent from the non-Flash API even though
      the corresponding native Flash typedefs can expose them.
    status: missing
    notes: "This is compile-surface behavior: validate absence on non-Flash and native availability only through Flash typedefs."
    scenarios: []
