package: remaining
entries:
  - id: remaining.ERR.error-extends-haxe-exception-haxe-later-constructor
    section: openfl.errors
    behavior: >-
      Error extends haxe.Exception on Haxe 4.1 and later. Its constructor accepts message = "" and
      id = 0, supplies the message to the superclass, stores the read-only errorID, and sets the
      mutable name to "Error". On older Haxe it is a standalone class with the same three public
      values.
    source:
      - errors/ArgumentError.hx:new
      - errors/EOFError.hx:new
      - errors/Error.hx:errorID
      - errors/Error.hx:message
      - errors/Error.hx:name
      - errors/Error.hx:new
      - errors/IOError.hx:new
      - errors/IllegalOperationError.hx:new
      - errors/PermissionError.hx:new
      - errors/RangeError.hx:new
      - errors/SecurityError.hx:new
      - errors/TypeError.hx:new
    scenarios:
      - errors/error:populated
      - errors/error:empty
  - id: remaining.ERR.error-string-returns-message-whenever-it-non
    section: openfl.errors
    behavior: >-
      Error.toString() returns message whenever it is non-null, including when it is empty, and
      returns "Error" only for a null message. getStackTrace() returns
      CallStack.toString(CallStack.exceptionStack()); it does not preserve a construction-time stack
      snapshot.
    source:
      - errors/ArgumentError.hx:new
      - errors/EOFError.hx:new
      - errors/Error.hx:getStackTrace
      - errors/Error.hx:message
      - errors/Error.hx:new
      - errors/IOError.hx:new
      - errors/IllegalOperationError.hx:new
      - errors/PermissionError.hx:new
      - errors/RangeError.hx:new
      - errors/SecurityError.hx:new
      - errors/TypeError.hx:new
    scenarios:
      - errors/error:stackTrace
      - errors/error:populated
      - errors/error:empty
  - id: remaining.ERR.argument-error-io-error-illegal-operation-error
    section: openfl.errors
    behavior: >-
      ArgumentError, IOError, IllegalOperationError, RangeError, SecurityError, and TypeError accept
      message = "", force errorID = 0, and replace name with their class name.
    source:
      - errors/ArgumentError.hx:new
      - errors/EOFError.hx:new
      - errors/Error.hx:errorID
      - errors/Error.hx:message
      - errors/Error.hx:name
      - errors/IOError.hx:new
      - errors/IllegalOperationError.hx:new
      - errors/PermissionError.hx:new
      - errors/RangeError.hx:new
      - errors/SecurityError.hx:new
      - errors/TypeError.hx:new
    scenarios:
      - errors/subclasses:argument
      - errors/subclasses:io
      - errors/subclasses:illegalOperation
      - errors/subclasses:range
      - errors/subclasses:security
      - errors/subclasses:type
  - id: remaining.ERR.permission-error-preserves-arguments-sets-name-permission
    section: openfl.errors
    behavior: >-
      PermissionError(message = "", id = 0) preserves both arguments and sets name =
      "PermissionError".
    source:
      - errors/ArgumentError.hx:new
      - errors/EOFError.hx:new
      - errors/Error.hx:message
      - errors/Error.hx:name
      - errors/IOError.hx:new
      - errors/IllegalOperationError.hx:new
      - errors/PermissionError.hx:new
      - errors/RangeError.hx:new
      - errors/SecurityError.hx:new
      - errors/TypeError.hx:new
    scenarios:
      - errors/subclasses:permission
  - id: remaining.ERR.eof-error-ignores-supplied-arguments-forces-message
    section: openfl.errors
    behavior: >-
      EOFError(message = null, id = 0) ignores both supplied arguments, forces message "End of file
      was encountered", name = "EOFError", and errorID = 2030.
    source:
      - errors/ArgumentError.hx:new
      - errors/EOFError.hx:new
      - errors/Error.hx:errorID
      - errors/Error.hx:message
      - errors/Error.hx:name
      - errors/IOError.hx:new
      - errors/IllegalOperationError.hx:new
      - errors/PermissionError.hx:new
      - errors/RangeError.hx:new
      - errors/SecurityError.hx:new
      - errors/TypeError.hx:new
    scenarios:
      - errors/subclasses:eof
      - errors/subclasses:eofIsIOError
  - id: remaining.ACC.supported-performs-lazy-one-time-discovery-selects
    section: openfl.sensors > Accelerometer
    behavior: >-
      isSupported performs lazy one-time discovery. The reference selects the first Lime
      accelerometer and installs one static update callback; the adapter asks Flight once, creates
      and attaches one Flight sensor set, and connects its accelerometer signal. Subsequent reads
      reuse the cached result.
    source:
      - sensors/Accelerometer.hx:isSupported
    scenarios:
      - sensors/core:accelerometer
    notes: "Target conditions: #if lime."
  - id: remaining.ACC.can-discover-any-lime-accelerometer-currently-supplies
    section: openfl.sensors > Accelerometer
    behavior: >-
      Any Lime accelerometer can be discovered and its first sensor supplies the shared readings;
      non-Lime builds use the available Flight sensor host.
    source:
      - sensors/Accelerometer.hx:new
    scenarios:
      - sensors/core:accelerometer
    notes: "Target conditions: #if lime."
  - id: remaining.ACC.shared-readings-begin-x-y-z-each
    section: openfl.sensors > Accelerometer
    behavior: >-
      Shared readings begin at x = 0, y = 1, z = 0. Each native/Flight reading replaces all three. A
      new instance initializes support, starts with muted = false, and requests the default 34 ms
      interval.
    source:
      - sensors/Accelerometer.hx:muted
      - sensors/Accelerometer.hx:new
    scenarios:
      - sensors/core:accelerometer
  - id: remaining.ACC.overridden-add-event-listener-first-registers-listener
    section: openfl.sensors > Accelerometer
    behavior: >-
      Overridden addEventListener first registers the listener and then calls the update routine for
      every event type, not only AccelerometerEvent.UPDATE. That routine immediately dispatches an
      UPDATE event containing Timer.stamp() in seconds and the current shared axes, even if hardware
      is unsupported.
    source:
      - sensors/Accelerometer.hx:addEventListener
    scenarios:
      - sensors/core:accelerometer
  - id: remaining.ACC.set-requested-update-interval-stores-supplied-integer
    section: openfl.sensors > Accelerometer
    behavior: >-
      setRequestedUpdateInterval(interval) stores the supplied integer, throws ArgumentError for a
      negative value, converts zero to 34, stops the old timer, and, when supported and not muted,
      creates a repeating timer that dispatches current readings. Changing muted restarts that
      timer.
    source:
      - errors/ArgumentError.hx:new
      - sensors/Accelerometer.hx:muted
      - sensors/Accelerometer.hx:setRequestedUpdateInterval
      - sensors/Geolocation.hx:setRequestedUpdateInterval
    scenarios:
      - sensors/core:accelerometer
  - id: remaining.DR.sys-implementation-reports-supported-false-exposes-read
    section: openfl.sensors > DeviceRotation
    behavior: >-
      The 9.5.2 sys implementation reports isSupported = false, exposes read-only muted = false,
      throws IllegalOperationError("Not supported") from construction, and makes
      setRequestedUpdateInterval(Float) a no-op. The adapter's reachable native behavior remains the
      same because its only sensor-host fallback reports orientation unsupported.
    source:
      - errors/IllegalOperationError.hx:new
      - sensors/DeviceRotation.hx:isSupported
      - sensors/DeviceRotation.hx:muted
      - sensors/DeviceRotation.hx:new
      - sensors/DeviceRotation.hx:setRequestedUpdateInterval
    scenarios:
      - sensors/core:deviceRotation
    notes: "Target conditions: #if sys."
  - id: remaining.DR.plain-class-extends-event-dispatcher-contains-otherwise
    section: openfl.sensors > DeviceRotation
    behavior: >-
      DeviceRotation is a plain class rather than an EventDispatcher and contains no native
      orientation-sensor path.
    source:
      - sensors/DeviceRotation.hx:new
    scenarios:
      - sensors/core:deviceRotation
  - id: remaining.DR.sensor-cadence-mobile-location-policy-even-that
    section: openfl.sensors > DeviceRotation
    behavior: >-
      Sensor cadence and mobile location policy: even on that extended path
      setRequestedUpdateInterval remains a no-op because Flight has no update-frequency control on
      attachSensors.
    source:
      - sensors/DeviceRotation.hx:setRequestedUpdateInterval
    scenarios: []
    notes: >-
      Blocked on Flight gap "Sensor cadence and mobile location policy". Target conditions: #if
      mobile.
  - id: remaining.GEO.accuracy-constants-exactly-best-best-navigation-hundred
    section: openfl.sensors > Geolocation
    behavior: >-
      The accuracy constants are exactly "best", "bestForNavigation", "hundredMeters", "kilometer",
      "nearestTenMeters", and "threeKilometers". Initial state is best accuracy, locationAlways =
      false, pausesLocationUpdatesAutomatically = true, muted = false, and permissionStatus =
      UNKNOWN.
    source:
      - permissions/PermissionStatus.hx:DENIED
      - permissions/PermissionStatus.hx:GRANTED
      - permissions/PermissionStatus.hx:ONLY_WHEN_IN_USE
      - permissions/PermissionStatus.hx:UNKNOWN
      - sensors/Geolocation.hx:LOCATION_ACCURACY_BEST
      - sensors/Geolocation.hx:LOCATION_ACCURACY_BEST_FOR_NAVIGATION
      - sensors/Geolocation.hx:LOCATION_ACCURACY_HUNDRED_METERS
      - sensors/Geolocation.hx:LOCATION_ACCURACY_KILOMETER
      - sensors/Geolocation.hx:LOCATION_ACCURACY_NEAREST_TEN_METERS
      - sensors/Geolocation.hx:LOCATION_ACCURACY_THREE_KILOMETERS
      - sensors/Geolocation.hx:desiredAccuracy
      - sensors/Geolocation.hx:muted
      - sensors/Geolocation.hx:pausesLocationUpdatesAutomatically
      - sensors/Geolocation.hx:permissionStatus
    scenarios:
      - sensors/core:geolocation
  - id: remaining.GEO.sys-class-not-event-dispatcher-always-reports
    section: openfl.sensors > Geolocation
    behavior: >-
      The sys class is not an EventDispatcher, always reports unsupported, always throws
      IllegalOperationError("Not supported") on construction, and leaves permission and interval
      requests as no-ops.
    source:
      - errors/IllegalOperationError.hx:new
      - sensors/Geolocation.hx:isSupported
      - sensors/Geolocation.hx:new
    scenarios:
      - sensors/core:geolocation
    notes: "Target conditions: #if sys."
  - id: remaining.GEO.flight-positions-dispatch-geolocation-event-update-latitude
    section: openfl.sensors > Geolocation
    behavior: The 9.5.2 sys stub does not watch Flight positions or dispatch geolocation update events.
    source:
      - sensors/Geolocation.hx:new
    scenarios:
      - sensors/core:geolocation
    notes: "Target conditions: #if sys."
  - id: remaining.GEO.request-permission-maps-flight-reasons-granted-denied
    section: openfl.sensors > Geolocation
    behavior: >-
      requestPermission() is a no-op and does not map Flight permission reasons, dispatch permission
      events, change muted, or start a watch.
    source:
      - sensors/Geolocation.hx:muted
      - sensors/Geolocation.hx:requestPermission
    scenarios:
      - sensors/core:geolocation
  - id: remaining.GEO.sensor-cadence-mobile-location-policy-requested-positive
    section: openfl.sensors > Geolocation
    behavior: >-
      Sensor cadence and mobile location policy: requested positive update intervals become Flight
      maximumAgeMs cache tolerances, not event cadence; locationAlways and
      pausesLocationUpdatesAutomatically are ignored, and Flight cannot query or subscribe to OS
      permission state or distinguish always from while-in-use grants.
    source:
      - sensors/Geolocation.hx:locationAlwaysUsePermission
      - sensors/Geolocation.hx:pausesLocationUpdatesAutomatically
    scenarios: []
    notes: >-
      Blocked on Flight gap "Sensor cadence and mobile location policy". Target conditions: #if
      mobile.
  - id: remaining.PRN.print-job-options-mutable-record-print-bitmap
    section: openfl.printing
    behavior: >-
      PrintJobOptions is a mutable record with printAsBitmap, initialized from a constructor
      argument that defaults to false.
    source:
      - printing/PrintJob.hx:new
      - printing/PrintJobOptions.hx:new
      - printing/PrintJobOptions.hx:printAsBitmap
      - printing/PrintJobOrientation.hx:LANDSCAPE
    scenarios:
      - printing/print-job:options
  - id: remaining.PRN.print-job-orientation-landscape-landscape-portrait-portrait
    section: openfl.printing
    behavior: >-
      PrintJobOrientation has LANDSCAPE = "landscape" and PORTRAIT = "portrait"; ordinary targets
      represent them as nullable integers 0 and 1 with string conversions, while openfljs stores the
      strings directly.
    source:
      - printing/PrintJob.hx:orientation
      - printing/PrintJobOptions.hx:new
      - printing/PrintJobOrientation.hx:LANDSCAPE
      - printing/PrintJobOrientation.hx:PORTRAIT
    scenarios:
      - printing/print-job:orientations
    notes: "Target conditions: #if openfljs."
  - id: remaining.PRN.print-job-exposes-mutable-orientation-read-only
    section: openfl.printing
    behavior: >-
      PrintJob exposes mutable orientation and read-only pageHeight, pageWidth, paperHeight, and
      paperWidth. Construction does not initialize them explicitly, so the orientation is null and
      dimensions are zero.
    source:
      - printing/PrintJob.hx:new
      - printing/PrintJob.hx:orientation
      - printing/PrintJob.hx:pageHeight
      - printing/PrintJob.hx:pageWidth
      - printing/PrintJob.hx:paperHeight
      - printing/PrintJob.hx:paperWidth
      - printing/PrintJobOptions.hx:new
      - printing/PrintJobOrientation.hx:LANDSCAPE
    scenarios:
      - printing/print-job:defaults
  - id: remaining.PRN.print-job-supported-true-html-5-false
    section: openfl.printing
    behavior: PrintJob.isSupported is true for HTML5 and false elsewhere.
    source:
      - printing/PrintJob.hx:isSupported
      - printing/PrintJobOptions.hx:new
      - printing/PrintJobOrientation.hx:LANDSCAPE
    scenarios:
      - printing/print-job:isSupported
    notes: "Target conditions: #if html5."
  - id: remaining.PRN.html-5-start-marks-job-active-clears
    section: openfl.printing
    behavior: >-
      On reference HTML5, start() marks the job active, clears its page bitmap list, and returns
      true. addPage() then rasterizes either the supplied rectangle or sprite.getBounds(sprite) into
      a transparent, zero-filled bitmap using ceiling dimensions; options and frame number are
      ignored.
    source:
      - printing/PrintJob.hx:addPage
      - printing/PrintJob.hx:start
      - printing/PrintJobOptions.hx:new
      - printing/PrintJobOrientation.hx:LANDSCAPE
    scenarios:
      - printing/print-job:lifecycle
    notes: "Target conditions: #if html5."
  - id: remaining.PRN.send-inert-before-successful-start-afterwards-html
    section: openfl.printing
    behavior: >-
      send() is inert before a successful start. Afterwards on HTML5 it opens a 500 by 500 browser
      window, inserts print-only page breaks, appends PNG images for canvas-backed pages, and
      focuses/prints after 500 ms. It does not reset the started state.
    source:
      - printing/PrintJob.hx:send
      - printing/PrintJob.hx:start
      - printing/PrintJobOptions.hx:new
      - printing/PrintJobOrientation.hx:LANDSCAPE
    scenarios:
      - printing/print-job:lifecycle
    notes: "Target conditions: #if html5."
  - id: remaining.EI.available-true-only-html-5-mutable-marshall
    section: openfl.external.ExternalInterface
    behavior: >-
      available is true only for HTML5, and mutable marshallExceptions starts false. The adapter
      preserves these flags.
    source:
      - external/ExternalInterface.hx:available
      - external/ExternalInterface.hx:marshallExceptions
    scenarios:
      - external/external-interface:available
    notes: "Target conditions: #if html5."
  - id: remaining.EI.html-5-object-id-returns-active-lime
    section: openfl.external.ExternalInterface
    behavior: >-
      On HTML5, objectID returns the active Lime application window element's ID when application,
      window, and element all exist; otherwise it is null.
    source:
      - external/ExternalInterface.hx:objectID
    scenarios:
      - external/external-interface:objectID
    notes: "Target conditions: #if html5, #if lime."
  - id: remaining.EI.html-5-add-callback-assigns-closure-window
    section: openfl.external.ExternalInterface
    behavior: >-
      On HTML5, addCallback(name, closure) assigns the closure to the window element property named
      by name when that element exists.
    source:
      - external/ExternalInterface.hx:addCallback
    scenarios:
      - external/external-interface:callbackContract
    notes: "Target conditions: #if html5."
  - id: remaining.EI.call-returns-null-outside-html-5-html
    section: openfl.external.ExternalInterface
    behavior: >-
      call(functionName, p1 ... p5) returns null outside HTML5. On HTML5 it evaluates the requested
      JavaScript expression; unless the name matches a parenthesized expression, it rewrites the
      expression to bind the resolved function to its owner object. Evaluation errors and
      non-functions return null.
    source:
      - external/ExternalInterface.hx:call
    scenarios:
      - external/external-interface:callWhenUnavailable
    notes: "Target conditions: #if html5."
  - id: remaining.EI.invocation-stops-first-null-optional-argument-null
    section: openfl.external.ExternalInterface
    behavior: >-
      Invocation stops at the first null optional argument: null cannot be passed and followed by
      later arguments. It returns the JavaScript result, and invocation exceptions propagate
      regardless of marshallExceptions.
    source:
      - external/ExternalInterface.hx:marshallExceptions
    scenarios:
      - external/external-interface:invocationContract
  - id: remaining.FM.enum-contains-append-append-read-read-update
    section: openfl.filesystem > FileMode
    behavior: >-
      This enum contains APPEND = "append", READ = "read", UPDATE = "update", and WRITE = "write".
      Ordinary targets use nullable integer values 0 through 3 with string conversion; openfljs uses
      strings directly.
    source:
      - filesystem/FileStream.hx:new
    scenarios:
      - filesystem/file:pathContracts
    notes: "Target conditions: #if openfljs."
  - id: remaining.FL.file-extends-file-null-constructor-path-leaves
    section: "openfl.filesystem > File: identity, paths, and metadata"
    behavior: >-
      File extends FileReference. A null constructor path leaves an empty reference; a non-null path
      is assigned through nativePath. The inherited creationDate, modificationDate, name, size,
      type, and extension are refreshed lazily from filesystem metadata, while icon is always null.
    source:
      - filesystem/File.hx:icon
      - filesystem/File.hx:nativePath
      - filesystem/File.hx:new
    scenarios:
      - filesystem/file:pathContracts
      - filesystem/file:source
  - id: remaining.FL.inherited-download-load-save-upload-retain-file
    section: "openfl.filesystem > File: identity, paths, and metadata"
    behavior: >-
      Inherited download, load, save, and upload retain the FileReference transport behavior. Flight
      cannot abort an already-issued request, and the compatibility layer can only suppress its
      stale completion. That limitation is FileReference network transfers and cancellation. File
      replaces inherited browse and cancel as specified below.
    source:
      - filesystem/File.hx:browse
      - filesystem/File.hx:cancel
    scenarios: []
    notes: Blocked on Flight gap "FileReference network transfers and cancellation".
  - id: remaining.FL.line-ending-crlf-windows-lf-elsewhere-separator
    section: "openfl.filesystem > File: identity, paths, and metadata"
    behavior: >-
      lineEnding is CRLF on Windows and LF elsewhere; separator is backslash on Windows and slash
      elsewhere. workingDirectory is Sys.getCwd() with trailing separators removed.
    source:
      - filesystem/File.hx:lineEnding
      - filesystem/File.hx:separator
      - filesystem/File.hx:workingDirectory
    scenarios:
      - filesystem/file:pathContracts
    notes: "Target conditions: #if sys."
  - id: remaining.FL.filesystem-metadata-locations-synchronous-contracts-well-known
    section: "openfl.filesystem > File: identity, paths, and metadata"
    behavior: >-
      Filesystem metadata, locations, and synchronous contracts: reference well-known directories
      come from Lime, while Flight may return no application, application-storage, desktop,
      documents, or user path. Adapter fallbacks use Lime when present and otherwise
      program/current/home paths, so they need not equal the 9.5.2 values. Flight also lacks the
      full metadata, permission, hidden-file, real-path, symlink, watch, backup, package, and
      downloaded-file contract.
    source:
      - filesystem/File.hx:new
    scenarios: []
    notes: >-
      Blocked on Flight gap "Filesystem metadata, locations, and synchronous contracts". Target
      conditions: #if lime, #if desktop.
  - id: remaining.FL.exists-directory-query-haxe-file-system-hidden
    section: "openfl.filesystem > File: identity, paths, and metadata"
    behavior: >-
      exists/isDirectory query Haxe FileSystem. isHidden uses Windows attrib output there and a
      leading dot elsewhere. isSymbolicLink and spaceAvailable are not public members of the
      supplied OpenFL 9.5.2 File source.
    source:
      - filesystem/File.hx:exists
      - filesystem/File.hx:isDirectory
      - filesystem/File.hx:isHidden
    scenarios:
      - filesystem/file:source
  - id: remaining.FL.native-path-resolves-app-app-storage-prefixes
    section: "openfl.filesystem > File: identity, paths, and metadata"
    behavior: >-
      nativePath resolves app: and app-storage: prefixes, expands %VAR% on Windows, appends a
      separator to trailing drive colons, rejects unrooted non-Windows paths without a directory
      component, refreshes stats, and applies native separators. Its URL setter strips five
      characters regardless of the recognized scheme.
    source:
      - filesystem/File.hx:nativePath
      - filesystem/File.hx:separator
      - filesystem/File.hx:url
    scenarios:
      - filesystem/file:pathContracts
  - id: remaining.FL.url-emits-file-plus-url-encoded-slash
    section: "openfl.filesystem > File: identity, paths, and metadata"
    behavior: >-
      Reference url emits file:// plus a URL-encoded slash-normalized path; parent derives the
      directory and returns null at the filesystem root. Adapter outputs app:/app-storage: for its
      tracked virtual roots, an intentional extension tied to its corrected scheme handling.
    source:
      - filesystem/File.hx:parent
      - filesystem/File.hx:url
    scenarios:
      - filesystem/file:source
    notes: >-
      Keep virtual app:/ and app-storage: URLs as an intentional extension aligned with corrected
      scheme handling.
  - id: remaining.FL.filesystem-metadata-locations-synchronous-contracts-get-file
    section: "openfl.filesystem > File: identity, paths, and metadata"
    behavior: >-
      Filesystem metadata, locations, and synchronous contracts: getFileBytes, getFileText,
      saveBytes, and saveText are immediate, throwing Haxe filesystem calls in the reference. The
      adapter implements them through Flight promises and can preserve that synchronous API only
      when the host promise settles immediately; a truly asynchronous response becomes an IOError
      rather than blocking.
    source:
      - errors/IOError.hx:new
      - filesystem/File.hx:getFileBytes
      - filesystem/File.hx:getFileText
      - filesystem/File.hx:saveBytes
      - filesystem/File.hx:saveText
    scenarios: []
    notes: Blocked on Flight gap "Filesystem metadata, locations, and synchronous contracts".
  - id: remaining.FL.only-one-browse-operation-may-pending-per
    section: "openfl.filesystem > File: dialogs and path operations"
    behavior: >-
      Only one browse operation may be pending per File; another throws IllegalOperationError("File
      Dialog is already open."). Directory, open, multiple-open, and save operations produce SELECT,
      SELECT_MULTIPLE, or CANCEL; a single selection replaces this object's path, while multiple
      selection leaves it unchanged and supplies newly constructed files.
    source:
      - errors/IllegalOperationError.hx:new
      - filesystem/File.hx:browse
      - filesystem/File.hx:cancel
      - filesystem/File.hx:new
    scenarios:
      - filesystem/file:pathContracts
  - id: remaining.FL.browse-calls-browse-open-always-returns-false
    section: "openfl.filesystem > File: dialogs and path operations"
    behavior: >-
      browse(typeFilter) calls browseForOpen("Open", typeFilter) and always returns false, rather
      than reporting whether a dialog was shown.
    source:
      - filesystem/File.hx:browse
      - filesystem/File.hx:browseForOpen
    scenarios:
      - filesystem/file:browseReturnsFalse
  - id: remaining.FL.native-file-dialog-option-result-contract-skew
    section: "openfl.filesystem > File: dialogs and path operations"
    behavior: >-
      Native file-dialog option and result contract skew: maintained Flight hosts and generated
      bindings disagree about title/defaultPath options and raw handles versus wrapped outcomes. The
      adapter sets optional fields reflectively and accepts both result forms, but cannot guarantee
      the exact native dialog contract.
    source:
      - filesystem/File.hx:new
    scenarios: []
    notes: Blocked on Flight gap "Native file-dialog option and result contract skew".
  - id: remaining.FL.cancel-unconditionally-calls-current-background-worker-s
    section: "openfl.filesystem > File: dialogs and path operations"
    behavior: >-
      cancel() unconditionally calls the current background worker's cancel() and dispatches
      Event.CANCEL, even when that access may fail because no worker exists; it does not cancel a
      file dialog.
    source:
      - filesystem/File.hx:cancel
      - filesystem/File.hx:exists
    scenarios:
      - filesystem/file:pathContracts
  - id: remaining.FL.canonicalize-removes-paired-segments-walks-existing-directory
    section: "openfl.filesystem > File: dialogs and path operations"
    behavior: >-
      canonicalize() removes . and paired .. segments and walks existing directory listings to
      recover filesystem casing. It rewrites this object's path and does not guarantee symlink
      resolution.
    source:
      - filesystem/File.hx:canonicalize
    scenarios:
      - filesystem/file:pathOperations
  - id: remaining.FL.clone-creates-empty-file-reflectively-copies-all
    section: "openfl.filesystem > File: dialogs and path operations"
    behavior: >-
      clone() creates an empty File, reflectively copies all accessible instance fields/properties
      while swallowing individual failures, and does not copy event registrations or filesystem
      content.
    source:
      - filesystem/File.hx:clone
    scenarios:
      - filesystem/file:pathOperations
  - id: remaining.FL.resolve-path-simply-concatenates-path-one-native
    section: "openfl.filesystem > File: dialogs and path operations"
    behavior: >-
      resolvePath(path) simply concatenates this path, one native separator, and path. The adapter
      retains its documented virtual URL scheme metadata without changing the resulting native path.
    source:
      - filesystem/File.hx:nativePath
      - filesystem/File.hx:resolvePath
      - filesystem/File.hx:separator
      - filesystem/File.hx:url
    scenarios:
      - filesystem/file:pathContracts
  - id: remaining.FL.get-relative-path-normalizes-separators-returns-shared
    section: "openfl.filesystem > File: dialogs and path operations"
    behavior: >-
      getRelativePath(ref, useDotDot = false) normalizes separators and returns the shared-tail
      relative path. It returns null when no common prefix exists or walking upward would be
      required while useDotDot is false.
    source:
      - filesystem/File.hx:exists
      - filesystem/File.hx:getRelativePath
    scenarios:
      - filesystem/file:pathOperations
  - id: remaining.FL.create-temp-file-create-temp-directory-choose
    section: "openfl.filesystem > File: dialogs and path operations"
    behavior: >-
      createTempFile() and createTempDirectory() choose random nonexistent names under the system
      temporary directory but do not create either object. getRootDirectories() probes the
      hard-coded A-through-Z drive list; on non-Windows that is A:/ through Z:/, not the Unix /
      root.
    source:
      - filesystem/File.hx:createTempDirectory
      - filesystem/File.hx:createTempFile
      - filesystem/File.hx:getRootDirectories
    scenarios:
      - filesystem/file:tempExistsInitially
  - id: remaining.FL.synchronous-copy-validates-overwrite-recursively-copies-directories
    section: "openfl.filesystem > File: filesystem mutation and events"
    behavior: >-
      Synchronous copy validates overwrite, recursively copies directories, creates missing
      destination parents, and maps failure to IOError 3003. Delete-directory optionally recurses;
      delete-file removes a file; create-directory recursively creates; directory listing throws
      IOError 3007 for a non-directory and returns child File objects.
    source:
      - errors/IOError.hx:new
      - filesystem/File.hx:createDirectory
      - filesystem/File.hx:deleteDirectory
      - filesystem/File.hx:deleteFile
    scenarios:
      - filesystem/file:copyMove
  - id: remaining.FL.move-copy-followed-deletion-first-attempts-flight
    section: "openfl.filesystem > File: filesystem mutation and events"
    behavior: move is copy followed by deletion, with overwrite validation before the copy.
    source:
      - filesystem/File.hx:new
    scenarios:
      - filesystem/file:copyMove
  - id: remaining.FL.open-default-application-delegates-lime-system-open
    section: "openfl.filesystem > File: filesystem mutation and events"
    behavior: openWithDefaultApplication() delegates to Lime System.openFile.
    source:
      - filesystem/File.hx:new
      - filesystem/File.hx:openWithDefaultApplication
    scenarios:
      - filesystem/file:pathContracts
    notes: "Target conditions: #if lime."
  - id: remaining.FL.copy-async-delete-async-variants-listing-async
    section: "openfl.filesystem > File: filesystem mutation and events"
    behavior: >-
      copyToAsync, delete async variants, listing async, and moveToAsync use BackgroundWorker on
      Lime, producing COMPLETE, result-specific events, or IOErrorEvent; non-Lime Flight builds
      retain the immediate fallback.
    source:
      - errors/IOError.hx:new
      - filesystem/File.hx:applicationDirectory
      - filesystem/File.hx:applicationStorageDirectory
      - filesystem/File.hx:browseForDirectory
      - filesystem/File.hx:browseForOpenMultiple
      - filesystem/File.hx:browseForSave
      - filesystem/File.hx:copyTo
      - filesystem/File.hx:copyToAsync
      - filesystem/File.hx:deleteDirectoryAsync
      - filesystem/File.hx:deleteFileAsync
      - filesystem/File.hx:desktopDirectory
      - filesystem/File.hx:documentsDirectory
      - filesystem/File.hx:getDirectoryListing
      - filesystem/File.hx:getDirectoryListingAsync
      - filesystem/File.hx:moveTo
      - filesystem/File.hx:moveToAsync
      - filesystem/File.hx:userDirectory
    scenarios:
      - filesystem/file:pathContracts
    notes: "Target conditions: #if lime."
  - id: remaining.FL.filesystem-metadata-locations-synchronous-contracts-flight-exposes
    section: "openfl.filesystem > File: filesystem mutation and events"
    behavior: >-
      Filesystem metadata, locations, and synchronous contracts: Flight exposes promise-based file
      operations but not a general sync backend; the adapter's sync and nominally async
      compatibility layers therefore cannot reproduce reference blocking and worker scheduling on
      every host.
    source:
      - filesystem/File.hx:new
    scenarios: []
    notes: Blocked on Flight gap "Filesystem metadata, locations, and synchronous contracts".
  - id: remaining.FS.new-stream-starts-closed-big-endian-byte
    section: openfl.filesystem > FileStream
    behavior: >-
      A new stream starts closed with big endian byte order, objectEncoding = HXSF, position = 0,
      readAhead = POSITIVE_INFINITY, isWriting = false, and bytesAvailable = 0. Closed or
      wrong-direction reads/writes throw Error with ID 2092.
    source:
      - filesystem/FileStream.hx:bytesAvailable
      - filesystem/FileStream.hx:endian
      - filesystem/FileStream.hx:isWriting
      - filesystem/FileStream.hx:objectEncoding
      - filesystem/FileStream.hx:position
      - filesystem/FileStream.hx:readAhead
      - filesystem/FileStream.hx:readBytes
    scenarios:
      - filesystem/file-stream:defaults
  - id: remaining.FS.open-synchronous-read-opens-existing-input-write
    section: openfl.filesystem > FileStream
    behavior: >-
      open(file, mode) is synchronous. READ opens an existing input, WRITE creates parents and
      truncates, APPEND writes at the end, and UPDATE opens read/write at position zero. Invalid
      opens become IOError. close() closes without an event; reopening first closes the prior
      handle.
    source:
      - errors/IOError.hx:new
      - filesystem/FileStream.hx:close
      - filesystem/FileStream.hx:open
      - filesystem/FileStream.hx:position
    scenarios:
      - filesystem/file-stream:write
      - filesystem/file-stream:read
      - filesystem/file-stream:modes
  - id: remaining.FS.native-filesystem-streaming-read-ahead-maintained-native
    section: openfl.filesystem > FileStream
    behavior: >-
      Native filesystem streaming and read-ahead: maintained native Flight hosts return no usable
      stream handles and Flight lacks seek, truncate, and random-access semantics. The adapter
      therefore loads a whole-file ByteArray, mutates it in memory, and flushes snapshots, rather
      than matching the reference's true file handle and cursor behavior.
    source:
      - filesystem/FileStream.hx:readAhead
      - filesystem/FileStream.hx:truncate
    scenarios: []
    notes: Blocked on Flight gap "Native filesystem streaming and read-ahead".
  - id: remaining.FS.position-controls-byte-cursor-bytes-available-remaining
    section: openfl.filesystem > FileStream
    behavior: >-
      position controls the byte cursor and bytesAvailable is remaining bytes. endian affects
      numeric methods. Boolean, signed/unsigned byte, short, int, float, double, UTF, UTF-bytes,
      byte-array, and multi-byte methods otherwise follow IDataInput/IDataOutput and ByteArray
      semantics; length = 0 in byte-array methods means all remaining bytes.
    source:
      - filesystem/FileStream.hx:bytesAvailable
      - filesystem/FileStream.hx:endian
      - filesystem/FileStream.hx:position
    scenarios:
      - filesystem/file-stream:read
      - filesystem/file-stream:littleEndianShort
      - filesystem/file-stream:bulkBytes
  - id: remaining.FS.open-async-uses-background-worker-reads-byte
    section: openfl.filesystem > FileStream
    behavior: >-
      openAsync(READ) reads in 4,096,000-byte pages governed by readAhead, dispatching progressive
      ProgressEvent.PROGRESS values before COMPLETE. The Flight-backed adapter requests matching
      ranged pages and resumes after buffered input is consumed.
    source:
      - filesystem/FileStream.hx:open
      - filesystem/FileStream.hx:openAsync
      - filesystem/FileStream.hx:readAhead
      - filesystem/FileStream.hx:readByte
    scenarios:
      - filesystem/file-stream:asyncRead
  - id: remaining.FS.asynchronous-writes-stream-output-handle-report-real
    section: openfl.filesystem > FileStream
    behavior: >-
      Asynchronous writes report pending and completed byte totals, queue changed snapshots, and
      make close wait for the queued flush before dispatching CLOSE. Flight's lack of native
      seekable handles remains tracked separately.
    source:
      - filesystem/FileStream.hx:close
      - filesystem/FileStream.hx:readBoolean
      - filesystem/FileStream.hx:readDouble
      - filesystem/FileStream.hx:readFloat
      - filesystem/FileStream.hx:readInt
      - filesystem/FileStream.hx:readShort
      - filesystem/FileStream.hx:readUTFBytes
      - filesystem/FileStream.hx:readUnsignedByte
      - filesystem/FileStream.hx:readUnsignedInt
      - filesystem/FileStream.hx:readUnsignedShort
      - filesystem/FileStream.hx:writeBoolean
      - filesystem/FileStream.hx:writeBytes
      - filesystem/FileStream.hx:writeDouble
      - filesystem/FileStream.hx:writeFloat
      - filesystem/FileStream.hx:writeInt
      - filesystem/FileStream.hx:writeShort
      - filesystem/FileStream.hx:writeUTFBytes
      - filesystem/FileStream.hx:writeUnsignedInt
    scenarios:
      - filesystem/file-stream:defaults
  - id: remaining.FS.read-multi-byte-write-multi-byte-ignore
    section: openfl.filesystem > FileStream
    behavior: >-
      readMultiByte/writeMultiByte preserve the reference's effective behavior of ignoring the
      requested character set and using UTF-8. truncate() preserves the observable cursor and
      resulting file length on the buffered backend.
    source:
      - filesystem/FileStream.hx:readMultiByte
      - filesystem/FileStream.hx:readUTF
      - filesystem/FileStream.hx:truncate
      - filesystem/FileStream.hx:writeMultiByte
      - filesystem/FileStream.hx:writeUTF
    scenarios:
      - filesystem/file-stream:multiByte
      - filesystem/file-stream:modes
  - id: remaining.FS.object-wire-formats-read-object-write-object
    section: openfl.filesystem > FileStream
    behavior: >-
      Object wire formats: reference readObject/writeObject support the selected
      ByteArray.objectEncoding. Adapter supports its length-prefixed HXSF/JSON fallback but
      explicitly throws or no-ops for AMF0 and AMF3 because those wire codecs are unavailable.
    source:
      - filesystem/FileStream.hx:objectEncoding
      - filesystem/FileStream.hx:readObject
      - filesystem/FileStream.hx:writeByte
      - filesystem/FileStream.hx:writeObject
    scenarios: []
    notes: Blocked on Flight gap "Object wire formats".
  - id: remaining.SEC.certificate-status-contains-expired-invalid-invalid-chain
    section: openfl.security
    behavior: >-
      CertificateStatus contains expired, invalid, invalidChain, notYetValid, principalMismatch,
      revoked, trusted, unknown, and untrustedSigners. Ordinary targets use nullable integers 0
      through 8 with string conversions; openfljs stores strings.
    source:
