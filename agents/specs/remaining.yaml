  - id: remaining.SEC.x-500-distinguished-name-private-constructor-read
    section: openfl.security
    behavior: >-
      X500DistinguishedName has a private constructor and read-only common, country, locality,
      organizational-unit, organization, and state/province strings. toString() omits null fields
      and concatenates the rest in exactly /CN=, /C=, /L=, /OU=, /O=, /S= order, returning "" when
