  - id: remaining.LOC.default-i-default-constructing-that-literal-keeps
    section: openfl.globalization > LocaleID
    behavior: >-
      DEFAULT is "i-default". Constructing that literal keeps it as both name and language, uses
      empty region/script, sets RTL false, and reports NO_ERROR; it does not resolve the user's
      locale in the constructor.
    source:
      - globalization/LocaleID.hx:DEFAULT
      - globalization/LocaleID.hx:name
      - globalization/LocaleID.hx:new
    scenarios:
      - globalization/locale-id:defaultLocale
  - id: remaining.LOC.non-html-normalization-changes-underscores-hyphens-lowercases
    section: openfl.globalization > LocaleID
    behavior: >-
      Non-HTML normalization changes underscores to hyphens, lowercases the language, converts root
      to und, title-cases a four-letter script, uppercases a two/three-character region, and drops
      remaining variants. HTML5 instead constructs and maximizes Intl.Locale, retaining its base
      name, language, region, and script. Successful parsing reports NO_ERROR; exceptions report
      ERROR_CODE_UNKNOWN.
    source:
      - globalization/LocaleID.hx:name
    scenarios:
      - globalization/locale-id:languageAndRegion
      - globalization/locale-id:rightToLeft
      - globalization/locale-id:scriptRegionAndVariant
    notes: "Target conditions: #if html5."
  - id: remaining.LOC.get-language-get-region-get-script-get
    section: openfl.globalization > LocaleID
    behavior: >-
      getLanguage, getRegion, getScript, getVariant, and isRightToLeft return cached values without
      changing status. Variant is always empty. RTL recognizes the fixed Avestan, Arabic, Aramaic,
      Southern Balochi, Bakhtiari, Sorani, Dhivehi, Persian, Gilaki, Hebrew, Kurdish, Mazanderani,
      N'Ko, Western Punjabi, Pashto, Sindhi, Uyghur, Urdu, and Yiddish language-code list.
    source:
      - globalization/LocaleID.hx:getLanguage
      - globalization/LocaleID.hx:getRegion
      - globalization/LocaleID.hx:getScript
      - globalization/LocaleID.hx:getVariant
      - globalization/LocaleID.hx:isRightToLeft
    scenarios:
      - globalization/locale-id:languageAndRegion
      - globalization/locale-id:rightToLeft
      - globalization/locale-id:scriptRegionAndVariant
  - id: remaining.DTF.non-html-get-available-locale-id-names
    section: openfl.globalization > DateTimeFormatter
    behavior: >-
      Non-HTML getAvailableLocaleIDNames() returns a fixed one-element Vector("en-US"); construction
      retains the requested locale but always sets actual locale en-US and NO_ERROR. HTML5 returns
      an empty available list and obtains its actual locale from
      Intl.DateTimeFormat.resolvedOptions().
    source:
      - globalization/DateTimeFormatter.hx:format
      - globalization/DateTimeFormatter.hx:getAvailableLocaleIDNames
      - globalization/DateTimeFormatter.hx:new
      - globalization/LocaleID.hx:new
    scenarios:
      - globalization/date-time-formatter:availableLocaleIDs
    notes: "Target conditions: #if html5."
  - id: remaining.DTF.get-date-style-get-time-style-get
    section: openfl.globalization > DateTimeFormatter
    behavior: >-
      getDateStyle, getTimeStyle, and getDateTimePattern return stored values and set NO_ERROR.
      getFirstWeekday() returns zero with NO_ERROR natively; HTML5 returns zero with
      PLATFORM_API_FAILED.
    source:
      - globalization/DateTimeFormatter.hx:getDateStyle
      - globalization/DateTimeFormatter.hx:getDateTimePattern
      - globalization/DateTimeFormatter.hx:getFirstWeekday
      - globalization/DateTimeFormatter.hx:getTimeStyle
    scenarios:
      - globalization/date-time-formatter:initial
      - globalization/date-time-formatter:custom
    notes: "Target conditions: #if html5."
  - id: remaining.DTF.set-date-time-styles-rejects-custom-either
    section: openfl.globalization > DateTimeFormatter
    behavior: >-
      setDateTimeStyles rejects CUSTOM in either argument with ILLEGAL_ARGUMENT_ERROR and otherwise
      stores both styles. Native patterns are English combinations of EEEE, MMMM d, yyyy, MMMM d,
      yyyy, or M/d/yyyy and h:mm:ss a or h:mm a; NONE omits its side. HTML5 resolves a pattern from
      Intl parts.
    source:
      - errors/ArgumentError.hx:new
      - globalization/DateTimeFormatter.hx:setDateTimeStyles
      - globalization/DateTimeStyle.hx:CUSTOM
      - globalization/DateTimeStyle.hx:NONE
    scenarios:
      - globalization/date-time-formatter:changedStyles
    notes: "Target conditions: #if html5."
  - id: remaining.DTF.native-style-formatting-english-long-dates-include
    section: openfl.globalization > DateTimeFormatter
    behavior: >-
      Native style formatting is English: long dates include full weekday and month, medium dates
      still use the full month, short dates are M/d/yyyy, short times omit seconds, and other time
      styles include them. The source's exact 12-hour quirk is preserved: only hours greater than 12
      become PM, so noon is labeled AM and midnight prints hour 0.
    source:
      - globalization/DateTimeFormatter.hx:new
    scenarios:
      - globalization/date-time-formatter:initial
  - id: remaining.DTF.set-date-time-pattern-rejects-null-or
    section: openfl.globalization > DateTimeFormatter
    behavior: >-
      setDateTimePattern rejects null or more than 255 characters with PATTERN_SYNTAX_ERROR,
      otherwise sets both styles to CUSTOM before tokenizing. Unknown letters are syntax errors.
      Native unsupported tokens are quarter, week/year, day/year, weekday occurrence, week/month,
      milliseconds, and all timezone forms; HTML5 supports z but rejects Q, w, D, F, W, Z, and v.
      The missing early return after S is preserved, so a later token may overwrite its
      UNSUPPORTED_ERROR status.
    source:
      - globalization/DateTimeFormatter.hx:setDateTimePattern
    scenarios:
      - globalization/date-time-formatter:custom
    notes: "Target conditions: #if html5."
  - id: remaining.DTF.native-custom-formatting-supports-quoted-text-tokens
    section: openfl.globalization > DateTimeFormatter
    behavior: >-
      Native custom formatting supports quoted text and tokens for era, year, month, date, weekday,
      AM/PM, four hour systems, minute, and second. It preserves 9.5.2 quirks including adding one
      to the already one-based date, mapping hour-11 through a decremented 12-hour value, and
      mapping hour-24 as the actual hour plus one. Unsupported tokens contribute empty text.
    source:
      - globalization/DateTimeFormatter.hx:new
    scenarios:
      - globalization/date-time-formatter:quotedCustom
  - id: remaining.DTF.native-month-names-fixed-english-full-names
    section: openfl.globalization > DateTimeFormatter
    behavior: >-
      Native month names are the 12 fixed English full names or their first three characters. Native
      weekdays are Sunday through Saturday, full or truncated to three characters for long
      abbreviation and two for short; context is ignored. HTML5 obtains localized arrays from Intl.
    source:
      - globalization/DateTimeFormatter.hx:new
    scenarios:
      - globalization/date-time-formatter:initial
    notes: "Target conditions: #if html5."
  - id: remaining.DTF.format-uses-custom-pattern-either-style-custom
    section: openfl.globalization > DateTimeFormatter
    behavior: >-
      format() uses the custom pattern when either style is CUSTOM and otherwise uses styles. Native
      formatUTC() uses the stored pattern whenever it is non-null—even one generated by a style
      setter—while HTML5 delegates style dates to Intl. Successful formatting sets NO_ERROR.
    source:
      - globalization/DateTimeFormatter.hx:actualLocaleIDName
      - globalization/DateTimeFormatter.hx:format
      - globalization/DateTimeFormatter.hx:formatUTC
      - globalization/DateTimeFormatter.hx:getMonthNames
      - globalization/DateTimeFormatter.hx:getWeekdayNames
      - globalization/DateTimeFormatter.hx:requestedLocaleIDName
      - globalization/DateTimeFormatter.hx:tokenize
    scenarios:
      - globalization/date-time-formatter:custom
    notes: "Target conditions: #if html5."
  - id: remaining.TEL.connected-true-only-c-or-neko-builds
    section: openfl.profiler.Telemetry
    behavior: >-
      connected is true only for C++ or Neko builds with hxtelemetry and outside macro context.
      spanMarker is the read-only constant 0.0 rather than a clock sample.
    source:
      - profiler/Telemetry.hx:EVENT
      - profiler/Telemetry.hx:RENDER
      - profiler/Telemetry.hx:connected
      - profiler/Telemetry.hx:spanMarker
    scenarios:
      - profiler/telemetry:connected
      - profiler/telemetry:spanMarker
    notes: "Target conditions: #if neko."
  - id: remaining.TEL.register-command-handler-unregister-command-handler-always
    section: openfl.profiler.Telemetry
    behavior: >-
      registerCommandHandler and unregisterCommandHandler always return false. sendMetric and
      sendSpanMetric are no-ops. Hidden TelemetryCommandName values are .event and .render.
    source:
      - profiler/Telemetry.hx:EVENT
      - profiler/Telemetry.hx:RENDER
      - profiler/Telemetry.hx:registerCommandHandler
      - profiler/Telemetry.hx:sendMetric
      - profiler/Telemetry.hx:sendSpanMetric
      - profiler/Telemetry.hx:unregisterCommandHandler
    scenarios:
      - profiler/telemetry:registerCommandHandler
      - profiler/telemetry:unregisterCommandHandler
      - profiler/telemetry:metricSucceeded
      - profiler/telemetry:spanMetricSucceeded
  - id: remaining.TEL.telemetry-enabled-build-stage-initialization-constructs-hx
    section: openfl.profiler.Telemetry
    behavior: >-
      In a telemetry-enabled build, Stage initialization constructs HxTelemetry from Lime
      application metadata and its internal timing/stack hooks use that instance.
    source:
      - profiler/Telemetry.hx:connected
    scenarios:
      - profiler/telemetry:connected
    notes: "Target conditions: #if lime."
  - id: remaining.PERM.file-identical-open-fl-denied-granted-use
    section: openfl.permissions.PermissionStatus
    behavior: >-
      The adapter file is identical to OpenFL 9.5.2. DENIED, GRANTED, ONLY_WHEN_IN_USE, and UNKNOWN
      have strings denied, granted, onlyWhenInUse, and unknown; ordinary targets use nullable
      integers 0 through 3 with string conversion and unknown strings map to null, while openfljs
      stores strings directly.
    source:
      - permissions/PermissionStatus.hx:DENIED
      - permissions/PermissionStatus.hx:GRANTED
      - permissions/PermissionStatus.hx:ONLY_WHEN_IN_USE
      - permissions/PermissionStatus.hx:UNKNOWN
    scenarios:
      - permissions/permission-status:constants
      - permissions/permission-status:construction
      - permissions/permission-status:statusValues
    notes: "Target conditions: #if openfljs."
