      - security/CertificateStatus.hx:INVALID
      - security/CertificateStatus.hx:INVALID_CHAIN
      - security/CertificateStatus.hx:NOT_YET_VALID
      - security/CertificateStatus.hx:PRINCIPAL_MISMATCH
