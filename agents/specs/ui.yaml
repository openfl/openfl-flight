package: ui

entries:

  # -- Keyboard --

  - id: ui.Keyboard.digit-letter-numpad-constants
    section: "Keyboard"
    behavior: >-
      Top-row digit constants `NUMBER_0` through `NUMBER_9` are contiguous key codes `48..57`;
      alphabet constants `A` through `Z` are `65..90`; and `NUMPAD_0` through `NUMPAD_9` are
      `96..105`.
    status: covered
    scenarios:
      - ui/keyboard:keyCodes.numbers
      - ui/keyboard:keyCodes.letters
      - ui/keyboard:keyCodes.numpadDigits
      - ui/keyboard:allKeyCodesMatchExpected

  - id: ui.Keyboard.numpad-function-constants
    section: "Keyboard"
    behavior: >-
      Numpad operator constants are `NUMPAD_MULTIPLY=106`, `NUMPAD_ADD=107`, `NUMPAD_ENTER=108`,
      `NUMPAD_SUBTRACT=109`, `NUMPAD_DECIMAL=110`, and `NUMPAD_DIVIDE=111`. Function keys `F1`
      through `F15` are contiguous `112..126`.
    status: covered
    scenarios:
      - ui/keyboard:keyCodes.numpadOperators
      - ui/keyboard:keyCodes.functionKeys
      - ui/keyboard:allKeyCodesMatchExpected

  - id: ui.Keyboard.control-navigation-constants
    section: "Keyboard"
    behavior: >-
      Control/navigation codes are `BACKSPACE=8`, `TAB=9`, `ENTER=13`, `COMMAND=15`, `SHIFT=16`,
      `CONTROL=17`, `ALTERNATE=18`, `BREAK=19`, `CAPS_LOCK=20`, `NUMPAD=21`, `ESCAPE=27`,
      `SPACE=32`, `PAGE_UP=33`, `PAGE_DOWN=34`, `END=35`, `HOME=36`, `LEFT=37`, `UP=38`,
      `RIGHT=39`, `DOWN=40`, `INSERT=45`, `DELETE=46`, and `NUMLOCK=144`.
    status: covered
    scenarios:
      - ui/keyboard:keyCodes.controls
      - ui/keyboard:allKeyCodesMatchExpected

  - id: ui.Keyboard.punctuation-constants
    section: "Keyboard"
    behavior: >-
      Punctuation constants are `SEMICOLON=186`, `EQUAL=187`, `COMMA=188`, `MINUS=189`,
      `PERIOD=190`, `SLASH=191`, `BACKQUOTE=192`, `LEFTBRACKET=219`, `BACKSLASH=220`,
      `RIGHTBRACKET=221`, and `QUOTE=222`.
    status: covered
    scenarios:
      - ui/keyboard:keyCodes.punctuation
      - ui/keyboard:allKeyCodesMatchExpected

  - id: ui.Keyboard.lock-state-defaults
    section: "Keyboard"
    behavior: >-
      Read-only static `capsLock` and `numLock` are declared but never assigned by the 9.5.2
      implementation, so each has the target-default false value and does not track actual
      keyboard state.
    status: covered
    scenarios:
      - ui/keyboard:locks

  - id: ui.Keyboard.accessibility-false
    section: "Keyboard"
    behavior: >-
      `isAccessible()` always returns false; it does not inspect the host or permissions.
    status: covered
    scenarios:
      - ui/keyboard:accessible

  - id: ui.Keyboard.lime-event-translation
    section: "Keyboard"
    behavior: >-
      The Lime event bridge translates host KeyCode values to Flash-style Keyboard codes,
      including shifted symbol keys to their underlying number/punctuation key, PRINT_SCREEN to
      301, SCROLL_LOCK to 145, APPLICATION to 302, and left/right modifiers to their shared
      CONTROL/SHIFT/ALTERNATE/COMMAND codes. It separately derives LEFT, RIGHT, NUM_PAD, or
      STANDARD key location from the original host key. Character codes use shift XOR caps-lock
      for letter case, map shifted digits and punctuation to ASCII symbols, keep numpad digits
      as ASCII digits, and return zero for unhandled keys. The source's numpad operator table is
      literal: multiply/add/enter/decimal/divide become ASCII 42/43/44/45/46, while
      NUMPAD_SUBTRACT is unhandled and becomes zero.
    status: missing
    notes: >-
      Host key-code and location conversion, and their Stage call path, are compiled only with
      `lime`; the character-code helper itself is present on every non-Flash build. NUMPAD_ENTER
      becomes Keyboard.ENTER by default and becomes Keyboard.NUMPAD_ENTER only when
      `openfl_numpad_enter` is defined.
    scenarios: []

  # -- KeyLocation --

  - id: ui.KeyLocation.constants
    section: "KeyLocation"
    behavior: >-
      The constants are `STANDARD=0`, `LEFT=1`, `RIGHT=2`, and `NUM_PAD=3`. The abstract converts
      freely from and to Int and UInt, so arbitrary numeric locations are representable.
    status: covered
    scenarios:
      - ui/keyboard:keyboardEvent.keyLocation

  # -- Mouse and MouseCursor --

  - id: ui.Mouse.constants
    section: "Mouse and MouseCursor"
    behavior: >-
      Public cursor constants are the exact strings `ARROW="arrow"`, `AUTO="auto"`,
      `BUTTON="button"`, `HAND="hand"`, and `IBEAM="ibeam"`. The abstract accepts arbitrary
      strings; assigning an unknown cursor does not throw.
    status: covered
    scenarios:
      - ui/mouse:cursorValues
      - ui/mouse:cursorReadBack

  - id: ui.Mouse.cursor-storage-null
    section: "Mouse and MouseCursor"
    behavior: >-
      `Mouse.cursor` begins as `AUTO`. Setting null coerces it to `AUTO`; every other value,
      including an unknown string, is retained and returned by the getter.
    status: covered
    scenarios:
      - ui/mouse:cursorReadBack
      - ui/mouse:nullCursorReadBack

  - id: ui.Mouse.host-cursor-mapping
    section: "Mouse and MouseCursor"
    behavior: >-
      On Lime windows, `ARROW` maps to host `arrow`, `BUTTON` to `pointer`, `HAND` to `move`,
      and `IBEAM` to `text`. Setting `AUTO` or an unknown value changes stored state but makes
      no host cursor assignment, leaving the previous host cursor in place.
    status: covered
    notes: >-
      Host cursor assignment is compiled only with `lime`; other targets retain cursor state
      without iterating Application windows.
    scenarios:
      - ui/mouse:cursorReadBack

  - id: ui.Mouse.hide-no-stack
    section: "Mouse and MouseCursor"
    behavior: >-
      `hide()` sets a single static hidden flag and assigns null cursor to every application
      window. Repeated calls do not stack. While hidden, changing `cursor` only changes stored
      state. `show()` clears the flag and reapplies the stored cursor mapping; repeated show
      calls are harmless.
    status: covered
    notes: >-
      Clearing and reapplying cursor state on Application windows is compiled only with `lime`.
    scenarios:
      - ui/mouse:hideDoesNotThrow
      - ui/mouse:repeatedVisibilityDoesNotThrow
      - ui/mouse:showDoesNotThrow
      - ui/mouse:cursorRestored

  - id: ui.Mouse.support-flags
    section: "Mouse and MouseCursor"
    behavior: >-
      `supportsCursor` and `supportsNativeCursor` are read-only compile-time values: true for
      every non-mobile build and false for mobile, independent of the actual window/backend.
    status: covered
    notes: "Both values are selected by the presence or absence of the `mobile` define."
    scenarios:
      - ui/mouse:capabilities

  - id: ui.Mouse.cursor-registration-absent
    section: "Mouse and MouseCursor"
    behavior: >-
      `registerCursor` and `unregisterCursor` are inside `#if false` in 9.5.2 and are not part
      of the compiled non-Flash API. Extra private cursor names and string conversions do not
      expand the public MouseCursor constants.
    status: covered
    notes: >-
      The `#if false` absence applies to non-Flash OpenFL; Flash uses its native Mouse API.
    scenarios:
      - ui/mouse:cursorRegistrationAbsent

  # -- GameInput --

  - id: ui.GI.support-device-count
    section: "GameInput"
    behavior: >-
      `isSupported` is a read-only static initialized to true unconditionally. `numDevices` is
      the current size of one process-global device list, initially zero. There is no capability
      probe.
    status: covered
    scenarios:
      - ui/game-input:initial

  - id: ui.GI.instances-global-registration
    section: "GameInput"
    behavior: >-
      Every `new GameInput()` creates an independent EventDispatcher and appends it permanently
      to the global list of GameInput instances; there is no dispose/removal API.
    status: covered
    scenarios:
      - ui/game-input:device.replayedAddedCount

  - id: ui.GI.host-attachment-timing
    section: "GameInput"
    behavior: >-
      Device tracking is wired by Stage's Lime-module registration, not GameInput static
      initialization. Stage first feeds every existing `Gamepad.devices` entry through the
      connect callback and then subscribes to `Gamepad.onConnect`, so the global device list can
      populate before any GameInput instance is constructed. Non-Lime builds retain no
      equivalent source callback path.
    status: covered
    notes: "The Stage registration and host callback path are compiled only with `lime`."
    scenarios:
      - ui/game-input:hostAttachedBeforeInstance

  - id: ui.GI.device-indexing
    section: "GameInput"
    behavior: >-
      `getDeviceAt(index)` returns the device at a valid zero-based index and null for negative
      or out-of-range indices.
    status: covered
    scenarios:
      - ui/game-input:initial
      - ui/game-input:enumeration

  - id: ui.GI.device-added-replay
    section: "GameInput"
    behavior: >-
      Overridden `addEventListener` first registers the listener normally. When the type is
      `GameInputEvent.DEVICE_ADDED`, it immediately dispatches one bubbling, non-cancelable
      DEVICE_ADDED event for every device already present. Dispatch is through the GameInput
      dispatcher, so all already-registered listeners of that dispatcher receive the replay
      too—not just the newly added listener. Other event types have ordinary EventDispatcher
      behavior, including capture, priority, and weak-reference arguments.
    status: covered
    scenarios:
      - ui/game-input:device.replayedAddedCount
      - ui/game-input:device.addedCount

  - id: ui.GI.connect-disconnect-broadcast
    section: "GameInput"
    behavior: >-
      A host connect creates and appends a `GameInputDevice` only when that Gamepad object is not
      already mapped, then sends a bubbling/non-cancelable DEVICE_ADDED event through every
      extant GameInput instance. A duplicate connect still rebroadcasts DEVICE_ADDED for the
      existing device without changing `numDevices`. Disconnect removes a known matching device
      first, updates the count, and broadcasts DEVICE_REMOVED; an unknown or repeated disconnect
      does nothing.
    status: covered
    notes: "Connect/disconnect callbacks are compiled only with `lime`."
    scenarios:
      - ui/game-input:device
      - ui/game-input:disconnect

  - id: ui.GI.unknown-device-event-order
    section: "GameInput"
    behavior: >-
      An axis/button update for an unknown host id creates the device silently; DEVICE_ADDED is
      dispatched only by the later connect callback.
    status: covered
    notes: "Axis and button host callbacks are compiled only with `lime`."
    scenarios:
      - ui/game-input:unknownDeviceEventOrder

  - id: ui.GI.control-update-events
    section: "GameInput"
    behavior: >-
      Axis and button callbacks ignore values while the device is disabled. When enabled, they
      lazily create missing controls, update the control value even when unchanged, and dispatch
      a plain `Event.CHANGE` from that control (non-bubbling, non-cancelable).
    status: covered
    notes: "Axis and button host callbacks are compiled only with `lime`."
    scenarios:
      - ui/game-input:device.axisChanges
      - ui/game-input:device.buttonChanges
      - ui/game-input:device.axisValue
      - ui/game-input:device.buttonValue

  - id: ui.GI.button-value-normalization
    section: "GameInput"
    behavior: >-
      The host axis value is stored verbatim, while a button-down callback is normalized to
      exactly 1 and button-up to exactly 0.
    status: covered
    notes: "Axis and button host callbacks are compiled only with `lime`."
    scenarios:
      - ui/game-input:device.axisValue
      - ui/game-input:device.buttonValue
      - ui/game-input:device.buttonValues

  # -- GameInputDevice --

  - id: ui.GID.fields-defaults
    section: "GameInputDevice"
    behavior: >-
      `MAX_BUFFER_SIZE` is the compile-time constant `32000`. A device retains its constructor
      id and name as read-only strings and begins `enabled=false` and `sampleInterval=0`.
      GameInputDevice itself has no event-dispatch API.
    status: covered
    scenarios:
      - ui/game-input:constants.maxBufferSize
      - ui/game-input:device.id
      - ui/game-input:device.name
      - ui/game-input:device.enabledBefore
      - ui/game-input:device.sampleIntervalBefore

  - id: ui.GID.precreated-controls
    section: "GameInputDevice"
    behavior: >-
      Construction precreates six controls `AXIS_0` through `AXIS_5` with range `[-1,1]`,
      followed by fifteen `BUTTON_0` through `BUTTON_14` with range `[0,1]`. Thus `numControls`
      initially reports 21 and grows if host updates create higher-index controls.
    status: covered
    scenarios:
      - ui/game-input:device.numControls
      - ui/game-input:device.axisRange
      - ui/game-input:device.buttonRange

  - id: ui.GID.control-indexing
    section: "GameInputDevice"
    behavior: >-
      `getControlAt(i)` returns a control for a valid zero-based index and null for
      negative/out-of-range indices. Control ordering is the initial six axes, initial fifteen
      buttons, then controls in lazy-creation order.
    status: covered
    scenarios:
      - ui/game-input:device.negativeControlIsNull
      - ui/game-input:device.outOfRangeControlIsNull
      - ui/game-input:device.axisID
      - ui/game-input:device.buttonID

  - id: ui.GID.enabled-sample-interval
    section: "GameInputDevice"
    behavior: >-
      `sampleInterval` and `enabled` are unrestricted direct fields. Toggling them has no
      immediate side effect in the OpenFL class; enabled gates only subsequent host input
      updates.
    status: covered
    scenarios:
      - ui/game-input:device.enabledAfter
      - ui/game-input:device.sampleIntervalAfter

  - id: ui.GID.sample-caching-noop
    section: "GameInputDevice"
    behavior: >-
      `startCachingSamples(numSamples,controls)` and `stopCachingSamples()` are empty, including
      when controls is null. `getCachedSamples(data,append=false)` always returns zero and neither
      clears nor appends to the supplied ByteArray; a null data argument is accepted because it
      is never dereferenced. The adapter preserves this literal 9.5.2 no-data contract;
      **Native gamepad attachment and sample history** blocks implementing the richer documented
      API, not source parity here.
    status: covered
    scenarios:
      - ui/game-input:device.cachedSamples
      - ui/game-input:device.cachedSamplesAppend
      - ui/game-input:device.cachingDoesNotThrow

  - id: ui.GID.device-id-name-derivation
    section: "GameInputDevice"
    behavior: >-
      The first host callback that sees a Lime Gamepad creates the device with `id=gamepad.guid`
      and `name=gamepad.name`. Those strings are captured once: a later connect for a device
      created silently by an earlier input callback reuses it and does not refresh either field.
    status: covered
    notes: "The Gamepad-to-device construction path is compiled only with `lime`."
    scenarios:
      - ui/game-input:device.id
      - ui/game-input:device.name

  # -- GameInputControl --

  - id: ui.GIC.fields-ranges
    section: "GameInputControl"
    behavior: >-
      Controls have no public constructor. Their read-only `device`, `id`, `minValue`, and
      `maxValue` are set when the owning device creates them. Axis ranges are `[-1,1]`; button
      ranges are `[0,1]`.
    status: covered
    scenarios:
      - ui/game-input:device.axisDeviceMatches
      - ui/game-input:device.axisID
      - ui/game-input:device.axisRange
      - ui/game-input:device.buttonDeviceMatches
      - ui/game-input:device.buttonID
      - ui/game-input:device.buttonRange

  - id: ui.GIC.value-updates
    section: "GameInputControl"
    behavior: >-
      Read-only `value` starts at zero and changes only through internal host callbacks when the
      owning device is enabled. Values are stored verbatim rather than clamped to min/max.
    status: covered
    scenarios:
      - ui/game-input:device.axisValue
      - ui/game-input:device.buttonValue

  - id: ui.GIC.change-events
    section: "GameInputControl"
    behavior: >-
      Each control is an EventDispatcher. A host value update assigns the new value even if
      unchanged and then dispatches `Event.CHANGE`; the event carries no separate old/new
      values.
    status: covered
    scenarios:
      - ui/game-input:device.axisChanges
      - ui/game-input:device.buttonChanges

  # -- Multitouch --

  - id: ui.Multitouch.input-mode
    section: "Multitouch"
    behavior: >-
      `inputMode` starts as `MultitouchInputMode.TOUCH_POINT` and is a freely writable static;
      assigning NONE/GESTURE does not itself enable, disable, or synthesize events.
    status: covered
    scenarios:
      - ui/multitouch:initial.inputMode
      - ui/multitouch:modes

  - id: ui.Multitouch.max-touch-points-static
    section: "Multitouch"
    behavior: >-
      Read-only `maxTouchPoints` is initialized once to 2 and never changed by observed touches.
    status: covered
    scenarios:
      - ui/multitouch:initial.maxTouchPoints
      - ui/multitouch:maxAfterThreeTouches

  - id: ui.Multitouch.gesture-fields
    section: "Multitouch"
    behavior: >-
      `supportedGestures` is a read-only static left null, and `supportsGestureEvents` is a
      read-only false. Neither is populated dynamically.
    status: covered
    scenarios:
      - ui/multitouch:initial.supportedGestures
      - ui/multitouch:initial.supportsGestureEvents

  - id: ui.Multitouch.touch-capability-platform-rules
    section: "Multitouch"
    behavior: >-
      On `js && html5`, `supportsTouchEvents` tests browser touch fields. Every other non-macOS
      build returns true at compile time, including JavaScript builds without `html5`; macOS
      builds return false. Observed touch events do not mutate it.
    status: covered
    notes: >-
      Branch order is `js && html5`, then `!mac`, then macOS; this is not a generic JS/non-JS
      distinction.
    scenarios:
      - ui/multitouch:initial.supportsTouchEvents
      - ui/multitouch:supportsAfterFlightTouch

  - id: ui.Multitouch.gesture-capability-stubs
    section: "Multitouch"
    behavior: >-
      OpenFL itself exposes no gesture recognition through these statics, and the adapter
      preserves those null/false values. Flight's **Touch maximums and gesture recognition** gap
      blocks the richer documented capability, not this literal 9.5.2 source contract.
    status: covered
    scenarios:
      - ui/multitouch:initial.supportedGestures
      - ui/multitouch:initial.supportsGestureEvents

  - id: ui.Multitouch.map-touch-to-mouse-absent
    section: "Multitouch"
    behavior: >-
      The documented hidden public static `mapTouchToMouse` field is commented out in the
      non-Flash 9.5.2 source and is therefore absent from the compiled OpenFL API.
    status: missing
    notes: >-
      Applies to the non-Flash implementation; Flash uses its native Multitouch type.
    scenarios: []

  # -- MultitouchInputMode --

  - id: ui.MTMode.values-conversion
    section: "MultitouchInputMode"
    behavior: >-
      When `openfljs` is not defined, the abstract values are `GESTURE=0`, `NONE=1`, and
      `TOUCH_POINT=2`; exact private string conversions are `"gesture"`, `"none"`, and
      `"touchPoint"`, with an unknown input string converting to null. With `openfljs`, those
      three strings are the abstract values directly. This branch follows the define, not the
      generic JavaScript target.
    status: covered
    notes: >-
      The integer-versus-string representation branch is selected by the `openfljs` define on
      non-Flash builds.
    scenarios:
      - ui/multitouch:modes

  # -- Package target selection --

  - id: ui.Target.flash-native-aliases
    section: "Package target selection"
    behavior: >-
      On the Flash target, every public type in this package is a typedef to the corresponding
      `flash.ui` type. The executable entries above describe OpenFL's non-Flash implementations;
      Flash behavior is supplied by the platform classes instead.
    status: missing
    notes: "Applies only when the `flash` compilation target is selected."
    scenarios: []
