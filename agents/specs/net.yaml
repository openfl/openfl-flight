package: net

entries:

  - id: net.UR.new-url-method
    section: "URLRequest"
    behavior: >
      `new(url = null)` stores a non-null URL, initializes `method` to `GET`, `requestHeaders`
      to a fresh empty array, `contentType` to null, `followRedirects`, `manageCookies`, and
      `userAgent` from `URLRequestDefaults`, and `withCredentials` to false. `idleTimeout`
      comes from a positive default; otherwise it is the `lime-default-timeout` define or
      `30000` ms.
    status: covered
    scenarios:
      - net/url-loader-request:requestDefaults
      - net/url-types:requestEdges

  - id: net.UR.url-method
    section: "URLRequest"
    behavior: >
      `url`, `method`, `data`, `contentType`, `requestHeaders`, `followRedirects`,
      `manageCookies`, `withCredentials`, `idleTimeout`, and `userAgent` are mutable data
      properties with no validation in this class.
    status: covered
    scenarios:
      - net/url-loader-request:requestDefaults
      - net/url-loader-request:requestMutation

  - id: net.UR.consumers-interpret-data-by-method-get-appends
    section: "URLRequest"
    behavior: >
      Consumers interpret `data` by method: GET appends encoded variables to the query; other
      methods send data in the body. `URLVariables`/dynamic data is form encoded, string data
      is sent as text, and byte data is binary when the backend accepts it. `contentType`
      becomes `Content-Type`; request headers are forwarded subject to host/browser
      restrictions.
    status: covered
    scenarios:
      - net/url-loader-request:requestDefaults
      - net/url-loader-request:requestMutation

  - id: net.UR.urlrequestmethod-delete
    section: "URLRequest"
    behavior: >
      `URLRequestMethod` constants are the strings `DELETE`, `GET`, `HEAD`, `OPTIONS`, `POST`,
      and `PUT`.
    status: covered
    scenarios:
      - net/url-request:defaults
      - net/url-request:properties

  - id: net.UR.urlrequestdefaults-followredirects-idletimeout
    section: "URLRequest"
    behavior: >
      `URLRequestDefaults.followRedirects = true`, `idleTimeout = 0`, `manageCookies = true`,
      and `userAgent = null` are mutable static defaults copied only when a request is
      constructed; later default changes do not mutate existing requests.
    status: covered
    scenarios:
      - net/url-loader-request:requestDefaults
      - net/url-types:requestEdges

  - id: net.UR.authenticate-cacheresponse
    section: "URLRequest"
    behavior: >
      `authenticate` and `cacheResponse` occur in the broader AIR API but are not declared by
      non-Flash OpenFL 9.5.2. `digest` and `useRedirectedURL` are likewise compiled out. The
      adapter intentionally does not add them.
    status: covered
    scenarios:
      - net/surface:requestSurface

  - id: net.UR.urlrequestheader-new-name-value
    section: "URLRequest"
    behavior: >
      `URLRequestHeader.new(name = "", value = "")` stores its two mutable strings without
      validation. Header restrictions are enforced, if at all, by the transport.
    status: covered
    scenarios:
      - net/url-loader-request:header
      - net/url-types:headerEdges

  - id: net.UL.new-request
    section: "URLLoader"
    behavior: >
      `new(request = null)` initializes byte counters to `0`, `dataFormat` to `TEXT`, and
      `data` to null; a non-null request starts loading immediately.
    status: covered
    scenarios:
      - net/url-loader-request:loaderDefaults

  - id: net.UL.dataformat-text
    section: "URLLoader"
    behavior: >
      `dataFormat` accepts `TEXT`, `BINARY`, or `VARIABLES`. Completion data is respectively
      `String`, `ByteArray`, or a decoded `URLVariables`; changing the format while a request
      is pending affects completion decoding.
    status: covered
    scenarios:
      - net/url-loader-request:loaderDefaults

  - id: net.UL.load-request-event-open
    section: "URLLoader"
    behavior: >
      `load(request)` synchronously dispatches `Event.OPEN`, transfers the request
      method/body/content type/headers/redirect, timeout, cookie credential, and user-agent
      options, and dispatches backend `ProgressEvent.PROGRESS` notifications while
      downloading.
    status: covered
    scenarios:
      - net/url-loader-request:loadStart

  - id: net.UL.the-actual-9-5-2-success-tail
    section: "URLLoader"
    behavior: >
      The actual 9.5.2 success tail is `HTTP_RESPONSE_STATUS -> HTTP_STATUS -> COMPLETE`,
      after any progress events. Both status events are emitted only once the complete
      response is available, not at connection/open time; `HTTP_RESPONSE_STATUS` carries
      response URL and response headers, while `HTTP_STATUS` carries only the numeric status.
    status: covered
    scenarios:
      - net/url-stream:completedBody

  - id: net.UL.the-current-flight-path-preserves-that-final
    section: "URLLoader"
    behavior: >
      The current Flight path preserves that final status order. Flight does not expose
      status/headers before the completed body; see **URLLoader/URLStream cancellation,
      chunks, and early response metadata**.
    status: covered
    scenarios:
      - net/url-stream:completedBody

  - id: net.UL.transport-decode-failure-dispatches-ioerrorevent-ioerror-the
    section: "URLLoader"
    behavior: >
      Transport/decode failure dispatches `IOErrorEvent.IO_ERROR`. The 9.5.2 Neko path
      special-cases numeric error `403` as `SecurityErrorEvent`; the current adapter treats
      HTTP response 403 as `securityError` on all targets and other unsuccessful statuses as
      `ioError`. A successful response stores `data` before `complete`; an unsuccessful
      response may store decoded data before its error event in the current adapter.
    status: covered
    scenarios:
      - net/url-loader-request:errorEvents

  - id: net.UL.although-progress-event-objects-carry-byte-counts
    section: "URLLoader"
    behavior: >
      Although progress event objects carry byte counts, the executable 9.5.2 handlers never
      assign those values to the public `bytesLoaded` and `bytesTotal` fields; they remain
      zero. The current adapter preserves this quirk. Missing/unknown content length appears
      as a zero event total.
    status: covered
    scenarios:
      - net/url-loader-request:loadStart
      - net/url-loader-request:errorEvents

  - id: net.UL.close
    section: "URLLoader"
    behavior: >
      `close()` cancels Lime's HTTP request in 9.5.2. The current method invalidates
      callbacks, so no later progress/completion/error is observed, but cannot abort the
      Flight transport. Calling it with no active load is a no-op rather than the documented
      invalid-stream exception. See **URLLoader/URLStream cancellation, chunks, and early
      response metadata**.
    status: flight-gap
    gap: "URLLoader/URLStream cancellation, chunks, and early response metadata"
    scenarios:
      - net/url-loader-request:closeAndReload

  - id: net.UL.flight-s-public-default-http-backend-is
    section: "URLLoader"
    behavior: >
      Flight's public default HTTP backend is available on the web host; native operation
      depends on a maintained Lime/Clay host installing a backend. See the same gap entry.
    status: flight-gap
    gap: "URLLoader/URLStream cancellation, chunks, and early response metadata"
    scenarios: []

  - id: net.UL.urlloaderdataformat-binary
    section: "URLLoader"
    behavior: >
      `URLLoaderDataFormat` is integer-backed as BINARY/TEXT/VARIABLES = 0/1/2 on every
      non-`openfljs` portable target, with canonical string conversions. On `openfljs` the
      constants are the strings `"binary"`, `"text"`, and `"variables"` directly.
    status: covered
    scenarios:
      - net/url-loader-request:loaderDefaults
      - net/url-types:dataFormats

  - id: net.US.new-endian-big
    section: "URLStream"
    behavior: >
      `new()` creates an empty stream whose intended byte order is `Endian.BIG_ENDIAN`.
      `objectEncoding` is a mutable field and otherwise has the target's default null/zero
      initialization until assigned.
    status: covered
    scenarios:
      - net/url-stream:defaults
      - net/url-stream:dataInput

  - id: net.US.load-request-progress
    section: "URLStream"
    behavior: >
      `load(request)` starts a binary request. Portable 9.5.2 listens only to its internal
      loader's `progress`, `complete`, `ioError`, and `securityError`; it does **not** forward
      `open`, `httpStatus`, or `httpResponseStatus`, despite those events appearing in the API
      prose. The adapter matches this event surface.
    status: covered
    scenarios:
      - net/url-stream:loadStart
      - net/url-stream:requestMapping

  - id: net.US.on-success-the-complete-response-becomes-the
    section: "URLStream"
    behavior: >
      On success, the complete response becomes the internal `ByteArray`, a final progress
      event is dispatched, then `Event.COMPLETE`. `bytesAvailable` is `data.length -
      data.position` or zero with no data.
    status: covered
    scenarios:
      - net/url-stream:completedBody

  - id: net.US.the-documentation-promises-incremental-readable-chunks-but
    section: "URLStream"
    behavior: >
      The documentation promises incremental readable chunks, but 9.5.2's internal URLLoader
      normally has no `data` until completion. Flight progress has counts but no chunk and
      likewise cannot make bytes readable early. See **URLLoader/URLStream cancellation,
      chunks, and early response metadata**.
    status: flight-gap
    gap: "URLLoader/URLStream cancellation, chunks, and early response metadata"
    scenarios: []

  - id: net.US.connected-false
    section: "URLStream"
    behavior: >
      `connected` always returns `false` in portable 9.5.2 and in the adapter; it is not a
      loading-state property.
    status: covered
    scenarios:
      - net/url-stream:defaults

  - id: net.US.readboolean-readbyte
    section: "URLStream"
    behavior: >
      `readBoolean`, `readByte`, `readBytes`, `readDouble`, `readFloat`, `readInt`,
      `readMultiByte`, `readShort`, `readUnsignedByte`, `readUnsignedInt`,
      `readUnsignedShort`, `readUTF`, and `readUTFBytes` delegate exactly to the current
      internal ByteArray, consuming its position and throwing `EOFError` for insufficient
      data. Calling while data is null fails by null access rather than a purpose-built
      IOError.
    status: covered
    scenarios:
      - net/url-stream:primitiveReads
      - net/url-stream:dataInput

  - id: net.US.readobject-objectencoding
    section: "URLStream"
    behavior: >
      `readObject()` returns null unconditionally in the executable portable 9.5.2 source; the
      adapter retains that stub. The `objectEncoding` value is copied to loaded data but not
      used by this method.
    status: covered
    scenarios:
      - net/surface:urlStreamObject

  - id: net.US.endian-load
    section: "URLStream"
    behavior: >
      `endian` reads/writes the internal ByteArray. Before the first `load`, the 9.5.2 getter
      and setter dereference null; the adapter setter safely remembers the value but the
      getter retains the null-data quirk. During/after load, byte-order changes affect all
      numeric reads.
    status: covered
    scenarios:
      - net/url-stream:dataInput

  - id: net.US.close
    section: "URLStream"
    behavior: >
      `close()` removes listeners and clears readable data in 9.5.2; the adapter also
      suppresses stale callbacks but cannot abort Flight transport.
    status: flight-gap
    gap: "URLLoader/URLStream cancellation, chunks, and early response metadata"
    scenarios:
      - net/url-stream:close

  - id: net.UV.new-source-decode
    section: "URLVariables"
    behavior: >
      `new(source = null)` creates an empty dynamic object and calls `decode(source)` for
      non-null input. Fields are accessible dynamically and by string array access.
    status: covered
    scenarios:
      - net/url-request:variables
      - net/url-types:variables

  - id: net.UV.decode-source
    section: "URLVariables"
    behavior: >
      `decode(source)` first deletes every existing field, splits on `&`, URL-decodes names
      and values, maps a segment without `=` to an empty string, ignores a segment beginning
      with `=`, and treats only the first `=` as the separator. Duplicate names overwrite
      earlier values; they do not create an array. `+` behavior follows
      `StringTools.urlDecode`.
    status: covered
    scenarios:
      - net/url-request:variables
      - net/url-types:variables

  - id: net.UV.tostring-std-string
    section: "URLVariables"
    behavior: >
      `toString()` enumerates fields in runtime reflection order (not a promised stable
      order), URL-encodes each name and `Std.string(value)`, joins pairs with `&`, and emits
      empty objects as `""`. A field whose name contains `[]` and whose value is an array uses
      the source's unusual `&amp;field=` separator between encoded elements.
    status: covered
    scenarios:
      - net/url-request:variables
      - net/url-types:variables

  - id: net.SOK.new-host-port-endian
    section: "Socket"
    behavior: >
      `new(host = null, port = 0)` initializes input/output ByteArrays, `endian = BIG_ENDIAN`,
      `objectEncoding = ByteArray.defaultObjectEncoding`, and `timeout = 20000` ms. A non-null
      host immediately calls `connect`.
    status: covered
    scenarios:
      - net/socket-basics:defaults

  - id: net.SOK.connect-host-port-event-connect
    section: "Socket"
    behavior: >
      `connect(host, port)` validates port range, replaces any previous connection/buffers,
      begins nonblocking connection, and later dispatches `Event.CONNECT`; invalid host/failed
      or timed-out connection dispatches `IOErrorEvent.IO_ERROR`. HTML5 uses Flight's
      WebSocket-shaped transport; native sys targets retain a raw Haxe TCP socket.
    status: covered
    scenarios:
      - net/socket-basics:constructorGuards
      - net/socket-basics:invalidPorts

  - id: net.SOK.connected-localaddress
    section: "Socket"
    behavior: >
      `connected` reflects established transport state. `localAddress`, `localPort`,
      `remoteAddress`, and `remotePort` come from the connected endpoint and return their
      platform defaults when unavailable. `timeout` governs connection establishment, not
      individual reads.
    status: covered
    scenarios:
      - net/socket-basics:defaults

  - id: net.SOK.incoming-bytes-append-to-the-input-buffer
    section: "Socket"
    behavior: >
      Incoming bytes append to the input buffer and dispatch `ProgressEvent.SOCKET_DATA` with
      `bytesLoaded` equal to the newly received count. `bytesAvailable` is unread input
      length; data remains until consumed. Remote close dispatches `Event.CLOSE`; I/O failure
      dispatches `ioError`.
    status: covered
    scenarios:
      - net/socket-basics:lifecycleAndUTF8

  - id: net.SOK.all-readboolean-readbyte-readbytes-readdouble-readfloat-readint
    section: "Socket"
    behavior: >
      All `readBoolean/readByte/readBytes/readDouble/readFloat/readInt/
      readMultiByte/readObject/readShort/readUnsignedByte/readUnsignedInt/
      readUnsignedShort/readUTF/readUTFBytes` methods delegate to the input ByteArray. They
      share its position, endian, EOF, character-set, and object encoding semantics.
    status: covered
    scenarios:
      - net/socket-basics:lifecycleAndUTF8

  - id: net.SOK.writeboolean-writebyte
    section: "Socket"
    behavior: >
      `writeBoolean`, `writeByte`, `writeBytes`, `writeDouble`, `writeFloat`, `writeInt`,
      `writeMultiByte`, `writeObject`, `writeShort`, `writeUnsignedInt`, `writeUTF`, and
      `writeUTFBytes` append to the output ByteArray without sending immediately.
      `bytesPending` is that queued byte count. `flush()` sends all queued bytes and clears
      the queue; it is a no-op when nothing is queued and fails according to the underlying
      invalid socket otherwise.
    status: covered
    scenarios:
      - net/socket-basics:lifecycleAndUTF8
      - net/socket-basics:disconnectedErrors

  - id: net.SOK.changing-endian-updates-both-existing-input-and
    section: "Socket"
    behavior: >
      Changing `endian` updates both existing input and output buffers. `objectEncoding` is
      consulted by `readObject/writeObject`; see the AMF gap in the utils specification.
    status: covered
    scenarios:
      - net/socket-basics:mutation

  - id: net.SOK.close-ioerror
    section: "Socket"
    behavior: >
      `close()` closes and cleans the transport and polling. Calling close on an
      invalid/already closed native socket may throw `IOError`, matching the 9.5.2
      implementation's platform-dependent path.
    status: covered
    scenarios:
      - net/socket-basics:disconnectedErrors

  - id: net.SOK.a-native-raw-tcp-flight-binding-is
    section: "Socket"
    behavior: >
      A native raw TCP Flight binding is not exposed, so sys targets retain `sys.net.Socket`;
      browsers necessarily use WebSocket framing. See **Raw TCP flight-hx binding on native
      hosts**.
    status: flight-gap
    gap: "Raw TCP flight-hx binding on native hosts"
    scenarios: []

  - id: net.XS.new-host-port-connected
    section: "XMLSocket"
    behavior: >
      `new(host = null, port = 80)` creates an internal Socket, registers forwarding
      listeners, initializes `connected = false`, and optionally begins connecting. `timeout`
      is copied to the Socket when connecting.
    status: covered
    scenarios:
      - net/xml-socket:defaults
      - net/xml-socket:mutation

  - id: net.XS.the-internal-connect-close-ioerror-securityerror-and
    section: "XMLSocket"
    behavior: >
      The internal `connect`, `close`, `ioError`, `securityError`, and `socketData` lifecycle
      is forwarded. Connect sets `connected = true`; close sets it false.
    status: covered
    scenarios:
      - net/xml-socket:defaults
      - net/xml-socket:disconnectedErrors

  - id: net.XS.send-object-std-string
    section: "XMLSocket"
    behavior: >
      `send(object)` writes `Std.string(object)` followed by one null byte and flushes.
      Incoming UTF-8 text is accumulated across packets, split at null delimiters, and each
      complete message dispatches `DataEvent.DATA`; delimiters are not included and an
      incomplete tail is retained.
    status: covered
    scenarios:
      - net/xml-socket:disconnectedErrors

  - id: net.XS.on-html5-this-framing-travels-over-websocket
    section: "XMLSocket"
    behavior: >
      On HTML5 this framing travels over WebSocket, not a traditional raw TCP XMLSocket
      server. See **XMLSocket servers on HTML5**.
    status: flight-gap
    gap: "Raw TCP flight-hx binding on native hosts"
    scenarios: []

  - id: net.DS.the-class-exists-only-for-non-html5
    section: "DatagramSocket"
    behavior: >
      The portable declaration is gated by `!flash && !html5`, not by `sys` itself.
      `isSupported` is true when `!js` and false on a JavaScript build that does not define
      `html5`; on HTML5 the class is absent, while AIR uses the Flash typedef. The actual
      implementation references sys UDP types and is usable on the non-JavaScript sys path.
      Flight has no UDP capability, so the adapter retains `sys.net.UdpSocket`; see **UDP
      datagram sockets**.
    status: flight-gap
    gap: "UDP datagram sockets"
    scenarios:
      - net/datagram-socket:isSupported

  - id: net.DS.new-bind-localport-localaddress
    section: "DatagramSocket"
    behavior: >
      `new()` creates a nonblocking unbound, unconnected UDP socket. `bind(localPort = 0,
      localAddress = "0.0.0.0")` synchronously validates the 0..65535 port, binds, fills
      `localAddress/localPort`, and sets `bound`. An unresolved address throws
      `ArgumentError`; bind failure follows the 9.5.2 close/error path.
    status: covered
    scenarios:
      - net/datagram-socket:constructionError

  - id: net.DS.connect-remoteaddress-remoteport-connected
    section: "DatagramSocket"
    behavior: >
      `connect(remoteAddress, remotePort)` establishes the UDP peer filter (and implicit
      binding where supported); it does not establish a reliable stream. `connected`,
      `remoteAddress`, and `remotePort` query the socket peer. The 9.5.2 code accidentally
      validates `localPort` rather than the supplied remote port before connecting; the
      adapter retains this quirk.
    status: covered
    scenarios:
      - net/surface:datagramSurface

  - id: net.DS.receive-datagramsocketdataevent-data
    section: "DatagramSocket"
    behavior: >
      `receive()` enables polling and returns immediately. Each datagram dispatches
      `DatagramSocketDataEvent.DATA` with source/destination address and port plus a ByteArray
      containing exactly that packet. Delivery order and loss are UDP-defined; no
      retransmission or segmentation is supplied.
    status: covered
    scenarios:
      - net/surface:datagramSurface

  - id: net.DS.send-bytes-offset-rangeerror
    section: "DatagramSocket"
    behavior: >
      `send(bytes, offset = 0, length = 0, address = null, port = 0)` sends the remaining
      bytes when length is zero. Bounds/port errors throw `RangeError`. A connected socket
      requires null destination; an unconnected socket requires an address/port. Conflicting
      use throws `IllegalOperationError` or `ArgumentError`; transport failures become
      `IOError`.
    status: covered
    scenarios:
      - net/datagram-socket:constructionError

  - id: net.DS.close-bound
    section: "DatagramSocket"
    behavior: >
      `close()` stops receive polling, unbinds/disconnects, sets `bound` false, and dispatches
      `Event.CLOSE`; repeated underlying close errors are swallowed.
    status: covered
    scenarios:
      - net/surface:datagramSurface

  - id: net.SS.serversocket-bind-port-address
    section: "ServerSocket and SecureSocket"
    behavior: >
      `ServerSocket` is non-HTML5 only. It begins unbound/not listening; `bind(port = 0,
      address = "0.0.0.0")` validates and records the chosen local endpoint, `listen(backlog =
      0)` begins nonblocking accepts (zero requests the platform maximum), and `close()`
      clears bound/listening state. Each accepted TCP client dispatches
      `ServerSocketConnectEvent.CONNECT` carrying an already connected OpenFL Socket. Invalid
      state/range/address produces the documented `IOError`, `RangeError`, or `ArgumentError`
      paths.
    status: covered
    scenarios:
      - net/surface:serverSocketSurface

  - id: net.SEC.securesocket-issupported
    section: "ServerSocket and SecureSocket"
    behavior: >
      `SecureSocket` extends Socket on every non-Flash target, using a native sys TLS socket
      when available. `isSupported` is exactly true on `sys` and false otherwise; construction
      itself throws `IllegalOperationError("Not supported")` when `!sys`. On sys, `connect`
      performs certificate validation before `Event.CONNECT`, otherwise emits `ioError`.
      `serverCertificate` converts the peer certificate's subject, issuer, and validity dates
      and throws on an invalid socket; `serverCertificateStatus` is `UNKNOWN`, then `TRUSTED`
      or `INVALID`. `addBinaryChainBuildingCertificate` unconditionally throws
      `ArgumentError("Not supported")` in the portable 9.5.2 implementation.
    status: covered
    scenarios:
      - net/surface:secureSocketSurface

  - id: net.SEC.unsupported-target-construction-and-status-boundaries
    section: "ServerSocket and SecureSocket"
    behavior: >
      The non-sys `SecureSocket` declaration can be referenced and reports
      `isSupported == false`, but `new SecureSocket()` throws before an instance is returned.
      On sys, a fresh instance reports certificate status UNKNOWN; `close()` does not reset a
      status already produced by a connection attempt, while the next `connect()` resets it
      to UNKNOWN before resolving the host. Invalid ports below zero or above 65535 throw
      `SecurityError` synchronously.
    status: missing
    notes: "Flash delegates to flash.net.SecureSocket; this missing entry covers the non-Flash sys versus non-sys compile/runtime split."
    scenarios: []

  - id: net.SS.target-availability-supported-and-listener-polling
    section: "ServerSocket and SecureSocket"
    behavior: >
      `ServerSocket` is declared under `!flash && !html5` and reports `isSupported == true`
      throughout that declaration; HTML5 has no class and AIR uses the Flash typedef. Its
      implementation relies on sys socket types. Adding a CONNECT listener installs its
      enter-frame accept poll, but removing any CONNECT listener removes that poll even when
      other CONNECT listeners remain. DatagramSocket has a different override: only the first
      DATA listener installs polling, and only removal of the last DATA listener removes it;
      `receive()` merely enables processing once that listener-driven poll runs.
    status: missing
    notes: "These non-Flash target gates and the two classes' distinct public listener override behaviors need compile/lifecycle fixtures."
    scenarios: []

  - id: net.FR.a-new-reference-has-null-creationdate-creator
    section: "FileReference"
    behavior: >
      A new reference has null `creationDate`, `creator`, `data`, `modificationDate`, `name`,
      `type`, and `extension`, with numeric `size` at its target default. Selection populates
      available name (`without directory`), dates, byte size, and dot-prefixed `type`;
      `extension` returns the suffix without a dot or null. Browser metadata may not provide
      creation separately, so 9.5.2 uses modification time for both.
    status: covered
    scenarios:
      - net/file-reference:initial

  - id: net.FR.browse-typefilter-filefilter
    section: "FileReference"
    behavior: >
      browse(typeFilter = null) clears prior selected data/path, converts FileFilter patterns,
      opens a single-select host dialog, returns true when that operation is accepted, then
      dispatches Event.SELECT or Event.CANCEL. On the comparison target, the executable 9.5.2
      and adapter no-host paths both return true without an immediate event.
    status: covered
    scenarios:
      - net/file-reference:browseWithFilter
      - net/file-reference:browseWithoutFilter

  - id: net.FR.load-data
    section: "FileReference"
    behavior: >
      `load()` reads the selected file into `data` as a ByteArray and dispatches
      `Event.COMPLETE`, or `IOErrorEvent.IO_ERROR` on an asynchronous browser/host failure.
      Despite the API prose, portable 9.5.2 does not dispatch `open` or `progress` for local
      load; the adapter matches this lifecycle.
    status: covered
    scenarios:
      - net/file-reference:referenceAfterOperations
      - net/file-reference:events

  - id: net.FR.save-data-defaultfilename-std-string
    section: "FileReference"
    behavior: >
      `save(data, defaultFileName = null)` ignores null data. ByteArray is written verbatim;
      all other data is `Std.string` UTF-8. The dialog dispatches cancel, or `select` after
      the user chooses a destination, followed by `complete` after the write. Host failure
      dispatches `ioError` in the adapter.
    status: covered
    scenarios:
      - net/file-reference:referenceAfterOperations
      - net/file-reference:events

  - id: net.FR.download-request-defaultfilename-open
    section: "FileReference"
    behavior: >
      `download(request, defaultFileName = null)` in 9.5.2 combines binary URLLoader and
      save-dialog lifecycles, forwarding `open/progress/ioError` and dispatching
      `select/cancel/complete`. The adapter immediately dispatches `ioError`; Flight cannot
      compose a cancellable request with a streamed save destination. See **FileReference
      network transfers and cancellation**.
    status: flight-gap
    gap: "FileReference network transfers and cancellation"
    scenarios: []

  - id: net.FR.upload-request-uploaddatafieldname-dataevent-upload
    section: "FileReference"
    behavior: >
      `upload(request, uploadDataFieldName = "Filedata", testUpload = false)` in 9.5.2 reads
      the selected file, rewrites the request as multipart POST, forwards
      open/progress/response/error, maps HTTP 200 to complete, and emits
      `DataEvent.UPLOAD_COMPLETE_DATA` with the response. The adapter immediately emits
      `ioError`; Flight lacks this multipart/cancellation workflow. `testUpload` is ignored by
      portable 9.5.2.
    status: flight-gap
    gap: "FileReference network transfers and cancellation"
    scenarios:
      - net/file-reference:uploadWithoutSelectionDispatchedError

  - id: net.FR.cancel-cancel
    section: "FileReference"
    behavior: >
      `cancel()` does not itself dispatch `cancel`. Portable 9.5.2 calls the active
      URLLoader's close; the adapter invalidates pending dialog/filesystem completions but
      cannot cancel the host operation. See the same gap.
    status: flight-gap
    gap: "FileReference network transfers and cancellation"
    scenarios: []

  - id: net.FR.filefilter-new-description-extension
    section: "FileReference"
    behavior: >
      `FileFilter.new(description, extension, macType = null)` simply stores its three mutable
      strings. Extension syntax can contain semicolon-separated patterns such as
      `*.png;*.jpg`; `macType` is legacy metadata.
    status: covered
    scenarios:
      - net/file-reference:filter
      - net/file-reference:defaultFilter

  - id: net.FRL.new-browse-typefilter
    section: "FileReferenceList"
    behavior: >
      `new()` has no selection. `browse(typeFilter = null)` replaces `fileList` with a fresh
      array, opens a multi-select dialog, returns true when accepted, and dispatches cancel or
      one select after all references and available metadata are ready. Every selected item is
      a separate FileReference; callers must upload/load them individually.
    status: covered
    scenarios:
      - net/file-reference:list

  - id: net.FRL.unsupported-target-return-behavior-has-the-same
    section: "FileReferenceList"
    behavior: >
      The no-host path returns true, replaces fileList with an empty array, and emits no
      immediate event on both the executable 9.5.2 comparison target and the adapter. Host
      statistic failures dispatch ioError before any partial selection is exposed.
    status: covered
    scenarios:
      - net/file-reference:list

  - id: net.SO.getlocal-name-localpath
    section: "Shared objects"
    behavior: >
      `getLocal(name, localPath = null, secure = false)` validates that name is nonempty and
      excludes space and `~ % & \\ ; : \" ' , < > ? #`; failure throws Error #2134. It caches
      identity by `localPath + "/" + name`, so repeated calls return the same instance, loads
      persisted fields into dynamic `data`, and initializes `client = this`, `fps = 0`, and
      `objectEncoding` from the current static `defaultObjectEncoding`. `secure` is ignored.
    status: covered
    scenarios:
      - net/shared-object:identity
      - net/shared-object:invalidNamesRejected

  - id: net.SO.data-clear
    section: "Shared objects"
    behavior: >
      `data` is an ordinary dynamic object. Direct field reads/writes are retained until
      `clear` or process/object loss. `setProperty(name, value = null)` sets a field;
      `setDirty(name)` is a no-op because the local format serializes the entire object.
    status: covered
    scenarios:
      - net/shared-object:populated
      - net/shared-object:nullProperty

  - id: net.SO.size-objectencoding
    section: "Shared objects"
    behavior: >
      `size` is the encoded byte count of current data, or zero if serialization fails. The
      portable implementation uses Haxe serialization, regardless of the public
      `objectEncoding` value.
    status: covered
    scenarios:
      - net/shared-object:populated

  - id: net.SO.flush-mindiskspace-flushed
    section: "Shared objects"
    behavior: >
      `flush(minDiskSpace = 0)` returns `FLUSHED` for empty data or a successful local write.
      `minDiskSpace` is ignored. The Flight adapter returns `PENDING` if host persistence
      rejects/fails while retaining a process-local copy; 9.5.2's native file path normally
      reports `FLUSHED`.
    status: covered
    scenarios:
      - net/shared-object:emptyFlush
      - net/shared-object:populated

  - id: net.SO.there-is-no-quota-prompt-and-no
    section: "Shared objects"
    behavior: >
      There is no quota prompt and no later `NetStatusEvent` resolving a pending flush; see
      **SharedObject quota prompts and remote synchronization**.
    status: flight-gap
    gap: "SharedObject quota prompts and remote synchronization"
    scenarios: []

  - id: net.SO.clear-data
    section: "Shared objects"
    behavior: >
      `clear()` replaces `data` with a fresh empty object and deletes the persisted value.
      Existing external references to the previous data object do not become the new store.
      `close()` is a no-op.
    status: covered
    scenarios:
      - net/shared-object:populated
      - net/shared-object:nullProperty

  - id: net.SO.non-strict-getremote-returns-null-connect-send
    section: "Shared objects"
    behavior: >
      Non-strict `getRemote()` returns null; `connect`, `send`, and `setDirty` are no-op
      stubs. Portable 9.5.2 provides no remote synchronization, and Flight has no replacement.
      The documented `netStatus`, `asyncError`, and `sync` lifecycles therefore never occur
      for this implementation.
    status: flight-gap
    gap: "SharedObject quota prompts and remote synchronization"
    scenarios:
      - net/shared-object:mutations

  - id: net.SO.sharedobjectflushstatus-flushed
    section: "Shared objects"
    behavior: >
      `SharedObjectFlushStatus` is integer-backed as FLUSHED/PENDING = 0/1 on every
      non-`openfljs` portable target, with canonical string conversions; on `openfljs` the
      constants are `"flushed"` and `"pending"`. `SharedObject.defaultObjectEncoding` is
      mutable and defaults to `HXSF` off Flash.
    status: covered
    scenarios:
      - net/shared-object:defaults
      - net/shared-object:inheritedEncoding

  - id: net.NC.the-portable-class-exposes-only-new-and
    section: "NetConnection"
    behavior: >
      The portable class exposes only `new()` and `connect(command, p1..p5)`. `connect(null)`
      synchronously dispatches a non-bubbling, cancelable `NetStatusEvent.NET_STATUS` whose
      `info.code` is `"NetConnection.Connect.Success"`; any non-null command throws the string
      `Error: Can only connect in "HTTP streaming" mode`. Optional arguments are ignored.
    status: covered
    scenarios:
      - net/surface:netConnection

  - id: net.NC.the-executable-portable-surface-has-no-close
    section: "NetConnection"
    behavior: >
      The executable portable surface has no `close`, `call`, `client`, `connected`,
      `connectedProxyType`, `defaultObjectEncoding`, `objectEncoding`, `proxyType`, `uri`, or
      `usingTLS`; these are commented declarations and exist only through the Flash typedef.
      The current source intentionally matches this limited 9.5.2 surface.
    status: covered
    scenarios:
      - net/surface:netConnection

  - id: net.NC.responder-new-result-status-netconnection-call
    section: "NetConnection"
    behavior: >
      `Responder.new(result, status = null)` stores the callbacks privately for a Flash-style
      `NetConnection.call`, but the portable NetConnection has no call method and never
      invokes them.
    status: covered
    scenarios:
      - net/surface:responder

  - id: net.NS.new-connection-peerid-peerid
    section: "NetStream"
    behavior: >
      `new(connection, peerID = null)` stores the connection and a default SoundTransform. On
      HTML5 it creates an anonymous, inline/cross-origin video element and attaches media
      callbacks; other targets create no decoder. `peerID` is ignored.
    status: covered
    scenarios:
      - net/surface:netStream

  - id: net.NS.portable-public-state-consists-of-mutable-default
    section: "NetStream"
    behavior: >
      Portable public state consists of mutable/default fields `bufferTime`,
      `checkPolicyFile`, and `client`; read-only-by-convention fields `audioCodec`,
      `bufferLength`, `bytesLoaded`, `bytesTotal`, `currentFPS`, `decodedFrames`, `liveDelay`,
      `objectEncoding`, `time`, and the source's misspelled `videoCode`; plus get/set
      `soundTransform` and `speed`. Unassigned numeric fields remain zero, not the richer
      values promised by the Flash prose.
    status: covered
    scenarios:
      - net/surface:netStream

  - id: net.NS.play-url-p1-src
    section: "NetStream"
    behavior: >
      `play(url, p1..p5)` is functional only on HTML5: it applies global times local volume,
      assigns a string to video `src` or another value to `srcObject`, and calls play. Extra
      arguments are ignored. Other targets do nothing.
    status: covered
    scenarios:
      - net/surface:netStream

  - id: net.NS.cross-target-decoding-frame-delivery-is-unavailable
    section: "NetStream"
    behavior: >
      Cross-target decoding/frame delivery is unavailable; see **Cross-target NetStream video
      source**.
    status: flight-gap
    gap: "Cross-target NetStream video source"
    scenarios: []

  - id: net.NS.pause-resume
    section: "NetStream"
    behavior: >
      `pause()` pauses, `resume()` plays, and `togglePause()` switches the element state on
      HTML5; all are no-ops elsewhere. `seek(seconds)` clamps to `[0, duration]`, dispatches
      `NetStream.SeekStart.Notify`, assigns currentTime, and the later seeking callback
      dispatches `NetStream.Seek.Complete`.
    status: covered
    scenarios:
      - net/surface:netStream

  - id: net.NS.close-src
    section: "NetStream"
    behavior: >
      `close()` pauses, clears `src`, marks closed, and resets `time` to zero on HTML5, but
      preserves the element/current frame object. `dispose()` calls close then releases the
      element, causing attached video to go blank.
    status: covered
    scenarios:
      - net/surface:netStream

  - id: net.NS.requestvideostatus-client-onplaystatus
    section: "NetStream"
    behavior: >
      `requestVideoStatus()` asynchronously invokes `client.onPlayStatus` with
      `NetStream.Play.pause` or `.playing` when an HTML element exists.
    status: covered
    scenarios:
      - net/surface:netStream

  - id: net.NS.soundtransform-speed
    section: "NetStream"
    behavior: >
      `soundTransform` getter returns a clone; assigning non-null copies only pan and volume
      and immediately updates HTML media volume. Pan is not applied. `speed` gets/sets HTML
      `playbackRate`, or reads `1` and discards writes on other targets.
    status: covered
    scenarios:
      - net/surface:netStream

  - id: net.NS.html-callbacks-dispatch-netstatusevent-codes-to-both
    section: "NetStream"
    behavior: >
      HTML callbacks dispatch NetStatusEvent codes to both the connection and stream: playing
      -> `NetStream.Play.Start`; ended -> `NetStream.Play.Stop` then
      `NetStream.Play.Complete`; media error -> `NetStream.Play.Stop`; seeking completion ->
      `NetStream.Seek.Complete`. The same callbacks attempt `client.onPlayStatus`
      notifications for loadstart, waiting, stalled, canplay, canplaythrough, durationchange,
      pause, playing, seeking, timeupdate, error, and complete. `loadedmetadata` calls
      `client.onMetaData` with width, height, and duration. Missing handlers and exceptions
      are swallowed.
    status: covered
    scenarios:
      - net/surface:netStream

  - id: net.NS.appendbytes-appendbytesaction
    section: "NetStream"
    behavior: >
      `appendBytes`, `appendBytesAction`, `publish`, attach camera/audio, server streaming,
      and related status codes are all enclosed in `#if false` in non-Flash 9.5.2. They are
      Flash-only and absent from the adapter. There is no portable `audioCodec`/`videoCodec`
      discovery; note that 9.5.2 spells the latter field `videoCode`.
    status: covered
    scenarios:
      - net/surface:netStream

  - id: net.OE.objectencoding-amf0
    section: "Encoding and small value contracts"
    behavior: >
      `ObjectEncoding` integer values are `AMF0=0`, `AMF3=3`, `HXSF=10`, `LARGE_HXSF=11`,
      `JSON=12`, `LARGE_JSON=13`; `DEFAULT` is AMF3 on Flash and HXSF elsewhere.
      `dynamicPropertyWriter` is a mutable static hook, though the current ByteArray AMF
      implementation cannot consume it.
    status: covered
    scenarios:
      - net/surface:encoding

  - id: net.IDP.idynamicpropertyoutput-writedynamicproperty-name-value-idynamicpropertywriter-writedynamicproperties
    section: "Encoding and small value contracts"
    behavior: >
      `IDynamicPropertyOutput.writeDynamicProperty(name,value)` is the sink contract used by
      `IDynamicPropertyWriter.writeDynamicProperties(obj,output)`; the interfaces impose no
      ordering or storage themselves.
    status: covered
    scenarios:
      - net/surface:dynamicProperties

  - id: net.IPV.ipversion-ipv4
    section: "Encoding and small value contracts"
    behavior: >
      `IPVersion` is integer-backed as IPV4/IPV6 = 0/1 on the non-`openfljs` portable branch,
      with canonical `"IPv4"`/`"IPv6"` conversions; on `openfljs` the constants are those
      strings directly. These are selectors only; socket address-family validation remains a
      transport concern.
    status: covered
    scenarios:
      - net/surface:ipVersion

  - id: net.TYPE.filereferencelist-and-ipversion-target-availability
    section: "Encoding and small value contracts"
    behavior: >
      Portable `FileReferenceList` is declared only by its `desktop` branch or its fallback
      `js` branch; on a non-Flash target with neither define the file declares no type. The
      desktop implementation uses native file dialogs/stat metadata, while the JavaScript
      implementation uses an HTML file input when available. `IPVersion` is separately gated
      to non-Flash `sys` (subject to its documentation flags), and otherwise exists only as
      an AIR typedef; non-sys portable targets have no `IPVersion` declaration.
    status: missing
    notes: "Flash typedefs FileReferenceList unconditionally; IPVersion's Flash typedef is AIR-only. Compile-surface checks are needed for all branches."
    scenarios: []

  - id: net.DNS.target-availability-and-resolver-stub
    section: "Uncovered openfl.net.dns package"
    behavior: >
      All seven `openfl.net.dns` types are declared only under `!flash && sys &&
      (!flash_doc_gen || air_doc_gen)`; the fallback supplies AIR typedefs, and non-sys
      portable targets expose no DNS types. Portable `DNSResolver.isSupported` always returns
      false. Its constructor calls EventDispatcher construction and then always throws
      `IllegalOperationError("Not supported")`; `lookup(host,recordType)` has an empty body,
      and ordinary public code cannot reach it because no resolver instance can be created.
    status: missing
    notes: "Compile and exception coverage is required for the non-Flash sys stub, non-sys absence, and AIR typedef paths."
    scenarios: []

  - id: net.DNS.basic-resource-record-fields-and-defaults
    section: "Uncovered openfl.net.dns package"
    behavior: >
      `ResourceRecord` has a private empty constructor plus mutable `name:String` and
      `ttl:Int` fields. Public `ARecord` and `AAAARecord` constructors call that base and add
      mutable `address:String`; `PTRRecord` similarly adds mutable `ptrdName:String`.
      Construction leaves all String fields null and `ttl` at zero, and every field accepts
      later assignment without validation, address-family checking, or TTL bounds.
    status: missing
    notes: "These concrete record constructors exist only on the non-Flash sys stub; AIR supplies native typedefs."
    scenarios: []

  - id: net.DNS.mx-and-srv-resource-record-fields-and-defaults
    section: "Uncovered openfl.net.dns package"
    behavior: >
      `MXRecord.new()` exposes mutable `exchange:String` and `preference:Int` in addition to
      inherited `name`/`ttl`; `SRVRecord.new()` exposes mutable `port:Int`, `priority:Int`,
      `target:String`, and `weight:Int`. Their constructors only call the empty base
      constructor, so String fields start null and Int fields start zero. The portable value
      objects do not enforce valid ports, non-negative priority/weight, or DNS name syntax.
    status: missing
    notes: "Non-Flash sys stub behavior; the AIR typedef can have native population rules."
    scenarios: []
