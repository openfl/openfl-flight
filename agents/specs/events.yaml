  - id: events.EV.constants-event-phase-and-event-type-contract
    section: Event public surface > Constants and type contracts
    behavior: >-
      Every Event and event-subclass constant must retain its exact 9.5.2 string and EventType
      subtype; EventPhase is CAPTURING_PHASE = 1, AT_TARGET = 2, and BUBBLING_PHASE = 3. EventType
      is a String abstract with implicit String conversions and String equality/inequality
      operators. In particular, GeolocationEvent.UPDATE has the source's unusual
