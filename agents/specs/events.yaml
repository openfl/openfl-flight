package: events

entries:

  # ── EventDispatcher core > Listener registration ──

  - id: events.ED.listener-identity
    section: EventDispatcher core > Listener registration
    behavior: >
      Listener identity is (type, callback, useCapture). Adding the same
      identity twice is a no-op, even when the second call supplies a
      different priority or weak-reference flag.
    status: covered
    scenarios:
      - events/dispatcher:listenerIdentity

  - id: events.ED.capture-distinct
    section: EventDispatcher core > Listener registration
    behavior: >
      Capture and non-capture registrations are distinct. The same callback
      may be registered once for each, and removal must use the matching
      useCapture value.
    status: covered
    scenarios:
      - events/dispatcher-capture:captureDistinct

  - id: events.ED.priority-order
    section: EventDispatcher core > Listener registration
    behavior: >
      Priority is descending signed Int; equal-priority listeners retain
      insertion order. Changing priority requires remove then add.
    status: covered
    scenarios:
      - events/dispatcher:priority

  - id: events.ED.capture-phase-only
    section: EventDispatcher core > Listener registration
    behavior: >
      Capture listeners run only in CAPTURING_PHASE; they do not run on the
      target. Non-capture listeners run at the target and during bubbling.
      A plain EventDispatcher dispatch starts at AT_TARGET, so its capture
      listeners do not run.
    status: covered
    scenarios:
      - events/dispatcher-capture:capturePhaseOnly

  - id: events.ED.null-listener-noop
    section: EventDispatcher core > Listener registration
    behavior: >
      Adding or removing a null listener is a no-op.
    status: covered
    scenarios:
      - events/dispatcher-capture:nullListener

  - id: events.ED.remove-matching
    section: EventDispatcher core > Listener registration
    behavior: >
      removeEventListener ignores priority and removes at most the one
      registration matching callback plus capture flag. Removing the final
      listener also removes the type bucket.
    status: covered
    scenarios:
      - events/dispatcher:removeMatching

  - id: events.ED.has-local
    section: EventDispatcher core > Listener registration
    behavior: >
      hasEventListener is local and true for either capture or non-capture
      registrations.
    status: covered
    scenarios:
      - events/dispatcher:hasEventListener

  - id: events.ED.weak-js-only
    section: EventDispatcher core > Listener registration
    behavior: >
      Weak callbacks are weak only on JS/HTML5 when JavaScript WeakRef
      exists. Other non-Flash targets retain a strong callback. A collected
      callback is removed lazily while dispatching; before that cleanup the
      type bucket can still make hasEventListener true.
    status: covered
    scenarios:
      - events/dispatcher-capture:weakReferenceFallback

  - id: events.ED.will-trigger-deviation
    section: EventDispatcher core > Listener registration
    behavior: >
      OpenFL 9.5.2 source implements willTrigger(type) as local
      hasEventListener(type), despite documentation promising an ancestor
      search. The adapter deliberately searches DisplayObject ancestors.
    status: deviation
    notes: >
      Intentional project decision: adapter follows documented behavior
      (ancestor search) rather than 9.5.2 source behavior (local-only).
      Recorded by events/dispatcher-capture fixture.
    scenarios:
      - events/dispatcher-capture:willTrigger

  # ── EventDispatcher core > Mutation and reentrancy ──

  - id: events.ED.add-during-dispatch-snapshot
    section: EventDispatcher core > Mutation and reentrancy
    behavior: >
      Adding a listener while an iterator for that type is active snapshots
      the active frame first. The new listener is excluded from that phase
      but is available to a later phase or a nested dispatch.
    status: covered
    scenarios:
      - events/dispatcher:mutationAdd

  - id: events.ED.remove-not-yet-visited
    section: EventDispatcher core > Mutation and reentrancy
    behavior: >
      Removing a not-yet-visited listener during dispatch suppresses it in
      the active frame. Removing an already-visited listener adjusts the
      live iterator so the following listener is not skipped.
    status: covered
    scenarios:
      - events/dispatcher:mutationRemove

  - id: events.ED.nested-same-type
    section: EventDispatcher core > Mutation and reentrancy
    behavior: >
      A nested dispatch of the same type gets a separate iterator. It
      observes the then-current live registry without corrupting the outer
      iterator. The existing mutation fixture records the sequence a(abc)c.
    status: covered
    scenarios:
      - events/dispatcher:mutationNested

  - id: events.ED.remove-readd-during-dispatch
    section: EventDispatcher core > Mutation and reentrancy
    behavior: >
      Duplicate detection still applies during dispatch. Remove then re-add
      creates a new registration at its priority position and does not
      restore it to the active snapshot.
    status: covered
    scenarios:
      - events/dispatcher-capture:removeReaddDuringDispatch

  - id: events.ED.mutation-safe-signal
    section: EventDispatcher core > Mutation and reentrancy
    behavior: >
      Replacing the adapter-owned DispatchIterator with Flight signals
      while retaining snapshot, skip, and nested-dispatch guarantees
      requires a mutation-safe, per-emission Flight signal frame.
    status: flight-gap
    gap: "Signals: mutation-safe iteration during emit"
    scenarios: []

  # ── EventDispatcher core > Targeting, phases, cancellation ──

  - id: events.ED.aggregate-target
    section: EventDispatcher core > Targeting and phases
    behavior: >
      A generic dispatcher uses its optional aggregate object as
      event.target; event.currentTarget remains the dispatcher actually
      invoking the listener.
    status: covered
    scenarios:
      - events/dispatcher:aggregateTarget

  - id: events.ED.capture-bubble-order
    section: EventDispatcher core > Targeting and phases
    behavior: >
      Programmatic display dispatch snapshots the ancestor chain before
      capture, visits root to immediate parent, visits only non-capture
      listeners at the target, then (when bubbles) recurses immediate
      parent to root.
    status: covered
    scenarios:
      - events/dispatcher-capture:captureBubbleOrder

  - id: events.ED.reparent-during-capture
    section: EventDispatcher core > Targeting and phases
    behavior: >
      Reparenting during capture does not change the capture stack. Bubbling
      is less static: each node caches its immediate parent before invoking
      its own listeners, then calls that cached parent.
    status: covered
    scenarios:
      - events/dispatcher-capture:reparentDuringCapture

  - id: events.ED.capture-without-bubbles
    section: EventDispatcher core > Targeting and phases
    behavior: >
      Capture occurs even when bubbles == false; that flag suppresses only
      the upward bubbling phase.
    status: covered
    scenarios:
      - events/dispatcher-capture:captureNoBubble

  - id: events.ED.target-currentTarget-stable
    section: EventDispatcher core > Targeting and phases
    behavior: >
      target is stable for the normal route. currentTarget changes only
      when a dispatcher invokes listeners, and eventPhase is capture,
      target, or bubble for that invocation. These values are not reset
      after dispatch.
    status: covered
    scenarios:
      - events/dispatcher-capture:postDispatchState

  - id: events.ED.stop-propagation-capture-quirk
    section: EventDispatcher core > Cancellation
    behavior: >
      stopPropagation lets all listeners on the current node finish and
      prevents the later bubble route. In programmatic DisplayObject
      capture, however, the per-node cancellation result is ignored: later
      capture ancestors and the target still run, after which bubbling is
      suppressed. This is an OpenFL 9.5.2 source quirk.
    status: covered
    scenarios:
      - events/dispatcher-capture:stopPropagationDuringCapture

  - id: events.ED.stop-immediate
    section: EventDispatcher core > Cancellation
    behavior: >
      stopImmediatePropagation sets both cancellation flags and stops the
      remaining listeners on the current node. The flags persist for the
      Event instance; reusing a stopped Event does not reset them.
    status: covered
    scenarios:
      - events/dispatcher-capture:stopImmediatePropagation

  - id: events.ED.prevent-default
    section: EventDispatcher core > Cancellation
    behavior: >
      preventDefault changes state only when cancelable is true and does
      not stop propagation. A target/capture prevention makes the outer
      dispatch result false.
    status: covered
    scenarios:
      - events/propagation:preventDefault

  - id: events.ED.bubble-prevent-ignored
    section: EventDispatcher core > Cancellation
    behavior: >
      A bubble ancestor's preventDefault updates the Event, but the
      DisplayObject bubble recursion ignores the ancestor's return value.
      The original target dispatch can therefore return true even though the
      Event is default-prevented afterward.
    status: covered
    scenarios:
      - events/dispatcher-capture:bubblePreventDefault

  - id: events.ED.redispatch-no-clone
    section: EventDispatcher core > Cancellation
    behavior: >
      Public redispatch does not clone an already-targeted Event despite API
      documentation. Both generic and DisplayObject dispatch overwrite
      target and reuse the same instance; cancellation/default state also
      carries into the new dispatch.
    status: covered
    scenarios:
      - events/redispatch:redispatchNoClone

  - id: events.ED.mouse-stagexY-recompute
    section: EventDispatcher core > Targeting and phases
    behavior: >
      Programmatically dispatching a MouseEvent or TouchEvent from a
      DisplayObject recomputes stageX/stageY from that object's local
      coordinates before routing.
    status: covered
    scenarios:
      - ui/mouse:mouseEvent

  - id: events.ED.null-event-dispatch
    section: EventDispatcher core > Targeting and phases
    behavior: >
      DisplayObject.dispatchEvent(null) and generic EventDispatcher dispatch
      both dereference null and fail before reaching the private null guard.
    status: covered
    scenarios:
      - events/dispatcher-capture:nullDispatch

  - id: events.ED.uncaught-error-boundary
    section: EventDispatcher core > Cancellation
    behavior: >
      When Stage uncaught-error handling is enabled, OpenFL catches listener
      failures (except an UncaughtErrorEvent loop) and forwards them through
      the Stage error handler. The adapter lets them escape.
    status: flight-gap
    gap: Application event-error boundary
    scenarios: []

  # ── Native Stage router ──

  - id: events.STG.dispatch-stack-router
    section: Native Stage router
    behavior: >
      OpenFL Stage.__dispatchStack uses a stack ordered root through target,
      assigns target from the last element, and checks propagation
      cancellation between every capture and bubble node.
    status: covered
    scenarios:
      - integration/display-events:stageDispatchStack

  - id: events.STG.native-uses-programmatic
    section: Native Stage router
    behavior: >
      Native mouse and keyboard handlers route through __dispatchStack,
      selecting the stricter Stage behavior with propagation cancellation
      checked between every capture and bubble node.
    status: covered
    scenarios:
      - integration/display-events:nativeKeyboardRouter

  # ── Remaining checklist-events.md sections 2 through 7 ──

  - id: events.ME.open-fl-walks-child-arrays-highest-index
    section: "Mouse event dispatch > Hit testing and target selection"
    behavior: >
      OpenFL walks child arrays from highest index to zero, so visually frontmost
      children are considered first. The adapter's getObjectsUnderPoint collection
      also descends from highest index and returns front-to-back results.
    status: covered
    scenarios:
      - "display/hit-test:objects"
      - "display/container:objectsUnderPoint"

  - id: events.ME.basic-mouse-enabled-mouse-children-targeting-represented
    section: "Mouse event dispatch > Hit testing and target selection"
    behavior: >
      Basic mouseEnabled/mouseChildren targeting is represented: a disabled leaf
      can fall back to an enabled ancestor, and mouseChildren == false makes the
      enabled container the target. If both container flags disable interaction,
      the hit falls through. The cross-package display/events fixture covers the
      expected flag combinations, although it does not invoke the native Stage
      handler itself.
    status: covered
    scenarios:
      - "integration/display-events:mouseTargeting"
      - "display/hit-test:mouseEnabled"

  - id: events.ME.open-fl-performs-those-checks-during-one
    section: "Mouse event dispatch > Hit testing and target selection"
    behavior: >
      OpenFL performs those checks during one recursive hit walk, including masks,
      scroll rectangles, Sprite hitArea, visibility, and non-interactive
      descendants. The adapter first calls getObjectsUnderPoint and resolves flags
      afterward. Stage now performs a single recursive interactive walk so masks,
      scroll rectangles, hit areas, visibility, mouseChildren, and non-interactive
      descendants participate in target resolution together.
    status: covered
    scenarios:
      - "events/advanced:mouseHitTesting"

  - id: events.ME.if-no-interactive-display-object-hit-stage
    section: "Mouse event dispatch > Hit testing and target selection"
    behavior: >
      If no interactive display object is hit, Stage is the fallback target and
      the stack is [stage].
    status: covered
    scenarios:
      - "events/advanced:mouseRoute"

  - id: events.ME.open-fl-transforms-window-coordinates-through-stage
    section: "Mouse event dispatch > Hit testing and target selection"
    behavior: >
      OpenFL transforms window coordinates through Stage's inverse display matrix
      before hit testing (scale mode, alignment, DPI). The resulting logical
      coordinates drive both hit selection and stageX/stageY.
    status: covered
    scenarios:
      - "events/advanced:mouseRoute"

  - id: events.ME.raw-stage-mouse-event-local-x-local
    section: "Mouse event dispatch > Raw mouse fields and route"
    behavior: >
      For a raw Stage mouse event, localX/localY are computed once in the selected
      target's coordinate space. They remain target-local while ancestors receive
      the event; currentTarget does not cause coordinate recomputation.
    status: covered
    scenarios:
      - "events/advanced:mouseRoute"

  - id: events.ME.supplies-local-x-local-y-stage-x
    section: "Mouse event dispatch > Raw mouse fields and route"
    behavior: >
      Raw Stage mouse events supply localX/localY, stageX/stageY, primary
      buttonDown, modifier keys with command/control distinctions, and the native
      clickCount for down/up events.
    status: covered
    scenarios:
      - "events/advanced:mouseRoute"

  - id: events.ME.only-mouse-down-move-up-wired-current
    section: "Mouse event dispatch > Raw mouse fields and route"
    behavior: >
      Stage wires down, move, up, wheel, relative-motion, leave, and resize
      signals. It coalesces moves, resolves cursors, cancels disabled context-menu
      defaults, dispatches wheel/leave events, and handles release-outside; the
      upstream relative-motion callback intentionally remains a no-op.
    status: covered
    scenarios:
      - "events/advanced:mousePendingAndWheel"

  - id: events.ME.open-fl-can-cancel-originating-lime-signal
    section: "Mouse event dispatch > Raw mouse fields and route"
    behavior: >
      OpenFL can cancel the originating Lime signal after a cancelable event is
      default-prevented. Flight DOM input currently decides preventDefault before
      emitting and exposes no deferred native-default callback; see
      agents/flight-upstream.md, “Input: dynamic preventDefault support.”
    status: flight-gap
    gap: "Event system bridging"
    scenarios: []

  - id: events.ME.open-fl-remembers-down-target-separately-left
    section: "Mouse event dispatch > Click and double-click synthesis"
    behavior: >
      OpenFL remembers the down target separately for left, middle, and right
      buttons. Up on the same target generates CLICK, MIDDLE_CLICK, or
      RIGHT_CLICK; left up elsewhere dispatches RELEASE_OUTSIDE to the original
      down target. The adapter generates none of these. Flight Interaction owns
      this state but lacks the required one-shot pre-bubble ingress hook.
    status: flight-gap
    gap: "Event system bridging"
    scenarios: []

  - id: events.ME.left-double-click-requires-target-double-click
    section: "Mouse event dispatch > Click and double-click synthesis"
    behavior: >
      Left double-click requires target.doubleClickEnabled, the same target as the
      previous click, and elapsed time strictly below 500 ms. There is no
      coordinate-distance threshold. A successful double-click clears the stored
      target/time; a non-enabled target also clears them. Flight has no per-node
      equivalent for doubleClickEnabled, and resolved interaction ingress remains
      unavailable.
    status: flight-gap
    gap: "Per-object interaction metadata"
    scenarios: []

  - id: events.ME.lime-raw-down-up-events-may-receive
    section: "Mouse event dispatch > Click and double-click synthesis"
    behavior: >
      On Lime 8.1+, raw down/up events may receive window.clickCount; synthesized
      click/double-click events in this source are created with clickCount == 0.
      Stage carries the Window count only on the raw event.
    status: covered
    scenarios:
      - "events/advanced:mouseRoute"

  - id: events.ME.open-fl-dispatch-order-original-down-up
    section: "Mouse event dispatch > Click and double-click synthesis"
    behavior: >
      OpenFL dispatch order is the original down/up/move event first, then any
      synthesized click, then hover-transition events.
    status: covered
    scenarios:
      - "events/advanced:mouseRoute"
      - "events/advanced:mouseTransitions"

  - id: events.ME.hit-target-changes-open-fl-dispatches-bubbling
    section: "Mouse event dispatch > Over/out and roll transitions"
    behavior: >
      When the hit target changes, OpenFL dispatches bubbling MOUSE_OUT on the old
      stack, direct non-bubbling ROLL_OUT on departed stack members, direct
      non-bubbling ROLL_OVER on newly entered members, then bubbling MOUSE_OVER on
      the new stack. The explicit source comment requires MOUSE_OVER after
      ROLL_OVER. None of this state or dispatch exists in the adapter; Flight's
      direct roll signals cannot be observed exactly once through its current
      bubble-only API.
    status: flight-gap
    gap: "Event system bridging"
    scenarios: []

  - id: events.ME.source-semantics-distinguish-transitions-over-out-propagate
    section: "Mouse event dispatch > Over/out and roll transitions"
    behavior: >
      Source semantics distinguish the transitions: MOUSE_OVER/MOUSE_OUT propagate
      through the Stage stack; ROLL_OVER/ROLL_OUT target each changed object
      directly with bubbles == false.
    status: covered
    scenarios:
      - "events/advanced:mouseTransitions"

  - id: events.ME.generated-over-out-events-leave-related-object
    section: "Mouse event dispatch > Over/out and roll transitions"
    behavior: >
      Generated over/out events leave relatedObject null in the 9.5.2 source.
      Roll-event localX/localY are computed in the old/new leaf target's space
      even when the roll event targets an ancestor.
    status: covered
    scenarios:
      - "events/advanced:mouseTransitions"

  - id: events.ME.open-fl-rechecks-existing-hover-target-pending
    section: "Mouse event dispatch > Over/out and roll transitions"
    behavior: >
      OpenFL rechecks an existing hover target on pending mouse processing when it
      is transformed, removed, hidden, disabled, or placed below an ancestor whose
      mouseChildren becomes false. Pending processing re-runs hit selection even
      without a new native move so transition events remain accurate.
    status: covered
    scenarios:
      - "events/advanced:mousePendingAndWheel"

  - id: events.KE.open-fl-targets-keyboard-input-stage-focus
    section: "Keyboard and text input dispatch"
    behavior: >
      OpenFL targets keyboard input at Stage.focus when non-null and at Stage
      otherwise. There is no separate focusManager field in the 9.5.2 Stage
      source. The adapter uses the same focus-or-Stage choice.
    status: covered
    scenarios:
      - "events/advanced:keyboard"

  - id: events.KE.down-up-constructed-bubbles-true-cancelable-true
    section: "Keyboard and text input dispatch"
    behavior: >
      KEY_DOWN and KEY_UP are constructed with bubbles == true and cancelable ==
      true in this source, despite an adjacent source comment about Flash Player
      events. Character code, converted key code, and key location are derived
      before routing.
    status: covered
    scenarios:
      - "events/event-subclass-construction:keyboardEvent"
      - "ui/keyboard:keyboardEvent"

  - id: events.KE.does-not-reproduce-open-fl-s-mac
    section: "Keyboard and text input dispatch"
    behavior: >
      macOS control/command folding sets ctrlKey when either Control or Command
      is active, while preserving the raw controlKey and commandKey values. Key
      events route through the strict Stage stack.
    status: covered
    scenarios:
      - "events/advanced:keyboard"

  - id: events.KE.keyboard-event-default-prevented-open-fl-cancels
    section: "Keyboard and text input dispatch"
    behavior: >
      When a keyboard event is default-prevented, OpenFL cancels the matching Lime
      onKeyDown or onKeyUp signal, preventing the matching host default action.
    status: covered
    scenarios:
      - "events/advanced:keyboard"

  - id: events.KE.up-space-or-enter-synthesizes-mouse-click
    section: "Keyboard and text input dispatch"
    behavior: >
      On KEY_UP, Space or Enter synthesizes a mouse CLICK for a focused Sprite
      when buttonMode is true and focusRect == true. The click is dispatched
      before the KEY_UP event and uses the current Stage mouse coordinates.
    status: covered
    scenarios:
      - "events/advanced:keyboard"

  - id: events.KE.after-unprevented-down-open-fl-generates-bubbling
    section: "Keyboard and text input dispatch"
    behavior: >
      After an unprevented KEY_DOWN, OpenFL generates bubbling/cancelable COPY,
      CUT, PASTE, or SELECT_ALL events for the matching Ctrl/Command shortcut on a
      focused non-TextField. A prevented keyboard event suppresses this shortcut
      synthesis.
    status: covered
    scenarios:
      - "events/advanced:keyboard"

  - id: events.KE.input-not-synthesized-inside-key-open-fl
    section: "Keyboard and text input dispatch"
    behavior: >
      TEXT_INPUT is not synthesized inside __onKey; OpenFL receives the platform's
      separate text-input callback, constructs TextEvent(TEXT_INPUT, true, true,
      text), routes it to focus or Stage, and cancels the platform callback when
      prevented. The current Window exposes a text-input signal but Stage does not
      register or route it. The intended Flight architecture also lacks Stage
      ownership of a host-local InputManager; see agents/flight-gaps.md,
      “TextField and StageText host input ownership.”
    status: flight-gap
    gap: "TextField and StageText host input ownership"
    scenarios: []

  - id: events.FE.programmatically-changing-stage-focus-dispatches-out-old
    section: "Focus and tab behavior"
    behavior: >
      Programmatically changing Stage.focus dispatches FOCUS_OUT on the old object
      before FOCUS_IN on the new object. Both bubble, neither is cancelable, and
      both use the full display route in the normal case.
    status: covered
    scenarios:
      - "display/stage:focus"

  - id: events.FE.old-object-s-out-related-object-new
    section: "Focus and tab behavior"
    behavior: >
      The old object's FOCUS_OUT.relatedObject is the new focus; the new object's
      FOCUS_IN.relatedObject is the old focus. Clearing focus supplies null to the
      old object.
    status: covered
    scenarios:
      - "events/advanced:focusRoute"

  - id: events.FE.open-fl-routes-those-focus-events-through
    section: "Focus and tab behavior"
    behavior: >
      Focus changes route through Stage.__dispatchStack, so propagation
      cancellation is checked between capture nodes before the target.
    status: covered
    scenarios:
      - "events/advanced:focusRoute"

  - id: events.FE.mouse-down-focus-changes-first-send-bubbling
    section: "Focus and tab behavior"
    behavior: >
      Mouse-down focus changes first send a bubbling/cancelable MOUSE_FOCUS_CHANGE
      to the old focus with the proposed target as relatedObject. Only if it is
      not prevented does OpenFL apply the target's mouseEnabled && tabEnabled
      focus eligibility.
    status: covered
    scenarios:
      - "events/advanced:mouseRoute"

  - id: events.FE.tab-focus-changes-first-send-bubbling-cancelable
    section: "Focus and tab behavior"
    behavior: >
      Tab focus changes first send bubbling/cancelable KEY_FOCUS_CHANGE on the old
      focus with the proposed next object and Shift state. Preventing it retains
      focus and cancels the platform Tab.
    status: covered
    scenarios:
      - "events/advanced:keyboard"

  - id: events.FE.open-fl-gathers-tab-candidates-depth-first
    section: "Focus and tab behavior"
    behavior: >
      OpenFL gathers tab candidates depth-first in child-index order. A container
      contributes itself when tabEnabled, then descends only when tabChildren is
      true. MovieClip.enabled == false suppresses that subtree's candidate logic.
      MovieClip.enabled == false suppresses that subtree's candidate logic.
    status: covered
    scenarios:
      - "events/advanced:tabCandidates"

  - id: events.FE.candidates-sorted-ascending-tab-index-if-any
    section: "Focus and tab behavior"
    behavior: >
      Candidates are sorted by ascending tabIndex. If any nonnegative index
      exists, all -1 candidates are discarded. Forward/Shift-Tab traversal wraps,
      tries siblings when the current focus is outside the candidate list, and
      avoids selecting the current object again.
    status: covered
    scenarios:
      - "events/advanced:tabCandidates"
      - "events/advanced:keyboard"

  - id: events.FE.tab-index-state-validation-exist-means-unspecified
    section: "Focus and tab behavior"
    behavior: >
      tabIndex state and validation exist: -1 means unspecified and values below
      -1 throw. tabEnabled defaults false for a plain InteractiveObject; class
      overrides may opt in.
    status: covered
    scenarios:
      - "display/interactive-object:values"
      - "display/stage:defaults"

  - id: events.FE.activate-deactivate-independent-broadcast-events-not-substitutes
    section: "Focus and tab behavior"
    behavior: >
      ACTIVATE/DEACTIVATE are independent broadcast events, not substitutes for
      object FOCUS_IN/FOCUS_OUT. OpenFL broadcasts them on window focus in and
      focus out (and deactivates on close/module exit). Stage wires these Window
      signals separately from object FOCUS_IN/FOCUS_OUT changes.
    status: covered
    scenarios:
      - "events/advanced:windowFocus"

  - id: events.FE.open-fl-caches-focus-around-mobile-window
    section: "Focus and tab behavior"
    behavior: >
      OpenFL caches focus around mobile/window focus loss and may restore it on
      focus-in. Desktop focus loss retains the cache without automatically
      restoring object focus.
    status: covered
    scenarios:
      - "events/advanced:windowFocus"

  - id: events.STG.activate-deactivate-frame-constructed-frame-render-listeners
    section: "Frame and render broadcasts"
    behavior: >
      ACTIVATE, DEACTIVATE, ENTER_FRAME, FRAME_CONSTRUCTED, EXIT_FRAME, and RENDER
      listeners place their DisplayObject into a static type registry; removing
      the final listener removes that object from the registry.
    status: covered
    scenarios:
      - "events/advanced:broadcast"
      - "events/advanced:frameAndRender"

  - id: events.STG.broadcast-order-registry-insertion-order-order-objects
    section: "Frame and render broadcasts"
    behavior: >
      Broadcast order is registry insertion order (the order objects first gain a
      listener), not display-list walk order. Reordering or reparenting the
      display list does not reorder the registry. Detached objects with stage ==
      null are eligible too.
    status: covered
    scenarios:
      - "events/advanced:broadcast"

  - id: events.STG.open-fl-iterates-live-registry-invokes-private
    section: "Frame and render broadcasts"
    behavior: >
      OpenFL iterates the live registry and invokes the private local dispatcher
      with one shared Event. Removal and addition during a broadcast affect the
      live iteration, and dispatch metadata is retained across local dispatches.
    status: covered
    scenarios:
      - "events/advanced:broadcast"

  - id: events.STG.calling-public-dispatch-also-introduces-ancestor-capture
    section: "Frame and render broadcasts"
    behavior: >
      Broadcast delivery uses the private local dispatcher, so broadcast events
      have neither capture nor bubble traversal.
    status: covered
    scenarios:
      - "events/advanced:broadcast"

  - id: events.STG.per-rendered-frame-source-order-frame-then
    section: "Frame and render broadcasts"
    behavior: >
      Per rendered frame, source order is ENTER_FRAME, then FRAME_CONSTRUCTED,
      then EXIT_FRAME, followed by the recursive internal __enterFrame(deltaTime)
      timeline advance. The adapter uses the same order.
    status: covered
    scenarios:
      - "events/advanced:frameAndRender"

  - id: events.STG.invalidate-coalesces-boolean-one-render-broadcast-clears
    section: "Frame and render broadcasts"
    behavior: >
      invalidate() coalesces in a Boolean. One RENDER broadcast clears it; callers
      must invalidate again for another event.
    status: covered
    scenarios:
      - "events/advanced:frameAndRender"

  - id: events.STG.open-fl-sends-render-immediately-before-renderer
    section: "Frame and render broadcasts"
    behavior: >
      OpenFL sends RENDER immediately before renderer update/draw only when the
      Stage is invalidated and that frame is actually eligible to render. Frame
      events advance first; RENDER is deferred until render-state preparation
      succeeds and immediately precedes drawing.
    status: covered
    scenarios:
      - "events/advanced:frameAndRender"

  - id: events.STG.automatic-beta-render-event-callbacks-individual-custom
    section: "Frame and render broadcasts"
    behavior: >
      Automatic beta RenderEvent callbacks for individual custom-rendered objects
      require a per-node Flight render-lifecycle bridge. This is distinct from the
      standard Stage Event.RENDER broadcast; see agents/flight-gaps.md, “Custom
      render-event lifecycle.”
    status: flight-gap
    gap: "Custom render-event lifecycle"
    scenarios: []

  - id: events.DOC.adding-child-sets-parent-connecting-detached-subtree
    section: "Display-list lifecycle events"
    behavior: >
      Adding a child sets parent and, when connecting a detached subtree to a
      Stage, sets the Stage reference before any event. It then dispatches
      bubbling ADDED on the root child, followed by non-bubbling ADDED_TO_STAGE on
      that child.
    status: covered
    scenarios:
      - "integration/display-events:addRemove"
      - "integration/display-events:descendantStageEvents"
      - "display/container:addedEvents"

  - id: events.DOC.added-participates-capture-target-bubble-routing-stage
    section: "Display-list lifecycle events"
    behavior: >
      ADDED participates in capture, target, and bubble routing. ADDED_TO_STAGE
      has bubbles == false, but its explicit display dispatch still runs capture
      before the target.
    status: covered
    scenarios:
      - "integration/display-events:addRemove"
      - "integration/display-events:descendantStageEvents"
      - "display/container:addedEvents"

  - id: events.DOC.stage-then-visits-descendants-depth-first-child
    section: "Display-list lifecycle events"
    behavior: >
      ADDED_TO_STAGE then visits descendants depth-first in child-index order,
      dispatching a target event on each descendant before recursing into its
      children. A detached subtree receives no ADDED_TO_STAGE until connected to
      Stage.
    status: covered
    scenarios:
      - "integration/display-events:addRemove"
      - "integration/display-events:descendantStageEvents"
      - "display/container:addedEvents"

  - id: events.DOC.removal-first-dispatches-bubbling-removed-while-parent
    section: "Display-list lifecycle events"
    behavior: >
      Removal first dispatches bubbling REMOVED while parent and stage still point
      to the old tree. If staged, it then dispatches REMOVED_FROM_STAGE on the
      root and descendants while those references are still intact; Stage and
      parent references are cleared only afterward.
    status: covered
    scenarios:
      - "integration/display-events:addRemove"
      - "display/container:removedEvents"

  - id: events.DOC.reparenting-through-add-child-first-invokes-old
    section: "Display-list lifecycle events"
    behavior: >
      Reparenting through addChild first invokes the old parent's full removal
      sequence. Even a move between two containers on the same Stage therefore
      produces REMOVED, REMOVED_FROM_STAGE, ADDED, and ADDED_TO_STAGE in that
      order. Reindexing a child already in the same parent produces none of these
      events.
    status: covered
    scenarios:
      - "integration/display-events:reparent"
      - "display/container:reparent"

  - id: events.DOC.open-fl-reuses-one-event-while-recursively
    section: "Display-list lifecycle events"
    behavior: >
      OpenFL reuses one Event while recursively dispatching to descendants and
      overwrites its target per direct child. Event identity, final
      target/currentTarget, default state, and stop-propagation state are retained
      across the recursive walk.
    status: covered
    scenarios:
      - "events/advanced:lifecycleReuse"

  - id: events.DOC.implementations-traverse-live-child-arrays-retain-precomputed
    section: "Display-list lifecycle events"
    behavior: >
      Both implementations traverse live child arrays and retain precomputed
      add/remove decisions across callbacks. A listener that removes, reparents,
      or inserts children during ADDED_TO_STAGE/REMOVED_FROM_STAGE can change
      which later descendants are visited or cause the outer operation to continue
      with stale assumptions. Removal during iteration and an outer add that
      continues after reentrant removal are captured explicitly.
    status: covered
    scenarios:
      - "events/advanced:lifecycleMutation"

  - id: events.DOC.open-fl-clears-stage-focus-directly-removed
    section: "Display-list lifecycle events"
    behavior: >
      OpenFL clears Stage focus when the directly removed child owns it before
      finishing REMOVED_FROM_STAGE. The source checks only the directly removed
      child, not an arbitrary focused descendant.
    status: covered
    scenarios:
      - "events/advanced:directFocusRemoval"

  - id: events.EV.s-event-subclass-clone-bodies-match-open
    section: "Event.clone() contract > Cross-cutting rules"
    behavior: >
      The adapter's event subclass clone bodies match the OpenFL 9.5.2 source;
      RenderEvent uses an equivalent public-field ColorTransform copy instead of
      the upstream private helper.
    status: covered
    scenarios:
      - "events/event-subclass-construction:cloneBehavior"

  - id: events.EV.contrary-common-expectation-that-dispatch-metadata-cleared
    section: "Event.clone() contract > Cross-cutting rules"
    behavior: >
      Contrary to the common expectation that dispatch metadata is cleared, OpenFL
      9.5.2 Event.clone() explicitly copies target, currentTarget, and eventPhase.
      Most subclass overrides do the same. Public redispatch then overwrites
      target/currentTarget as listeners are invoked.
    status: covered
    scenarios:
      - "ui/mouse:mouseEventClone"
      - "events/redispatch:cloneRedispatch"

  - id: events.EV.requested-clone-should-not-preserve-target-current
    section: "Event.clone() contract > Cross-cutting rules"
    behavior: >
      A direct post-dispatch clone confirms the 9.5.2 source contract: clone
      preserves target, currentTarget, and eventPhase, despite contrary wording
      in some API documentation.
    status: covered
    scenarios:
      - "events/advanced:postDispatchClone"

  - id: events.EV.cancellation-flags-default-prevented-state-update-after
    section: "Event.clone() contract > Cross-cutting rules"
    behavior: >
      Cancellation flags, default-prevented state, and updateAfterEvent flags are
      not copied; the clone keeps fresh constructor/default internal state.
    status: covered
    scenarios:
      - "events/construction:cloned"
      - "events/propagation:preventDefault"

  - id: events.EV.non-pooled-eval-capture-untouched-event-s
    section: "Event.clone() contract > Cross-cutting rules"
    behavior: >
      In the non-pooled eval capture, an untouched Event's internal
      default-prevented flag can remain null rather than an explicit false; the
      existing propagation fixture records that source edge and the adapter
      matches.
    status: covered
    scenarios:
      - "events/propagation:preventDefault"

  - id: events.EV.payload-copies-generally-shallow-arrays-byte-arrays
    section: "Event.clone() contract > Cross-cutting rules"
    behavior: >
      Payload copies are generally shallow: arrays, ByteArrays, Rectangles,
      devices, sockets, and dynamic objects are passed by reference. RenderEvent
      is the notable deep-copy case for its matrix and color transform.
    status: covered
    scenarios:
      - "events/clone-inventory:dnsResolver"
      - "events/clone-inventory:datagram"
      - "events/clone-inventory:nativeWindowBounds"
      - "events/clone-inventory:netStatus"
      - "events/event-subclass-construction:renderEvent"

  - id: events.EV.six-direct-return-overrides-omit-dispatch-metadata
    section: "Event.clone() contract > Cross-cutting rules"
    behavior: >
      Six direct-return overrides omit dispatch metadata: DNSResolverEvent,
      DatagramSocketDataEvent, DeviceRotationEvent, GeolocationEvent,
      ScreenMouseEvent, and ServerSocketConnectEvent. Their payload is copied, but
      the new event starts with null target/currentTarget and AT_TARGET phase.
    status: covered
    scenarios:
      - "events/clone-inventory:dnsResolver"
      - "events/clone-inventory:datagram"
      - "events/clone-inventory:deviceRotation"
      - "events/clone-inventory:geolocation"
      - "events/clone-inventory:screenMouse"
      - "events/clone-inventory:serverSocket"

  - id: events.EV.file-list-event-invoke-event-output-progress
    section: "Event.clone() contract > Cross-cutting rules"
    behavior: >
      FileListEvent, InvokeEvent, and OutputProgressEvent do not override clone at
      all. Inherited Event.clone() returns a base Event, so their concrete type
      and subclass payload are lost. The adapter preserves this upstream source
      behavior.
    status: covered
    scenarios:
      - "events/clone-inventory:fileList"
      - "events/clone-inventory:invoke"
      - "events/clone-inventory:outputProgress"

  - id: events.EV.render-event-clone-assumes-non-null-object
    section: "Event.clone() contract > Cross-cutting rules"
    behavior: >
      RenderEvent.clone() assumes non-null objectMatrix and objectColorTransform;
      cloning a default-constructed instance fails while dereferencing them. The
      adapter has the same edge behavior.
    status: covered
    scenarios:
      - "events/event-subclass-construction:renderEvent"

  - id: events.E.event-clone
    section: "Event.clone() contract > Clone inventory"
    behavior: >
      Event.clone() copies none. Metadata and notable omissions: copied.
