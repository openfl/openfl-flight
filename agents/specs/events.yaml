    section: Event public surface > Post-dispatch rendering
    behavior: >-
      KeyboardEvent, MouseEvent, TimerEvent, and TouchEvent updateAfterEvent set a per-instance
      render-request flag without changing cancellation state. Stage consumes keyboard/mouse flags
      after routed dispatch; constructor reuse and clone reset the flag. Timer/touch consumption and
      repeated/direct-dispatch boundaries are not independently captured.
