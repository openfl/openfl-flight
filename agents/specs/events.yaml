  - id: events.API.event-dispatcher-interface-and-event-type-surface
    section: Compile-only public surface
    behavior: >-
      IEventDispatcher exposes the same generic EventType listener signatures and defaults as
      EventDispatcher for add/remove, dispatch, hasEventListener, and willTrigger. EventDispatcher
      construction, registration, removal, routing, cancellation, and ancestor lookup exercise that
      interface contract without adding a second runtime implementation.
