    section: Event public surface > String formatting
    behavior: >-
      Event.formatToString uses a Rest<String> signature on Haxe 4.2+ and five nullable parameters
      earlier, reflects each named field, quotes strings, and emits bracketed class/name pairs in
      argument order. Event and every subclass toString override choose a source-specific class name
      and payload list; classes without an override inherit Event formatting.
