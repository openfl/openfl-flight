  - id: events.UEE.listener-enabled-state-and-build-flags
    section: UncaughtErrorEvents
    behavior: >-
      UncaughtErrorEvents starts enabled unless openfl_disable_handle_error is set without
      openfl_enable_handle_error. Adding an UNCAUGHT_ERROR listener enables it in handling-enabled
      builds. Removing a non-final listener updates enabled state as intended, but removing the
      final UNCAUGHT_ERROR listener first clears EventDispatcher's map and then dereferences that
      null map, throwing before it can disable the flag. Listeners of other types do not control it.
    source:
      - events/ErrorEvent.hx:ERROR
      - events/ErrorEvent.hx:new
      - events/UncaughtErrorEvent.hx:UNCAUGHT_ERROR
      - events/UncaughtErrorEvent.hx:error
      - events/UncaughtErrorEvent.hx:new
      - events/UncaughtErrorEvents.hx:new
    scenarios:
      - events/public-surface:uncaughtErrorEvents
    notes: >-
      The fixture covers the default handling-enabled build. The opposite initial state requires a
      second harness compilation with openfl_disable_handle_error and without openfl_enable_handle_error.
  - id: events.PKG.sys-air-and-backend-conditional-surface
