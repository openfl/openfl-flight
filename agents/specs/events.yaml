    behavior: >-
      DNSResolverEvent, DeviceRotationEvent, FileListEvent, GeolocationEvent, InvokeEvent,
      NativeWindowBoundsEvent, NativeWindowDisplayStateEvent, OutputProgressEvent, and
      ScreenMouseEvent exist on the non-Flash sys/AIR-doc branch; NativeProcessExitEvent and the
      standard-stream IOError/Progress constants additionally require Haxe 4 sys. SampleDataEvent's
      audio-buffer checks differ between HTML5 and lime_openal. No compile/behavior matrix verifies
      these target gates and backend-specific sample-count errors.
